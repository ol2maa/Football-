<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>كرة القدم ⚽️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#16803c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:none;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:100%;height:100%;max-width:700px;max-height:100%;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 50px,rgba(0,0,0,.035) 50px,rgba(0,0,0,.035) 100px),#16803c;touch-action:none;overscroll-behavior:none}
.center-line{position:absolute;width:100%;height:2px;left:0;top:50%;background:rgba(255,255,255,.55);pointer-events:none}
.center-circle{position:absolute;width:170px;height:170px;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.55);border-radius:50%;pointer-events:none}
.goal{position:absolute;left:50%;width:190px;height:48px;transform:translateX(-50%);z-index:3;pointer-events:none}
#topGoal{top:0}#bottomGoal{bottom:0}
.goalNet{position:absolute;left:50%;width:190px;height:48px;transform:translateX(-50%);border-left:2px solid rgba(255,255,255,.65);border-right:2px solid rgba(255,255,255,.65);background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.08) 2px,transparent 2px,transparent 8px);opacity:.8}
.goalPost{position:absolute;width:12px;height:58px;background:#fff;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.goalPost.left{left:0;top:0}.goalPost.right{right:0;top:0}.goalCrossbar{position:absolute;left:0;top:0;width:100%;height:12px;background:#fff;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
#bottomGoal .goalPost{top:auto;bottom:0}#bottomGoal .goalCrossbar{top:auto;bottom:0}
#score{position:absolute;top:82px;left:50%;transform:translateX(-50%);color:#fff;font-size:24px;font-weight:bold;background:rgba(0,0,0,.35);padding:5px 18px;border-radius:20px;z-index:35;text-shadow:0 2px 4px #000}
#goalMessage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);color:#fff;font-size:42px;font-weight:900;text-shadow:0 4px 10px rgba(0,0,0,.8);background:rgba(0,0,0,.45);padding:15px 28px;border-radius:25px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#goalMessage.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.playerUnit{position:absolute;width:38px;height:38px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);z-index:10;display:flex;justify-content:center;align-items:center;font-size:23px;touch-action:none}
.playerUnit.blue{background:#1769ff}.playerUnit.red{background:#e53935}
.playerUnit.controlled{box-shadow:0 0 0 3px rgba(255,215,0,.45),0 4px 10px rgba(0,0,0,.35)}
.controlArrow{position:absolute;left:50%;top:-19px;transform:translateX(-50%);color:#ffd400;font-size:15px;font-weight:900;line-height:1;text-shadow:0 2px 3px #000;opacity:0;pointer-events:none}
.playerUnit.controlled .controlArrow{opacity:1}
#ball{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #222;box-shadow:0 3px 7px rgba(0,0,0,.35);transform:translate(-50%,-50%);z-index:9;display:flex;justify-content:center;align-items:center;font-size:14px;pointer-events:none}
#aim{position:absolute;width:78px;height:4px;background:#ffd400;border-radius:5px;transform-origin:left center;z-index:8;pointer-events:none;box-shadow:0 0 6px rgba(255,215,0,.8)}
#aim::after{content:"";position:absolute;right:-2px;top:50%;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid #ffd400;transform:translateY(-50%)}
#powerBox{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:190px;height:18px;border:2px solid #fff;border-radius:20px;background:rgba(0,0,0,.35);overflow:hidden;z-index:30}
#power{width:0;height:100%;background:#ffd400;border-radius:20px}
#powerText{position:absolute;top:42px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;text-shadow:0 2px 4px #000;z-index:30;white-space:nowrap}
#movePad{position:absolute;left:22px;bottom:28px;width:150px;height:150px;border-radius:50%;background:rgba(0,0,0,.12);border:3px solid rgba(255,255,255,.35);box-shadow:0 5px 12px rgba(0,0,0,.25);z-index:40;touch-action:none}
#joystickCenter{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.30);border:3px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.35);pointer-events:none;transition:transform .04s linear}
.moveArrow{position:absolute;color:#fff;font-size:24px;font-weight:bold;opacity:.85;pointer-events:none;text-shadow:0 2px 4px #000}
#arrowUp{left:50%;top:10px;transform:translateX(-50%)}#arrowDown{left:50%;bottom:10px;transform:translateX(-50%)}#arrowLeft{left:10px;top:50%;transform:translateY(-50%)}#arrowRight{right:10px;top:50%;transform:translateY(-50%)}
#kickControl{position:absolute;right:22px;bottom:28px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);border:5px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.35);z-index:40;touch-action:none;display:flex;justify-content:center;align-items:center}
#kickButton{width:68px;height:68px;border-radius:50%;background:#e53935;color:#fff;font-size:34px;display:flex;justify-content:center;align-items:center;pointer-events:none;transition:transform .08s}
#kickDot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 7px rgba(255,255,255,.9);left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0}
#info{position:absolute;top:72px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:20px;z-index:30;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<div class="center-line"></div><div class="center-circle"></div>
<div class="goal" id="topGoal"><div class="goalNet"></div><div class="goalPost left"></div><div class="goalPost right"></div><div class="goalCrossbar"></div></div>
<div class="goal" id="bottomGoal"><div class="goalNet"></div><div class="goalPost left"></div><div class="goalPost right"></div><div class="goalCrossbar"></div></div>
<div id="score">0 - 0</div><div id="goalMessage">GOAL! ⚽️🎉</div>

<div id="player" class="playerUnit blue"><div class="controlArrow">▼</div>🧍</div>
<div id="teammate1" class="playerUnit blue"><div class="controlArrow">▼</div>🧍</div>
<div id="teammate2" class="playerUnit blue"><div class="controlArrow">▼</div>🧍</div>
<div id="teammate3" class="playerUnit blue"><div class="controlArrow">▼</div>🧍</div>
<div id="teammate4" class="playerUnit blue"><div class="controlArrow">▼</div>🧍</div>

<div id="opponent1" class="playerUnit red">🧍</div>
<div id="opponent2" class="playerUnit red">🧍</div>
<div id="opponent3" class="playerUnit red">🧍</div>
<div id="opponent4" class="playerUnit red">🧍</div>
<div id="opponent5" class="playerUnit red">🧍</div>

<div id="ball">⚽</div><div id="aim"></div>
<div id="powerBox"><div id="power"></div></div><div id="powerText">قوة الركلة</div>

<div id="movePad">
<div class="moveArrow" id="arrowUp">▲</div><div class="moveArrow" id="arrowDown">▼</div>
<div class="moveArrow" id="arrowLeft">◀</div><div class="moveArrow" id="arrowRight">▶</div>
<div id="joystickCenter"></div>
</div>

<div id="kickControl"><div id="kickButton">👟</div><div id="kickDot"></div></div>
<div id="info">حرّك إصبعك للتحكم • الحركة والركل معًا</div>
</div>

<script>
/* =================================================
   العناصر
================================================= */
const game=document.getElementById("game"),ball=document.getElementById("ball"),aim=document.getElementById("aim"),
kickControl=document.getElementById("kickControl"),kickButton=document.getElementById("kickButton"),kickDot=document.getElementById("kickDot"),
powerBar=document.getElementById("power"),movePad=document.getElementById("movePad"),joystickCenter=document.getElementById("joystickCenter"),
scoreElement=document.getElementById("score"),goalMessage=document.getElementById("goalMessage");

let gameWidth=game.clientWidth,gameHeight=game.clientHeight;

/* =================================================
   الفريق الأزرق
================================================= */
const teamPlayers=[
{id:"player",el:document.getElementById("player"),role:"forward",x:gameWidth*.50,y:gameHeight*.48,anchorX:.50,anchorY:.48,speed:1.0},
{id:"teammate1",el:document.getElementById("teammate1"),role:"wing",x:gameWidth*.20,y:gameHeight*.55,anchorX:.20,anchorY:.55,speed:.72},
{id:"teammate2",el:document.getElementById("teammate2"),role:"wing",x:gameWidth*.80,y:gameHeight*.55,anchorX:.80,anchorY:.55,speed:.72},
{id:"teammate3",el:document.getElementById("teammate3"),role:"defense",x:gameWidth*.30,y:gameHeight*.70,anchorX:.30,anchorY:.70,speed:.68},
{id:"teammate4",el:document.getElementById("teammate4"),role:"defense",defensiveAnchor:true,x:gameWidth*.70,y:gameHeight*.82,anchorX:.70,anchorY:.82,speed:.55}
];

/* =================================================
   الفريق الأحمر
   الأحمر يهاجم إلى الأسفل
================================================= */
const opponents=[
{id:"opponent1",el:document.getElementById("opponent1"),role:"forward",x:gameWidth*.50,y:gameHeight*.20,anchorX:.50,anchorY:.20,speed:.62},
{id:"opponent2",el:document.getElementById("opponent2"),role:"wing",x:gameWidth*.18,y:gameHeight*.38,anchorX:.18,anchorY:.38,speed:.65},
{id:"opponent3",el:document.getElementById("opponent3"),role:"wing",x:gameWidth*.82,y:gameHeight*.38,anchorX:.82,anchorY:.38,speed:.65},
{id:"opponent4",el:document.getElementById("opponent4"),role:"defense",defensive:true,x:gameWidth*.50,y:gameHeight*.16,anchorX:.50,anchorY:.16,speed:.50},
{id:"opponent5",el:document.getElementById("opponent5"),role:"builder",x:gameWidth*.70,y:gameHeight*.28,anchorX:.70,anchorY:.28,speed:.58}
];

/* =================================================
   التحكم والكرة
================================================= */
let activePlayerIndex=0;
let ballX=gameWidth/2,ballY=gameHeight/2-42,ballVX=0,ballVY=0,ballMoving=false;
let ballOwner=teamPlayers[0];
let aimAngle=-Math.PI/2;
const friction=.985;
let charging=false,power=0;
const maxPower=100,powerSpeed=1.4;
let topScore=0,bottomScore=0,goalScored=false,goalTimer=null;
const goalWidth=190,postWidth=12,ballRadius=15;

let movePointerId=null,moveTouching=false,moveX=0,moveY=0;
let kickPointerId=null,kickTouching=false,kickDirectionDistance=0;
const kickChargeDistance=35;

const manualSwitchMinDistance=55,manualSwitchDot=.70,manualSwitchCooldown=500;
let manualControlLock=false,lastManualSwitchTime=0,manualSwitchArmed=true;
let lastAutoSwitchTime=0;const autoSwitchCooldown=300;

/* =================================================
   ذكاء الأحمر - الحالة
================================================= */
let redPressIndex=-1;
let redTackleIndex=-1;
let redTackleFrames=0;
let redDecisionCooldown=0;
let redPassCooldown=0;
let redLastAction="formation";

const RED_MAX_PRESSERS=1;
const RED_SUPPORT_DISTANCE=155;
const RED_TACKLE_DISTANCE=39;
const RED_TACKLE_FRAMES=10;
const RED_SHOOT_DISTANCE=235;
const RED_PASS_DISTANCE=270;
const RED_DRIBBLE_DISTANCE=120;

/* =================================================
   أدوات عامة
================================================= */
function distanceBetween(x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1;
    return Math.sqrt(dx*dx+dy*dy);
}
function getActivePlayer(){return teamPlayers[activePlayerIndex]}
function isTeamPlayer(p){return teamPlayers.includes(p)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pointToSegmentDistance(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1;
    const len2=dx*dx+dy*dy;
    if(len2<.001)return distanceBetween(px,py,x1,y1);
    let t=((px-x1)*dx+(py-y1)*dy)/len2;
    t=clamp(t,0,1);
    return distanceBetween(px,py,x1+t*dx,y1+t*dy);
}
function redCanPassTo(from,to){
    if(!to)return false;
    for(const blue of teamPlayers){
        const d=pointToSegmentDistance(blue.x,blue.y,from.x,from.y,to.x,to.y);
        if(d<34)return false;
    }
    return true;
}
function getNearestRedToBall(){
    let best=null,bd=Infinity;
    opponents.forEach(p=>{
        const d=distanceBetween(p.x,p.y,ballX,ballY);
        if(d<bd){bd=d;best=p}
    });
    return {player:best,distance:bd};
}

/* =================================================
   اختيار اللاعب الأزرق
================================================= */
function autoSelectClosestPlayer(){
    if(goalScored)return;

    if(ballOwner&&isTeamPlayer(ballOwner)){
        const index=teamPlayers.indexOf(ballOwner);
        if(index!==-1&&index!==activePlayerIndex){
            activePlayerIndex=index;
            manualControlLock=false;
            manualSwitchArmed=true;
        }
        return;
    }

    const now=Date.now();
    if(now-lastAutoSwitchTime<autoSwitchCooldown)return;

    let closestIndex=-1,closestDistance=Infinity;
    teamPlayers.forEach((p,index)=>{
        const d=distanceBetween(p.x,p.y,ballX,ballY);
        if(d<closestDistance){closestDistance=d;closestIndex=index}
    });
    if(closestIndex===-1)return;

    const active=getActivePlayer();
    const activeDistance=distanceBetween(active.x,active.y,ballX,ballY);
    if(closestIndex!==activePlayerIndex&&closestDistance<activeDistance-20){
        activePlayerIndex=closestIndex;
        lastAutoSwitchTime=now;
        manualControlLock=false;
        manualSwitchArmed=true;
    }
}

/* =================================================
   وضع الكرة مع صاحبها
================================================= */
function placeBallWithOwner(){
    if(!ballOwner)return;
    const distance=34;
    ballX=ballOwner.x+Math.cos(aimAngle)*distance;
    ballY=ballOwner.y+Math.sin(aimAngle)*distance;
}

/* =================================================
   الرسم
================================================= */
function draw(){
    teamPlayers.forEach((p,index)=>{
        p.el.style.left=p.x+"px";p.el.style.top=p.y+"px";
        p.el.classList.toggle("controlled",index===activePlayerIndex);
    });
    opponents.forEach(p=>{
        p.el.style.left=p.x+"px";p.el.style.top=p.y+"px";
    });
    ball.style.left=ballX+"px";ball.style.top=ballY+"px";
    aim.style.left=ballX+"px";aim.style.top=ballY+"px";
    aim.style.transform=`rotate(${aimAngle}rad)`;
    if(ballMoving)aim.style.opacity=".25";
    else aim.style.opacity=ballOwner&&isTeamPlayer(ballOwner)?"1":"0";
}

/* =================================================
   حدود المراكز
================================================= */
function getRoleBounds(p){
    if(isTeamPlayer(p)){
        if(p.role==="defense"){
            if(p.defensiveAnchor)return{minY:gameHeight*.76,maxY:gameHeight*.90};
            return{minY:gameHeight*.55,maxY:gameHeight-35};
        }
        if(p.role==="wing")return{minY:gameHeight*.24,maxY:gameHeight*.78};
        return{minY:55,maxY:gameHeight*.62};
    }
    if(p.defensive)return{minY:gameHeight*.10,maxY:gameHeight*.24};
    if(p.role==="builder")return{minY:gameHeight*.28,maxY:gameHeight*.60};
    if(p.role==="wing")return{minY:gameHeight*.22,maxY:gameHeight*.76};
    return{minY:gameHeight*.12,maxY:gameHeight*.40};
}

/* =================================================
   حركة AI
================================================= */
function moveAITo(p,targetX,targetY,speed){
    let dx=targetX-p.x,dy=targetY-p.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<2)return;
    dx/=d;dy/=d;
    p.x+=dx*speed;p.y+=dy*speed;
    const radius=19;
    p.x=clamp(p.x,radius,gameWidth-radius);
    const bounds=getRoleBounds(p);
    p.y=clamp(p.y,bounds.minY,bounds.maxY);
}

/* =================================================
   ذكاء فريقنا
================================================= */
function getTeamAITarget(p){
    if(p.defensiveAnchor)return{x:gameWidth*.70+(ballX-gameWidth*.70)*.12,y:gameHeight*.82};

    if(ballOwner&&!isTeamPlayer(ballOwner)){
        if(p.role==="defense")return{x:p.anchorX*gameWidth,y:Math.max(gameHeight*.60,ballY+70)};
        if(p.role==="wing"){
            const side=p.anchorX<.5?-1:1;
            return{x:clamp(ballX+side*120,45,gameWidth-45),y:Math.max(gameHeight*.35,ballY+30)};
        }
        return{x:ballX,y:Math.min(gameHeight*.58,ballY+25)};
    }

    if(!ballOwner){
        if(p.role==="defense")return{x:p.anchorX*gameWidth,y:Math.max(gameHeight*.60,ballY+85)};
        if(p.role==="wing"){
            const side=p.anchorX<.5?-1:1;
            return{x:clamp(ballX+side*90,45,gameWidth-45),y:ballY+25};
        }
        return{x:ballX,y:Math.min(ballY+20,gameHeight*.60)};
    }

    if(isTeamPlayer(ballOwner)){
        if(p.role==="defense"){
            if(p.defensiveAnchor)return{x:gameWidth*.70+(ballX-gameWidth*.70)*.12,y:gameHeight*.82};
            const side=p.anchorX<.5?-1:1;
            return{x:clamp(ballX+side*90,45,gameWidth-45),y:clamp(ballY+100,gameHeight*.60,gameHeight*.72)};
        }
        if(p.role==="wing"){
            const side=p.anchorX<.5?-1:1;
            return{x:clamp(ballX+side*135,45,gameWidth-45),y:Math.min(gameHeight*.50,ballY+65)};
        }
        return{x:ballX,y:gameHeight*.25};
    }
    return{x:p.anchorX*gameWidth,y:p.anchorY*gameHeight};
}
function updateTeamAI(){
    teamPlayers.forEach((p,index)=>{
        if(index===activePlayerIndex||goalScored)return;
        let target=getTeamAITarget(p);
        const active=getActivePlayer();
        const d=distanceBetween(p.x,p.y,active.x,active.y);
        if(d<65&&p.defensiveAnchor!==true){
            const dx=p.x-active.x,dy=p.y-active.y,len=Math.sqrt(dx*dx+dy*dy);
            if(len>.01){target.x=p.x+(dx/len)*85;target.y=p.y+(dy/len)*85}
        }
        moveAITo(p,target.x,target.y,p.speed);
    });
}

/* =================================================
   تمركز الأحمر
================================================= */
function chooseRedPressPlayer(){
    if(!ballOwner||!isTeamPlayer(ballOwner)){
        redPressIndex=-1;
        return;
    }
    let best=-1,bestScore=Infinity;
    opponents.forEach((p,i)=>{
        if(p.defensive)return;
        let d=distanceBetween(p.x,p.y,ballX,ballY);
        if(p.role==="wing")d+=25;
        if(p.role==="forward")d-=15;
        if(p.role==="builder")d-=5;
        if(d<bestScore){bestScore=d;bestScore=d;best=i}
    });
    redPressIndex=best;
}

function getRedFormationTarget(p,index){
    if(ballOwner&&opponents.includes(ballOwner)){
        if(p===ballOwner)return{x:p.x,y:p.y};

        if(p.role==="defense"){
            if(p.defensive)return{x:gameWidth*.50+(ballX-gameWidth*.50)*.10,y:gameHeight*.17};
            return{x:gameWidth*.70+(ballX-gameWidth*.70)*.18,y:Math.max(gameHeight*.28,Math.min(gameHeight*.52,ballY-55))};
        }

        if(p.role==="wing"){
            const side=p.anchorX<.5?-1:1;
            return{
                x:clamp(p.anchorX*gameWidth+(ballX-p.anchorX*gameWidth)*.12,40,gameWidth-40),
                y:clamp(ballY-35,gameHeight*.24,gameHeight*.58)
            };
        }

        return{x:clamp(ballX+(gameWidth/2-ballX)*.25,55,gameWidth-55),y:Math.max(gameHeight*.13,ballY-80)};
    }

    if(ballOwner&&isTeamPlayer(ballOwner)){
        const isPresser=index===redPressIndex;

        if(isPresser){
            return{x:ballX,y:ballY};
        }

        if(p.role==="defense"){
            if(p.defensive){
                return{x:gameWidth*.50+(ballX-gameWidth*.50)*.12,y:gameHeight*.17};
            }
            return{
                x:clamp(gameWidth*.70+(ballX-gameWidth*.70)*.12,55,gameWidth-55),
                y:Math.max(gameHeight*.25,Math.min(gameHeight*.46,ballY-25))
            };
        }

        if(p.role==="wing"){
            const side=p.anchorX<.5?-1:1;
            return{
                x:clamp(p.anchorX*gameWidth+side*35,45,gameWidth-45),
                y:clamp(p.anchorY*gameHeight+(ballY-p.anchorY*gameHeight)*.18,gameHeight*.28,gameHeight*.62)
            };
        }

        return{
            x:clamp(gameWidth*.50+(ballX-gameWidth*.50)*.18,55,gameWidth-55),
            y:gameHeight*.22
        };
    }

    if(!ballOwner){
        const nearest=getNearestRedToBall();
        if(nearest.player===p&&nearest.distance<220)return{x:ballX,y:ballY};
    }

    return{x:p.anchorX*gameWidth,y:p.anchorY*gameHeight};
}

/* =================================================
   قطع الكرة من الأزرق
================================================= */
function tryRedTackle(){
    if(!ballOwner||!isTeamPlayer(ballOwner)||redPressIndex<0)return;
    const p=opponents[redPressIndex];
    if(!p)return;
    const d=distanceBetween(p.x,p.y,ballOwner.x,ballOwner.y);

    if(d<RED_TACKLE_DISTANCE){
        if(redTackleIndex!==redPressIndex)redTackleFrames=0;
        redTackleIndex=redPressIndex;
        redTackleFrames++;
        if(redTackleFrames>=RED_TACKLE_FRAMES){
            ballOwner=p;
            ballMoving=false;ballVX=0;ballVY=0;
            redTackleFrames=0;
            redTackleIndex=-1;
            redDecisionCooldown=25;
            aimAngle=Math.PI/2;
            placeBallWithOwner();
            redLastAction="tackle";
        }
    }else{
        redTackleFrames=0;
        redTackleIndex=-1;
    }
}

/* =================================================
   اختيار تمريرة حمراء
================================================= */
function findBestRedPasser(p){
    let best=null,bestScore=-Infinity;
    opponents.forEach(q=>{
        if(q===p)return;
        const dist=distanceBetween(p.x,p.y,q.x,q.y);
        if(dist<45||dist>RED_PASS_DISTANCE)return;

        const forward=q.y-p.y;
        let score=forward*1.4-dist*.35;

        if(q.role==="forward")score+=35;
        if(q.role==="wing")score+=15;

        if(!redCanPassTo(p,q))score-=100;

        if(score>bestScore){bestScore=score;best=q}
    });
    return best;
}

/* =================================================
   الأحمر يسدد أو يمرر أو يقود الكرة
================================================= */
function redShoot(p){
    const goalX=gameWidth/2+(p.x-gameWidth/2)*.35;
    const goalY=gameHeight+20;
    aimAngle=Math.atan2(goalY-p.y,goalX-p.x);
    ballOwner=null;
    const speed=6.0+Math.min(2.0,(gameHeight-p.y)/gameHeight*2);
    ballVX=Math.cos(aimAngle)*speed;
    ballVY=Math.sin(aimAngle)*speed;
    ballMoving=true;
    redDecisionCooldown=55;
    redLastAction="shoot";
}

function redPass(p,q){
    const dx=q.x-p.x,dy=q.y-p.y;
    aimAngle=Math.atan2(dy,dx);
    ballOwner=null;
    const speed=5.2;
    ballVX=Math.cos(aimAngle)*speed;
    ballVY=Math.sin(aimAngle)*speed;
    ballMoving=true;
    redPassCooldown=70;
    redDecisionCooldown=45;
    redLastAction="pass";
}

function updateRedWithBall(p){
    if(ballOwner!==p)return;
    if(redDecisionCooldown>0){redDecisionCooldown--;return}

    const goalDistance=gameHeight-p.y;
    const goalX=gameWidth/2;
    const goalOpen=redCanPassTo(p,{x:goalX,y:gameHeight});

    if(goalDistance<RED_SHOOT_DISTANCE&&goalOpen){
        redShoot(p);
        return;
    }

    if(redPassCooldown<=0){
        const q=findBestRedPasser(p);
        if(q){
            const betterPosition=q.y>p.y+20 || q.role==="forward";
            if(betterPosition||goalDistance>RED_SHOOT_DISTANCE){
                redPass(p,q);
                return;
            }
        }
    }

    let targetX=goalX,targetY=Math.min(gameHeight-55,p.y+RED_DRIBBLE_DISTANCE);
    let nearestBlue=null,nearestD=Infinity;

    teamPlayers.forEach(b=>{
        const d=distanceBetween(p.x,p.y,b.x,b.y);
        if(d<nearestD){nearestD=d;nearestBlue=b}
    });

    if(nearestBlue&&nearestD<95){
        const side=p.x<gameWidth/2?-1:1;
        targetX+=side*80;
    }

    targetX=clamp(targetX,40,gameWidth-40);
    aimAngle=Math.atan2(targetY-p.y,targetX-p.x);
    moveAITo(p,targetX,targetY,p.speed*.82);
    placeBallWithOwner();
    redDecisionCooldown=5;
    redLastAction="dribble";
}

/* =================================================
   AI الأحمر الرئيسي
================================================= */
function updateOpponentAI(){
    if(redPassCooldown>0)redPassCooldown--;

    if(ballOwner&&isTeamPlayer(ballOwner))chooseRedPressPlayer();
    else redPressIndex=-1;

    opponents.forEach((p,index)=>{
        if(goalScored)return;

        if(ballOwner===p){
            updateRedWithBall(p);
            return;
        }

        let target=getRedFormationTarget(p,index);

        if(!ballOwner){
            const nearest=getNearestRedToBall();
            if(nearest.player===p&&nearest.distance<210){
                target={x:ballX,y:ballY};
            }
        }

        moveAITo(p,target.x,target.y,p.speed);

        if(ballOwner&&isTeamPlayer(ballOwner)&&index===redPressIndex){
            tryRedTackle();
        }
    });

    if(ballOwner&&opponents.includes(ballOwner))placeBallWithOwner();
}

function updatePlayersAI(){
    updateTeamAI();
    updateOpponentAI();
}

/* =================================================
   التبديل اليدوي
================================================= */
function tryManualPlayerSwitch(){
    if(goalScored)return false;
    if(ballOwner&&isTeamPlayer(ballOwner))return false;

    const joystickLength=Math.sqrt(moveX*moveX+moveY*moveY);
    if(joystickLength<.25){manualSwitchArmed=true;return false}
    if(!manualSwitchArmed)return false;

    const now=Date.now();
    if(now-lastManualSwitchTime<manualSwitchCooldown)return false;

    const active=getActivePlayer();
    let bestIndex=-1,bestDot=manualSwitchDot;

    teamPlayers.forEach((p,index)=>{
        if(index===activePlayerIndex)return;
        const dx=p.x-active.x,dy=p.y-active.y;
        const distance=Math.sqrt(dx*dx+dy*dy);
        if(distance<manualSwitchMinDistance)return;
        const dot=moveX*(dx/distance)+moveY*(dy/distance);
        if(dot>bestDot){bestDot=dot;bestIndex=index}
    });

    if(bestIndex===-1)return false;
    activePlayerIndex=bestIndex;manualControlLock=true;lastManualSwitchTime=now;manualSwitchArmed=false;
    return true;
}

/* =================================================
   حركة اللاعب
================================================= */
function movePlayer(dx,dy){
    const length=Math.sqrt(dx*dx+dy*dy);
    if(length<.001)return;
    dx/=length;dy/=length;
    const p=getActivePlayer();
    p.x=clamp(p.x+dx*1.0,19,gameWidth-19);
    p.y=clamp(p.y+dy*1.0,19,gameHeight-19);
    if(ballOwner===p)placeBallWithOwner();
}

/* =================================================
   التقاط الكرة
================================================= */
function tryPickupBall(){
    if(ballOwner)return;

    let closest=null,closestDistance=Infinity;
    teamPlayers.forEach(p=>{
        const d=distanceBetween(ballX,ballY,p.x,p.y);
        if(d<32&&d<closestDistance){closest=p;closestDistance=d}
    });
    opponents.forEach(p=>{
        const d=distanceBetween(ballX,ballY,p.x,p.y);
        if(d<30&&d<closestDistance){closest=p;closestDistance=d}
    });
    if(!closest)return;

    ballOwner=closest;ballMoving=false;ballVX=0;ballVY=0;

    if(isTeamPlayer(closest)){
        activePlayerIndex=teamPlayers.indexOf(closest);
        manualControlLock=false;manualSwitchArmed=true;lastAutoSwitchTime=Date.now();
        placeBallWithOwner();
    }else{
        aimAngle=Math.atan2(gameHeight-closest.y,gameWidth/2-closest.x);
        placeBallWithOwner();
    }
}

/* =================================================
   ركلة قديمة للخصم
================================================= */
let opponentKickCooldown=0;
function aiKickOpponent(p){
    if(ballOwner!==p||opponentKickCooldown>0)return;
    redShoot(p);
    opponentKickCooldown=80;
}

/* =================================================
   القوائم والهدف
================================================= */
function collideWithPost(postX,postY){
    const dx=ballX-postX,dy=ballY-postY,distance=Math.sqrt(dx*dx+dy*dy),collisionDistance=ballRadius+postWidth/2;
    if(distance>=collisionDistance)return;
    let nx,ny;
    if(distance<.001){nx=1;ny=0}else{nx=dx/distance;ny=dy/distance}
    ballX=postX+nx*collisionDistance;ballY=postY+ny*collisionDistance;
    const velocityAlongNormal=ballVX*nx+ballVY*ny;
    if(velocityAlongNormal<0){const bounce=.55;ballVX-=(1+bounce)*velocityAlongNormal*nx;ballVY-=(1+bounce)*velocityAlongNormal*ny}
}
function handleGoalPosts(){
    const left=(gameWidth-goalWidth)/2,right=left+goalWidth;
    collideWithPost(left,10);collideWithPost(right,10);
    collideWithPost(left,gameHeight-10);collideWithPost(right,gameHeight-10);
}
function checkGoal(){
    const goalLeft=(gameWidth-goalWidth)/2,goalRight=goalLeft+goalWidth;
    const inside=ballX-ballRadius>goalLeft&&ballX+ballRadius<goalRight;
    if(!inside)return false;
    if(ballY<-ballRadius)return"top";
    if(ballY>gameHeight+ballRadius)return"bottom";
    return false;
}
function updateScore(){scoreElement.textContent=`${topScore} - ${bottomScore}`}

/* =================================================
   الهدف وإعادة اللعب
================================================= */
function scoreGoal(side){
    if(goalScored)return;
    goalScored=true;ballOwner=null;ballMoving=false;ballVX=0;ballVY=0;
    charging=false;power=0;powerBar.style.width="0%";
    if(side==="top")topScore++;else bottomScore++;
    updateScore();goalMessage.classList.add("show");ball.style.opacity="0";aim.style.opacity="0";
    clearTimeout(goalTimer);goalTimer=setTimeout(resetAfterGoal,1500);
}
function resetAfterGoal(){
    goalScored=false;goalMessage.classList.remove("show");ball.style.opacity="1";
    teamPlayers[0].x=gameWidth*.50;teamPlayers[0].y=gameHeight*.48;
    teamPlayers[1].x=gameWidth*.20;teamPlayers[1].y=gameHeight*.55;
    teamPlayers[2].x=gameWidth*.80;teamPlayers[2].y=gameHeight*.55;
    teamPlayers[3].x=gameWidth*.30;teamPlayers[3].y=gameHeight*.70;
    teamPlayers[4].x=gameWidth*.70;teamPlayers[4].y=gameHeight*.82;
    opponents[0].x=gameWidth*.50;opponents[0].y=gameHeight*.20;
    opponents[1].x=gameWidth*.20;opponents[1].y=gameHeight*.38;
    opponents[2].x=gameWidth*.80;opponents[2].y=gameHeight*.38;
    opponents[3].x=gameWidth*.50;opponents[3].y=gameHeight*.17;
    opponents[4].x=gameWidth*.70;opponents[4].y=gameHeight*.30;
    activePlayerIndex=0;manualControlLock=false;lastManualSwitchTime=0;lastAutoSwitchTime=0;manualSwitchArmed=true;
    redPressIndex=-1;redTackleIndex=-1;redTackleFrames=0;redDecisionCooldown=0;redPassCooldown=0;redLastAction="formation";
    ballOwner=teamPlayers[0];ballMoving=false;ballVX=0;ballVY=0;charging=false;power=0;powerBar.style.width="0%";
    aimAngle=-Math.PI/2;opponentKickCooldown=0;placeBallWithOwner();draw();
}

/* =================================================
   تحديث الكرة
================================================= */
function updateBall(){
    if(ballOwner){
        if(isTeamPlayer(ballOwner)&&ballOwner===getActivePlayer())placeBallWithOwner();
        if(opponents.includes(ballOwner))placeBallWithOwner();
        return;
    }
    if(!ballMoving)return;

    ballX+=ballVX;ballY+=ballVY;ballVX*=friction;ballVY*=friction;
    handleGoalPosts();

    const goal=checkGoal();
    if(goal){scoreGoal(goal);return}

    const sideRadius=15;
    if(ballX>gameWidth-sideRadius){ballX=gameWidth-sideRadius;ballVX=-Math.abs(ballVX)}
    if(ballX<sideRadius){ballX=sideRadius;ballVX=Math.abs(ballVX)}

    const goalLeft=(gameWidth-goalWidth)/2,goalRight=goalLeft+goalWidth;
    const outsideGoal=ballX-ballRadius<=goalLeft||ballX+ballRadius>=goalRight;
    if(ballY<ballRadius&&outsideGoal){ballY=ballRadius;ballVY=Math.abs(ballVY)}
    if(ballY>gameHeight-ballRadius&&outsideGoal){ballY=gameHeight-ballRadius;ballVY=-Math.abs(ballVY)}

    const speed=Math.sqrt(ballVX*ballVX+ballVY*ballVY);
    if(speed<.15){ballVX=0;ballVY=0;ballMoving=false}
}

/* =================================================
   تحديث اللعبة
================================================= */
function update(){
    if(!goalScored){
        if(opponentKickCooldown>0)opponentKickCooldown--;
        updatePlayersAI();
        autoSelectClosestPlayer();
        movePlayer(moveX,moveY);
        updateBall();
        tryPickupBall();
    }
    draw();
    requestAnimationFrame(update);
}

/* =================================================
   Joystick
================================================= */
function updateMoveJoystick(clientX,clientY){
    const rect=movePad.getBoundingClientRect(),centerX=rect.left+rect.width/2,centerY=rect.top+rect.height/2;
    let dx=clientX-centerX,dy=clientY-centerY;
    const distance=Math.sqrt(dx*dx+dy*dy),maxDistance=48;
    if(distance>maxDistance){dx=dx/distance*maxDistance;dy=dy/distance*maxDistance}
    if(distance>6){moveX=dx/maxDistance;moveY=dy/maxDistance}else{moveX=0;moveY=0}
    tryManualPlayerSwitch();
    joystickCenter.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
movePad.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();moveTouching=true;movePointerId=e.pointerId;
    try{movePad.setPointerCapture(e.pointerId)}catch(error){}
    updateMoveJoystick(e.clientX,e.clientY);
});
movePad.addEventListener("pointermove",e=>{
    if(!moveTouching||e.pointerId!==movePointerId)return;
    e.preventDefault();updateMoveJoystick(e.clientX,e.clientY);
});
function stopMoveJoystick(e){
    if(e.pointerId!==movePointerId)return;
    moveTouching=false;movePointerId=null;moveX=0;moveY=0;manualSwitchArmed=true;
    joystickCenter.style.transform="translate(-50%,-50%)";
}
movePad.addEventListener("pointerup",stopMoveJoystick);movePad.addEventListener("pointercancel",stopMoveJoystick);
movePad.addEventListener("lostpointercapture",()=>{
    moveTouching=false;movePointerId=null;moveX=0;moveY=0;manualSwitchArmed=true;joystickCenter.style.transform="translate(-50%,-50%)";
});

/* =================================================
   اتجاه الركلة
================================================= */
function updateKickDirection(clientX,clientY){
    const rect=kickControl.getBoundingClientRect(),centerX=rect.left+rect.width/2,centerY=rect.top+rect.height/2;
    let dx=clientX-centerX,dy=clientY-centerY;
    const distance=Math.sqrt(dx*dx+dy*dy);
    kickDirectionDistance=distance;
    if(distance>3)aimAngle=Math.atan2(dy,dx);
    const maxDotDistance=30;
    let dotX=dx,dotY=dy;
    if(distance>maxDotDistance){dotX=dx/distance*maxDotDistance;dotY=dy/distance*maxDotDistance}
    kickDot.style.left=`calc(50% + ${dotX}px)`;kickDot.style.top=`calc(50% + ${dotY}px)`;kickDot.style.opacity="1";
    if(ballOwner===getActivePlayer())placeBallWithOwner();
    draw();
}
function checkKickCharging(){
    if(charging)return;
    if(ballOwner!==getActivePlayer())return;
    if(kickDirectionDistance>=kickChargeDistance)startCharging();
}
function startCharging(){
    if(ballOwner!==getActivePlayer()||charging)return;
    charging=true;power=0;kickButton.style.transform="scale(.92)";chargePower();
}
function chargePower(){
    if(!charging)return;
    power=Math.min(maxPower,power+powerSpeed);powerBar.style.width=power+"%";
    if(power<maxPower)requestAnimationFrame(chargePower);
}
function kick(){
    if(!charging)return;
    if(ballOwner!==getActivePlayer()){
        charging=false;power=0;powerBar.style.width="0%";return;
    }
    charging=false;ballOwner=null;
    if(power<1)power=1;
    const minSpeed=3,maxSpeed=12,speed=minSpeed+(power/100)*(maxSpeed-minSpeed);
    ballVX=Math.cos(aimAngle)*speed;ballVY=Math.sin(aimAngle)*speed;ballMoving=true;
    power=0;powerBar.style.width="0%";kickButton.style.transform="scale(1)";
}
kickControl.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    if(ballOwner!==getActivePlayer())return;
    kickTouching=true;kickPointerId=e.pointerId;
    try{kickControl.setPointerCapture(e.pointerId)}catch(error){}
    charging=false;power=0;kickDirectionDistance=0;powerBar.style.width="0%";kickButton.style.transform="scale(1)";
    updateKickDirection(e.clientX,e.clientY);
});
kickControl.addEventListener("pointermove",e=>{
    if(!kickTouching||e.pointerId!==kickPointerId)return;
    e.preventDefault();updateKickDirection(e.clientX,e.clientY);checkKickCharging();
});
kickControl.addEventListener("pointerup",e=>{
    if(e.pointerId!==kickPointerId)return;
    e.preventDefault();updateKickDirection(e.clientX,e.clientY);
    if(charging&&ballOwner===getActivePlayer())kick();
    else{charging=false;power=0;powerBar.style.width="0%"}
    kickButton.style.transform="scale(1)";kickDot.style.opacity="0";kickTouching=false;kickPointerId=null;kickDirectionDistance=0;
});
kickControl.addEventListener("pointercancel",()=>{
    charging=false;power=0;powerBar.style.width="0%";kickButton.style.transform="scale(1)";kickDot.style.opacity="0";kickTouching=false;kickPointerId=null;kickDirectionDistance=0;
});

/* =================================================
   منع التكبير
================================================= */
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
game.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
game.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
game.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

/* =================================================
   تغيير الحجم
================================================= */
window.addEventListener("resize",()=>{
    gameWidth=game.clientWidth;gameHeight=game.clientHeight;
    teamPlayers.forEach(p=>{
        p.x=clamp(p.x,19,gameWidth-19);p.y=clamp(p.y,19,gameHeight-19);
    });
    opponents.forEach(p=>{
        p.x=clamp(p.x,19,gameWidth-19);p.y=clamp(p.y,19,gameHeight-19);
    });
    if(ballOwner)placeBallWithOwner();
});

/* =================================================
   البداية
================================================= */
updateScore();ballOwner=teamPlayers[0];placeBallWithOwner();draw();update();
</script>
</body>
