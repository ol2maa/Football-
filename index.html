<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#16803c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:none;
    overscroll-behavior:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:700px;
    overflow:hidden;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 50px,
        rgba(0,0,0,.035) 50px,
        rgba(0,0,0,.035) 100px
    ),
    #16803c;

    touch-action:none;
    overscroll-behavior:none;
}


/* =================================================
   خط المنتصف
================================================= */

.center-line{
    position:absolute;
    width:100%;
    height:2px;
    left:0;
    top:50%;
    background:rgba(255,255,255,.55);
    pointer-events:none;
    z-index:2;
}

.center-circle{
    position:absolute;
    width:170px;
    height:170px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.55);
    border-radius:50%;
    pointer-events:none;
    z-index:2;
}


/* =================================================
   الأهداف
================================================= */

.goal{
    position:absolute;
    left:50%;
    width:190px;
    height:48px;
    transform:translateX(-50%);
    z-index:5;
    pointer-events:none;
}

#topGoal{
    top:0;
}

#bottomGoal{
    top:calc(100% - 48px);
}


.goalNet{
    position:absolute;
    left:50%;
    width:190px;
    height:48px;
    transform:translateX(-50%);

    border-left:2px solid rgba(255,255,255,.65);
    border-right:2px solid rgba(255,255,255,.65);

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.08) 0,
        rgba(255,255,255,.08) 2px,
        transparent 2px,
        transparent 8px
    );

    opacity:.8;
}


.goalPost{
    position:absolute;
    width:12px;
    height:58px;
    background:#fff;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
}

.goalPost.left{
    left:0;
    top:0;
}

.goalPost.right{
    right:0;
    top:0;
}

.goalCrossbar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:12px;
    background:#fff;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
}

#bottomGoal .goalPost{
    top:auto;
    bottom:0;
}

#bottomGoal .goalCrossbar{
    top:auto;
    bottom:0;
}


/* =================================================
   النتيجة والوقت
================================================= */

#matchInfo{
    position:absolute;
    top:82px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    z-index:60;
}

#score{
    color:#fff;
    font-size:24px;
    font-weight:bold;
    background:rgba(0,0,0,.35);
    padding:5px 18px;
    border-radius:20px;
    text-shadow:0 2px 4px #000;
    white-space:nowrap;
}

#matchTime{
    color:#fff;
    font-size:22px;
    font-weight:900;
    background:rgba(0,0,0,.40);
    padding:5px 12px;
    border-radius:20px;
    text-shadow:0 2px 4px #000;
    min-width:76px;
    text-align:center;
    font-variant-numeric:tabular-nums;
}

#matchTime.warning{
    background:rgba(180,0,0,.75);
    animation:timeWarning .6s infinite alternate;
}

@keyframes timeWarning{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }

}


/* =================================================
   رسالة الهدف
================================================= */

#goalMessage{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    color:#fff;
    font-size:42px;
    font-weight:900;
    text-shadow:0 4px 10px rgba(0,0,0,.8);
    background:rgba(0,0,0,.45);
    padding:15px 28px;
    border-radius:25px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s;
}

#goalMessage.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}


/* =================================================
   نهاية المباراة
================================================= */

#matchEnd{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);
    width:300px;
    max-width:88%;
    padding:24px 18px;
    background:rgba(0,0,0,.82);
    border:3px solid rgba(255,255,255,.8);
    border-radius:25px;
    color:#fff;
    text-align:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s,transform .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
}

#matchEnd.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    pointer-events:auto;
}

#matchEndTitle{
    font-size:30px;
    font-weight:900;
    margin-bottom:10px;
}

#matchEndScore{
    font-size:38px;
    font-weight:900;
    margin-bottom:18px;
}

#newMatchButton{
    border:0;
    outline:0;
    background:#1769ff;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    padding:12px 24px;
    border-radius:16px;
    box-shadow:0 4px 10px rgba(0,0,0,.35);
}

#newMatchButton:active{
    transform:scale(.94);
}


/* =================================================
   اللاعبون
================================================= */

.playerUnit{
    position:absolute;
    width:38px;
    height:38px;
    left:0;
    top:0;

    border-radius:50%;
    border:4px solid #fff;

    box-shadow:
        0 4px 10px rgba(0,0,0,.35);

    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;

    will-change:transform;
    pointer-events:none;
}

.playerUnit.blue{
    background:#1769ff;
}

.playerUnit.red{
    background:#e53935;
}

.playerUnit.controlled{
    box-shadow:
        0 0 0 3px rgba(255,215,0,.55),
        0 4px 10px rgba(0,0,0,.35);
}

.controlArrow{
    position:absolute;
    left:50%;
    top:-20px;
    transform:translateX(-50%);
    color:#ffd400;
    font-size:15px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 3px #000;
    pointer-events:none;
}


/* =================================================
   الكرة
================================================= */

#ball{
    position:absolute;
    width:22px;
    height:22px;
    left:0;
    top:0;

    border-radius:50%;
    background:#fff;
    border:2px solid #222;

    box-shadow:
        0 3px 7px rgba(0,0,0,.35);

    z-index:25;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;

    will-change:transform;
    pointer-events:none;
}


/* =================================================
   سهم التسديد
================================================= */

#aim{
    position:absolute;
    width:78px;
    height:4px;
    left:0;
    top:0;

    background:#ffd400;
    border-radius:5px;

    z-index:24;
    pointer-events:none;

    box-shadow:
        0 0 6px rgba(255,215,0,.8);

    display:none;
}

#aim::after{
    content:"";
    position:absolute;
    right:-2px;
    top:50%;

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:14px solid #ffd400;

    transform:translateY(-50%);

/* =================================================
   قوة الركلة
================================================= */

#powerBox{

    left:50%;

    height:18px;

#power{

    height:100%;

    transform:translateX(-50%);

    font-size:14px;

    text-shadow:0 2px 4px #000;

    z-index:70;
    white-space:nowrap;

#joystickCenter{

    top:50%;

    border-radius:50%;

    background:rgba(0,0,0,.30);

    border:3px solid #fff;

    box-shadow:

.moveArrow{

    font-weight:bold;
    opacity:.85;
    pointer-events:none;
    text-shadow:0 2px 4px #000;

#arrowUp{
    left:50%;
    top:10px;

}

#arrowDown{
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
}

#arrowLeft{
    left:10px;
    top:50%;
    transform:translateY(-50%);
}

#arrowRight{
    right:10px;
    top:50%;
    transform:translateY(-50%);

/* =================================================
   الركل

#kickControl{
    position:absolute;

/* =================================================

    padding:6px 12px;

    z-index:65;

    white-space:nowrap;

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

function getRoleBounds(p){

    /*
       اللاعب الذي يتحكم به المستخدم
       يستطيع التحرك في كامل الملعب.
    */

    if(
        p.team === "blue" &&
        p === teamPlayers[activePlayerIndex]
    ){

        return {
            minX:PLAYER_RADIUS,
            maxX:worldWidth-PLAYER_RADIUS,

            minY:PLAYER_RADIUS,
            maxY:worldHeight-PLAYER_RADIUS
        };

    }


    if(p.team === "blue"){

        if(p.role === "wing"){

            return {
                minX:PLAYER_RADIUS,
                maxX:worldWidth-PLAYER_RADIUS,

                minY:worldHeight*0.18,
                maxY:worldHeight*0.52
            };

        }


        if(p.role === "forward"){

            return {
                minX:PLAYER_RADIUS,
                maxX:worldWidth-PLAYER_RADIUS,

                minY:worldHeight*0.12,
                maxY:worldHeight*0.55
            };

        }


        if(p.role === "defender"){

            return {
                minX:PLAYER_RADIUS,
                maxX:worldWidth-PLAYER_RADIUS,

                minY:worldHeight*0.58,
                maxY:worldHeight*0.90
            };

        }


        if(p.role === "guard"){

            return {
                minX:worldWidth*0.30,
                maxX:worldWidth*0.70,

                minY:worldHeight*0.84,
                maxY:worldHeight-PLAYER_RADIUS
            };

        }

    }


    if(p.team === "red"){

        if(p.role === "wing"){

            return {
                minX:PLAYER_RADIUS,
                maxX:worldWidth-PLAYER_RADIUS,

                minY:worldHeight*0.48,
                maxY:worldHeight*0.82
            };

        }


        if(p.role === "forward"){

            return {
                minX:PLAYER_RADIUS,
                maxX:worldWidth-PLAYER_RADIUS,

                minY:worldHeight*0.45,
                maxY:worldHeight*0.88
            };

        }


        if(p.role === "defender"){

            return {
                minX:PLAYER_RADIUS,
                maxX:worldWidth-PLAYER_RADIUS,

                minY:worldHeight*0.10,
                maxY:worldHeight*0.42
            };

        }


        if(p.role === "guard"){

            return {
                minX:worldWidth*0.30,
                maxX:worldWidth*0.70,

                minY:PLAYER_RADIUS,
                maxY:worldHeight*0.16
            };

        }

    }


    return {
        minX:PLAYER_RADIUS,
        maxX:worldWidth-PLAYER_RADIUS,

        minY:PLAYER_RADIUS,
        maxY:worldHeight-PLAYER_RADIUS
    };

}


/* =================================================
   تحريك لاعب
================================================= */

function movePlayer(p,dx,dy,dt){

    const length =
        Math.hypot(dx,dy);


    if(length > 1){

        dx /= length;
        dy /= length;

    }


    p.x +=
        dx * p.speed * dt;

    p.y +=
        dy * p.speed * dt;


    const bounds =
        getRoleBounds(p);


    p.x =
        clamp(
            p.x,
            bounds.minX,
            bounds.maxX
        );


    p.y =
        clamp(
            p.y,
            bounds.minY,
            bounds.maxY
        );


    if(
        Math.abs(dx)>0.01 ||
        Math.abs(dy)>0.01
    ){

        p.direction =
            Math.atan2(dy,dx);

    }

}


/* =================================================
   رسم اللاعب
================================================= */

function drawPlayer(p){

    if(!p.el)
        return;


    p.el.style.transform =
        `translate3d(
            ${p.x-PLAYER_RADIUS}px,
            ${p.y-cameraY-PLAYER_RADIUS}px,
            0
        )`;


    if(
        p === teamPlayers[activePlayerIndex]
    ){

        p.el.classList.add(
            "controlled"
        );

    }else{

        p.el.classList.remove(
            "controlled"
        );

    }

}

/* =================================================
   الكاميرا
================================================= */

function updateCamera(){

    const targetX =
        ballX -
        viewWidth/2;


    const targetY =
        ballY -
        viewHeight/2;


    const maxX =
        Math.max(
            0,
            worldWidth-viewWidth
        );


    const maxY =
        Math.max(
            0,
            worldHeight-viewHeight
        );


    const desiredX =
        clamp(
            targetX,
            0,
            maxX
        );


    const desiredY =
        clamp(
            targetY,
            0,
            maxY
        );


    cameraX +=
        (
            desiredX-cameraX
        ) *
        CAMERA_SMOOTH;


    cameraY +=
        (
            desiredY-cameraY
        ) *
        CAMERA_SMOOTH;

}

function getBlueAITarget(p){

    const d =
        Math.hypot(
            ballX-p.x,
            ballY-p.y
        );


    /*
       الجناح
    */

    if(p.role === "wing"){

        if(
            ballOwner &&
            ballOwner.team === "red" &&
            d < 210
        ){

            return {
                x:ballX,
                y:ballY
            };

        }


        return {
            x:p.anchorX,
            y:p.anchorY
        };

    }


    /*
       المهاجم
    */

    if(p.role === "forward"){

        if(
            ballOwner &&
            ballOwner.team === "red" &&
            d < 210
        ){

            return {
                x:ballX,
                y:ballY
            };

        }


        return {
            x:worldWidth/2,
            y:worldHeight*0.25
        };

    }


    /*
       المدافع
    */

    if(p.role === "defender"){

        if(
            ballOwner &&
            ballOwner.team === "red" &&
            d < 250
        ){

            return {
                x:ballX,
                y:ballY
            };

        }


        return {
            x:p.anchorX,
            y:worldHeight*0.78
        };

    }


    /*
       الحارس
    */

    if(p.role === "guard"){

        return {
            x:clamp(
                ballX,
                worldWidth*0.30,
                worldWidth*0.70
            ),

            y:worldHeight*0.94
        };

    }


    return {
        x:p.anchorX,
        y:p.anchorY

}

   AI الأزرق
================================================= */

function updateBlueAI(dt){

    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        const p =
            teamPlayers[i];


        /*
           اللاعب الذي يتحكم به المستخدم
           لا يتحرك بواسطة AI.
        */

        if(
            i === activePlayerIndex
        ){

            continue;

        const target =
            getBlueAITarget(p);


        if(!target)
            continue;


        let dx =
            target.x-p.x;

        let dy =

        const d =
            Math.hypot(dx,dy);

        dx /= d;
        dy /= d;


        p.moveX=dx;
        p.moveY=dy;


        movePlayer(
            p,
            dx,
            dy,
            dt
        );

    }

}

/* =================================================

================================================= */

function closestBluePlayer(){

    let best =
        null;

    let bestDistance =
        Infinity;


    for(
        const p of teamPlayers
    ){

        const d =
            Math.hypot(
                p.x-ballX,
                p.y-ballY
            );


        if(d < bestDistance){

            bestDistance=d;
            best=p;

        }

    }


    return best;

}

    ){

/* =================================================
   فصل اللاعبين
================================================= */

function separatePlayers(
    players,
    minimum
){

    for(
        let i=0;
        i<players.length;
        i++
    ){

        for(
            let j=i+1;
            j<players.length;
            j++
        ){

            const a =
                players[i];

            const b =
                players[j];


            const dx =
                b.x-a.x;

            const dy =
                b.y-a.y;


            const d =
                Math.hypot(dx,dy);


            if(
                d <= 0 ||
                d >= minimum
            ){

                continue;

            }


            const nx =
                dx/d;

            const ny =
                dy/d;


            const push =
                (minimum-d)/2;


            if(
                a !==
                teamPlayers[
                    activePlayerIndex
                ]
            ){

                a.x -=
                    nx*push;

                a.y -=
                    ny*push;

            }


            if(
                b !==
                teamPlayers[
                    activePlayerIndex
                ]
            ){

                b.x +=
                    nx*push;

                b.y +=
                    ny*push;

            }


            const ba =
                getRoleBounds(a);

            const bb =
                getRoleBounds(b);


            a.x =
                clamp(
                    a.x,
                    ba.minX,
                    ba.maxX
                );

            a.y =
                clamp(
                    a.y,
                    ba.minY,
                    ba.maxY
                );


            b.x =
                clamp(
                    b.x,
                    bb.minX,
                    bb.maxX
                );

            b.y =
                clamp(
                    b.y,
                    bb.minY,
                    bb.maxY
                );

        }

    }

}


/* =================================================
   استحواذ على الكرة
================================================= */

function tryBallPickup(){

    if(ballOwner)
        return;


    const blue =
        closestBluePlayer();

    const red =
        closestRedPlayer();


    const blueDistance =
        blue
        ? distance(
            blue,
            {
                x:ballX,
                y:ballY
            }
          )
        : Infinity;


    const redDistance =
        red
        ? distance(
            red,
            {
                x:ballX,
                y:ballY
            }
          )
        : Infinity;


    if(
        blueDistance <= 30 &&
        blueDistance <= redDistance
    ){

        ballOwner=blue;

        ballVX=0;
        ballVY=0;

        return;

    }


    if(
        redDistance <= 29
    ){

        ballOwner=red;

        ballVX=0;
        ballVY=0;

    }

}


/* =================================================
   تحديث الكرة
================================================= */

function updateBall(dt){

    if(ballOwner){

        const offset =
            ballOwner.team === "blue"
            ? -30
            : -30;


        ballX =
            ballOwner.x;

        ballY =
            ballOwner.y+offset;


        ballVX=0;
        ballVY=0;

        return;

    }


    ballX +=
        ballVX*dt;

    ballY +=
        ballVY*dt;


    const friction =
        Math.pow(
            FRICTION,
            dt*60
        );


    ballVX *= friction;

    ballVY *= friction;


    /*
       إذا دخلت الكرة منطقة المرمى
       نفحص الهدف أولاً.
    */

    if(
        checkGoal()
    ){

        return;

    }


    /*
       الجدار الأيسر
    */

    if(
        ballX-BALL_RADIUS < 0
    ){

        ballX =
            BALL_RADIUS;

        ballVX =
            Math.abs(ballVX)*0.72;

    }


    /*
       الجدار الأيمن
    */

    if(
        ballX+BALL_RADIUS >
        worldWidth
    ){

        ballX =
            worldWidth-BALL_RADIUS;

        ballVX =
            -Math.abs(ballVX)*0.72;

    }


    /*
       أعلى الملعب
    */

    if(
        ballY < 0
    ){

        ballY=0;

        ballVY =
            Math.abs(ballVY)*0.72;

    }


    /*
       أسفل الملعب
    */

    if(
        ballY > worldHeight
    ){

        ballY =
            worldHeight;

        ballVY =
            -Math.abs(ballVY)*0.72;

    }


    if(
        Math.hypot(
            ballVX,
            ballVY
        ) < 0.15
    ){

        ballVX=0;
        ballVY=0;

    }

}


/* =================================================
   التسديد
================================================= */

function kickBall(){

    const p =
        teamPlayers[
            activePlayerIndex
        ];


    if(
        !p ||
        ballOwner !== p
    ){

        aiming=false;
        return;

    }


    let dx =
        aimX-ballX;

    let dy =
        aimY-ballY;


    const d =
        Math.hypot(dx,dy);


    if(d < 5){

        aiming=false;
        return;

    }


    dx /= d;
    dy /= d;


    const normalizedPower =
        Math.max(
            0.15,
            chargePower/100
        );


    const speed =
        500+
        normalizedPower*850;


    ballOwner=null;


    ballX =
        p.x+dx*30;

    ballY =
        p.y+dy*30;


    ballVX =
        dx*speed;

    ballVY =
        dy*speed;


    chargePower=0;

    powerElement.style.width =
        "0%";

    powerText.textContent =
        "قوة الركلة";

    powerBox.style.display =
        "block";


    aiming=false;

    aimArrow.style.display =
        "none";

}


/* =================================================
   AI تسديد
================================================= */

function aiShoot(p){

    if(
        !p ||
        ballOwner !== p
    )
        return;


    const targetY =
        p.team === "red"
        ? worldHeight+50
        : -50;


    const targetX =
        worldWidth/2;


    let dx =
        targetX-p.x;

    let dy =
        targetY-p.y;


    const d =
        Math.hypot(dx,dy);


    if(d < 1)
        return;


    dx/=d;
    dy/=d;


    ballOwner=null;


    ballX =
        p.x+dx*30;

    ballY =
        p.y+dy*30;


    ballVX =
        dx*650;

    ballVY =
        dy*650;

}


/* =================================================
   AI تمرير
================================================= */

function aiPass(p){

    if(
        !p ||
        ballOwner !== p
    )
        return;


    const players =
        p.team === "blue"
        ? teamPlayers
        : opponents;


    let best =
        null;

    let bestScore =
        -Infinity;


    for(
        const mate of players
    ){

        if(mate === p)
            continue;


        const d =
            distance(
                p,
                mate
            );


        if(
            d < 70 ||
            d > 300
        )
            continue;


        let progress;


        if(p.team === "blue"){

            progress =
                worldHeight-mate.y;

        }else{

            progress =
                mate.y;

        }


        const score =
            progress-
            d*0.3;


        if(score>bestScore){

            bestScore=score;
            best=mate;

        }

    }


    if(!best)
        return;


    let dx =
        best.x-p.x;

    let dy =
        best.y-p.y;


    const d =
        Math.hypot(dx,dy);


    if(d<1)
        return;


    dx/=d;
    dy/=d;


    ballOwner=null;


    ballX =
        p.x+dx*30;

    ballY =
        p.y+dy*30;


    ballVX =
        dx*Math.min(
            700,
            400+d
        );

    ballVY =
        dy*Math.min(
            700,
            400+d
        );

}


/* =================================================
   AI مع الكرة
================================================= */

function updateBallAI(){

    if(!ballOwner)
        return;


    const p =
        ballOwner;


    /*
       إذا كان اللاعب الذي يتحكم به المستخدم
       لا يتدخل AI.
    */

    if(
        p === teamPlayers[
            activePlayerIndex
        ]
    ){

        return;

    }


    const targetGoalDistance =
        p.team === "blue"
        ? p.y
        : worldHeight-p.y;


    /*
       التسديد عند الاقتراب من المرمى
    */

    if(
        targetGoalDistance < 250
    ){

        if(
            Math.random()<0.04
        ){

            aiShoot(p);

            return;

        }

    }


    /*
       تمرير أحياناً
    */

    if(
        Math.random()<0.008
    ){

        aiPass(p);

        return;

    }


    /*
       وإلا يستمر اللاعب بالتحرك نحو المرمى.
    */

    let targetY =
        p.team === "blue"
        ? 0
        : worldHeight;


    let dx =
        worldWidth/2-p.x;

    let dy =
        targetY-p.y;


    const d =
        Math.hypot(dx,dy);


    if(d>1){

        dx/=d;
        dy/=d;

        movePlayer(
            p,
            dx,
            dy,
            1/60
        );

    }

}


/* =================================================
   الافتكاك
================================================= */

function tackle(){

    if(!ballOwner)
        return;


    if(
        ballOwner.team === "blue"
    ){

        const red =
            closestRedPlayer();


        if(
            red &&
            distance(
                red,
                ballOwner
            ) < 38
        ){

            if(
                Math.random()<0.025
            ){

                ballOwner=red;

                ballVX=0;
                ballVY=0;

            }

        }

    }


    else{

        const blue =
            closestBluePlayer();


        if(
            blue &&
            distance(
                blue,
                ballOwner
            ) < 38
        ){

            if(
                Math.random()<0.04
            ){

                ballOwner=blue;

                ballVX=0;
                ballVY=0;

            }

        }

    }

}


/* =================================================
   الهدف
================================================= */

function checkGoal(){

    /*
       الكرة وصلت أعلى الملعب
       = هدف للأزرق
    */

    if(
        ballY <= 8 &&
        Math.abs(
            ballX-worldWidth/2
        ) <= GOAL_WIDTH/2
    ){

        blueScore++;

        updateScore();

        showGoal(
            "GOAL! 🔵⚽"
        );

        resetAfterGoal(
            "blue"
        );

        return true;

    }


    /*
       الكرة وصلت أسفل الملعب
       = هدف للأحمر
    */

    if(
        ballY >= worldHeight-8 &&
        Math.abs(
            ballX-worldWidth/2
        ) <= GOAL_WIDTH/2
    ){

        redScore++;

        updateScore();

        showGoal(
            "GOAL! 🔴⚽"
        );

        resetAfterGoal(
            "red"
        );

        return true;

    }


    return false;

}


/* =================================================
   عرض النتيجة
================================================= */

function updateScore(){

    scoreElement.textContent =
        `${blueScore} - ${redScore}`;

}


/* =================================================
   رسالة الهدف
================================================= */

function showGoal(text){

    goalMessage.textContent =
        text;

    goalMessage.classList.add(
        "show"
    );


    setTimeout(
        () => {

            goalMessage.classList.remove(
                "show"
            );

        },
        1200
    );

}


/* =================================================
   بعد الهدف
================================================= */

function resetAfterGoal(scoringTeam){

    ballVX=0;
    ballVY=0;


    /*
       إعادة الجميع إلى مراكزهم.
    */

    for(
        const p of teamPlayers
    ){

        p.x=p.anchorX;
        p.y=p.anchorY;

    }


    for(
        const p of opponents
    ){

        p.x=p.anchorX;
        p.y=p.anchorY;

    }


    /*
       الفريق الذي سجل يبدأ بالكرة.
    */

    if(
        scoringTeam === "blue"
    ){

        ballOwner =
            teamPlayers[
                activePlayerIndex
            ];

    }else{

        ballOwner =
            opponents[0];

    }


    ballX =
        ballOwner.x;

    ballY =
        ballOwner.y-30;


    /*
       الكاميرا تتبع مكان الكرة الجديد
       مباشرة.
    */

    cameraX=0;

    cameraY =
        clamp(
            ballY-viewHeight/2,
            0,
            worldHeight-viewHeight
        );


    draw();

}


/* =================================================
   شحن الركلة
================================================= */

function startCharging(){

    if(
        matchEnded
    )
        return;


    const p =
        teamPlayers[
            activePlayerIndex
        ];


    if(
        !p ||
        ballOwner !== p
    ){

        return;

    }


    aiming=true;

    chargePower=0;

    powerElement.style.width =
        "0%";

    powerText.textContent =
        "0";

}


/* =================================================
   تحديث قوة الركلة
================================================= */

function updateCharge(dt){

    if(!aiming)
        return;


    chargePower +=
        POWER_SPEED*dt;


    chargePower =
        Math.min(
            MAX_POWER,
            chargePower
        );


    powerElement.style.width =
        `${chargePower}%`;


    powerText.textContent =
        Math.round(
            chargePower
        );

}


/* =================================================
   تحديد اتجاه الركلة
================================================= */

function updateAim(
    clientX,
    clientY
){

    const rect =
        game.getBoundingClientRect();


    aimX =
        clientX-
        rect.left+
        cameraX;


    aimY =
        clientY-
        rect.top+
        cameraY;

}


/* =================================================
   إنهاء الركلة
================================================= */

function finishKick(){

    if(!aiming)
        return;


    kickBall();

}


/* =================================================
   Joystick
================================================= */

function resetJoystick(){

    joystickActive=false;

    joystickPointerId=null;

    joystickX=0;
    joystickY=0;


    joystickCenter.style.transform =
        "translate(-50%,-50%)";

}


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        movePad.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;


    const centerY =
        rect.top+
        rect.height/2;


    let dx =
        clientX-centerX;

    let dy =
        clientY-centerY;


    const d =
        Math.hypot(dx,dy);


    if(
        d >
        JOYSTICK_MAX_DISTANCE
    ){

        dx =
            dx/d*
            JOYSTICK_MAX_DISTANCE;

        dy =
            dy/d*
            JOYSTICK_MAX_DISTANCE;

    }


    joystickX =
        dx/
        JOYSTICK_MAX_DISTANCE;


    joystickY =
        dy/
        JOYSTICK_MAX_DISTANCE;


    joystickCenter.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


/* =================================================
   Joystick Events
================================================= */

movePad.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        joystickActive=true;

        joystickPointerId=
            e.pointerId;


        movePad.setPointerCapture(
            e.pointerId
        );


        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);


movePad.addEventListener(
    "pointermove",
    e => {

        if(
            !joystickActive ||
            e.pointerId !==
            joystickPointerId
        )
            return;


        e.preventDefault();


        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);


movePad.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;


        resetJoystick();

    }
);


movePad.addEventListener(
    "pointercancel",
    e => {

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;


        resetJoystick();

    }
);


/* =================================================
   زر الركل
================================================= */

kickControl.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        kickPointerId=
            e.pointerId;

        startCharging();

    }
);


kickControl.addEventListener(
    "pointermove",
    e => {

        if(
            !aiming
        )
            return;


        updateAim(
            e.clientX,
            e.clientY
        );

    }
);


kickControl.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerId !==
            kickPointerId
        )
            return;


        finishKick();

        kickPointerId=null;

    }
);


kickControl.addEventListener(
    "pointercancel",
    e => {

        if(
            e.pointerId !==
            kickPointerId
        )
            return;


        finishKick();

        kickPointerId=null;

    }
);


/* =================================================
   تحريك اتجاه التسديد
================================================= */

game.addEventListener(
    "pointermove",
    e => {

        if(
            aiming
        ){

            updateAim(
                e.clientX,
                e.clientY
            );

        }

    }
);


/* =================================================
   تبديل اللاعب
   بالنقر المزدوج
================================================= */

let lastTapTime=0;


game.addEventListener(
    "pointerdown",
    e => {

        /*
           لا نبدل اللاعب إذا كان اللمس
           على عناصر التحكم.
        */

        if(
            e.target === movePad ||
            movePad.contains(e.target) ||
            e.target === kickControl ||
            kickControl.contains(e.target)
        ){

            return;

        }


        const now =
            performance.now();


        if(
            now-lastTapTime <
            320
        ){

            switchPlayer();

        }


        lastTapTime=now;

    }
);


/* =================================================
   تبديل اللاعب
================================================= */

function switchPlayer(){

    const current =
        teamPlayers[
            activePlayerIndex
        ];


    let bestIndex=-1;

    let bestDistance=
        Infinity;


    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        if(
            i === activePlayerIndex
        )
            continue;


        const p =
            teamPlayers[i];


        const d =
            Math.hypot(
                p.x-ballX,
                p.y-ballY
            );


        if(
            d < bestDistance
        ){

            bestDistance=d;

            bestIndex=i;

        }

    }


    if(
        bestIndex >= 0 &&
        bestDistance <=
        MANUAL_SWITCH_MIN_DISTANCE
    ){

        activePlayerIndex=
            bestIndex;


        /*
           إذا كان اللاعب الجديد بعيداً
           قليلاً، تسمح له اللعبة بالحركة
           في كامل الملعب لأنه أصبح متحكماً به.
        */

        for(
            let i=0;
            i<teamPlayers.length;
            i++
        ){

            teamPlayers[i].controlled =
                i === activePlayerIndex;

        }


        /*
           إذا كانت الكرة قريبة منه يأخذها.
        */

        const p =
            teamPlayers[
                activePlayerIndex
            ];


        if(
            !ballOwner &&
            distance(
                p,
                {
                    x:ballX,
                    y:ballY
                }
            ) < 38
        ){

            ballOwner=p;

            ballVX=0;
            ballVY=0;

        }

    }

}


/* =================================================
   تحديث اللعبة
================================================= */

function updateGame(dt){

    if(
        !matchRunning ||
        matchEnded
    )
        return;


    updateControlledPlayer(dt);

    updateBlueAI(dt);

    updateRedAI(dt);

    updateBallAI();

    tackle();

    updateCharge(dt);

    updateBall(dt);

    tryBallPickup();

    separatePlayers(
        teamPlayers,
        52
    );

    separatePlayers(
        opponents,
        58
    );

    updateCamera();

    draw();

}


/* =================================================
   المؤقت
================================================= */

function formatTime(seconds){

    seconds =
        Math.max(
            0,
            Math.ceil(seconds)
        );


    const minutes =
        Math.floor(
            seconds/60
        );


    const secs =
        seconds%60;


    return (
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(secs)
            .padStart(2,"0")
    );

}


function updateTimer(){

    matchTimeElement.textContent =
        formatTime(
            matchTimeRemaining
        );


    if(
        matchTimeRemaining <= 10
    ){

        matchTimeElement.classList.add(
            "warning"
        );

    }else{

        matchTimeElement.classList.remove(
            "warning"
        );

    }

}


/* =================================================
   تحديث الوقت
================================================= */

function updateMatchTimer(now){

    if(
        !matchRunning ||
        matchEnded
    )
        return;


    let elapsed =
        (now-matchLastTimestamp)/1000;


    matchLastTimestamp=now;


    /*
       حماية من القفزات عند العودة
       من الخلفية.
    */

    elapsed =
        Math.min(
            elapsed,
            0.1
        );


    matchTimeRemaining -=
        elapsed;


    if(
        matchTimeRemaining <= 0
    ){

        matchTimeRemaining=0;

        updateTimer();

        endMatch();

        return;

    }


    updateTimer();

}


/* =================================================
   نهاية المباراة
================================================= */

function endMatch(){

    if(matchEnded)
        return;


    matchEnded=true;

    matchRunning=false;


    ballOwner=null;

    ballVX=0;
    ballVY=0;


    aiming=false;

    chargePower=0;


    powerElement.style.width =
        "0%";


    powerText.textContent =
        "قوة الركلة";


    aimArrow.style.display =
        "none";


    resetJoystick();


    matchEndScoreElement.textContent =
        `${blueScore} - ${redScore}`;


    matchEndElement.classList.add(
        "show"
    );

}


/* =================================================
   مباراة جديدة
================================================= */

function resetMatch(){

    blueScore=0;
    redScore=0;


    updateScore();


    matchTimeRemaining=
        MATCH_DURATION;


    matchEnded=false;

    matchRunning=true;


    activePlayerIndex=0;


    /*
       إعادة مراكز الأزرق
    */

    teamPlayers[0].x=
        worldWidth/2;

    teamPlayers[0].y=
        worldHeight*0.28;


    teamPlayers[1].x=
        worldWidth*0.12;

    teamPlayers[1].y=
        worldHeight*0.36;


    teamPlayers[2].x=
        worldWidth*0.88;

    teamPlayers[2].y=
        worldHeight*0.36;


    teamPlayers[3].x=
        worldWidth/2;

    teamPlayers[3].y=
        worldHeight*0.78;


    teamPlayers[4].x=
        worldWidth/2;

    teamPlayers[4].y=
        worldHeight*0.94;


    /*
       إعادة مراكز الأحمر
    */

    opponents[0].x=
        worldWidth/2;

    opponents[0].y=
        worldHeight*0.72;


    opponents[1].x=
        worldWidth*0.12;

    opponents[1].y=
        worldHeight*0.64;


    opponents[2].x=
        worldWidth*0.88;

    opponents[2].y=
        worldHeight*0.64;


    opponents[3].x=
        worldWidth/2;

    opponents[3].y=
        worldHeight*0.22;


    opponents[4].x=
        worldWidth/2;

    opponents[4].y=
        worldHeight*0.06;


    /*
       اللاعب الأول متحكم به
    */

    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        teamPlayers[i].controlled =
            i===0;

        teamPlayers[i].moveX=0;
        teamPlayers[i].moveY=0;

    }


    /*
       الكرة مع المهاجم الأزرق
    */

    ballOwner=
        teamPlayers[0];


    ballX=
        ballOwner.x;

    ballY=
        ballOwner.y-30;


    ballVX=0;
    ballVY=0;


    /*
       الكاميرا تبدأ حول الكرة.
       هذه النقطة مهمة جداً.
    */

    cameraX=
        clamp(
            ballX-viewWidth/2,
            0,
            Math.max(
                0,
                worldWidth-viewWidth
            )
        );


    cameraY=
        clamp(
            ballY-viewHeight/2,
            0,
            Math.max(
                0,
                worldHeight-viewHeight
            )
        );


    matchEndElement.classList.remove(
        "show"
    );


    updateTimer();

    draw();

}


/* =================================================
   تغيير حجم الشاشة
================================================= */

function resizeGame(){

    viewWidth=
        game.clientWidth;


    viewHeight=
        game.clientHeight;


    worldWidth=
        viewWidth;


    worldHeight=
        viewHeight*2;


    /*
       تحديث مواقع الـanchor
    */

    teamPlayers[0].anchorX=
        worldWidth/2;

    teamPlayers[0].anchorY=
        worldHeight*0.28;


    teamPlayers[1].anchorX=
        worldWidth*0.12;

    teamPlayers[1].anchorY=
        worldHeight*0.36;


    teamPlayers[2].anchorX=
        worldWidth*0.88;

    teamPlayers[2].anchorY=
        worldHeight*0.36;


    teamPlayers[3].anchorX=
        worldWidth/2;

    teamPlayers[3].anchorY=
        worldHeight*0.78;


    teamPlayers[4].anchorX=
        worldWidth/2;

    teamPlayers[4].anchorY=
        worldHeight*0.94;


    opponents[0].anchorX=
        worldWidth/2;

    opponents[0].anchorY=
        worldHeight*0.72;


    opponents[1].anchorX=
        worldWidth*0.12;

    opponents[1].anchorY=
        worldHeight*0.64;


    opponents[2].anchorX=
        worldWidth*0.88;

    opponents[2].anchorY=
        worldHeight*0.64;


    opponents[3].anchorX=
        worldWidth/2;

    opponents[3].anchorY=
        worldHeight*0.22;


    opponents[4].anchorX=
        worldWidth/2;

    opponents[4].anchorY=
        worldHeight*0.06;


    /*
       إذا تغيرت الشاشة والكرة مع لاعب
       تبقى معه.
    */

    if(ballOwner){

        ballX=
            ballOwner.x;

        ballY=
            ballOwner.y-30;

    }


    cameraX=
        clamp(
            cameraX,
            0,
            Math.max(
                0,
                worldWidth-viewWidth
            )
        );


    cameraY=
        clamp(
            cameraY,
            0,
            Math.max(
                0,
                worldHeight-viewHeight
            )
        );


    draw();

}


window.addEventListener(
    "resize",
    resizeGame
);


/* =================================================
   الحلقة الرئيسية
================================================= */

function gameLoop(now){

    let dt =
        (now-lastFrameTime)/1000;


    lastFrameTime=now;


    dt =
        Math.min(
            dt,
            0.033
        );


    updateMatchTimer(now);

    updateGame(dt);


    requestAnimationFrame(
        gameLoop
    );

}


/* =================================================
   البداية
================================================= */

resizeGame();


/*
   الكرة تبدأ مع اللاعب.
*/

ballOwner=
    teamPlayers[0];


ballX=
    teamPlayers[0].x;

ballY=
    teamPlayers[0].y-30;


/*

*/

cameraX=

        ballX-viewWidth/2,
        0,
        Math.max(
            0,
            worldWidth-viewWidth
        )
    );


cameraY=
    clamp(
        ballY-viewHeight/2,
        0,
        Math.max(
            0,
            worldHeight-viewHeight
        )
    );


updateTimer();

draw();


lastFrameTime=
    performance.now();

matchLastTimestamp=
    performance.now();

);

================================================= */

newMatchButton.addEventListener(

    }

</script>
