<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,minimum-scale=1.0,
user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="format-detection" content="telephone=no">

<title>كرة القدم ⚽️ v3.11</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#16803c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:none;
    overscroll-behavior:none
}

body{
    display:flex;
    justify-content:center;
    align-items:center
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:700px;
    max-height:100%;
    overflow:hidden;
    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 50px,
        rgba(0,0,0,.035) 50px,
        rgba(0,0,0,.035) 100px
    ),
    #16803c;

    touch-action:none;
    overscroll-behavior:none;
    contain:layout style
}

.center-line{
    position:absolute;
    width:100%;
    height:2px;
    left:0;
    top:50%;
    background:rgba(255,255,255,.55);
    pointer-events:none
}

.center-circle{
    position:absolute;
    width:170px;
    height:170px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.55);
    border-radius:50%;
    pointer-events:none
}

.goal{
    position:absolute;
    left:50%;
    width:190px;
    height:48px;
    transform:translateX(-50%);
    z-index:3;
    pointer-events:none
}

#topGoal{
    top:0
}

#bottomGoal{
    bottom:0
}

.goalNet{
    position:absolute;
    left:50%;
    width:190px;
    height:48px;
    transform:translateX(-50%);
    border-left:2px solid rgba(255,255,255,.65);
    border-right:2px solid rgba(255,255,255,.65);

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.08) 0,
        rgba(255,255,255,.08) 2px,
        transparent 2px,
        transparent 8px
    );

    opacity:.8
}

.goalPost{
    position:absolute;
    width:12px;
    height:58px;
    background:#fff;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.35)
}

.goalPost.left{
    left:0;
    top:0
}

.goalPost.right{
    right:0;
    top:0
}

.goalCrossbar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:12px;
    background:#fff;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.35)
}

#bottomGoal .goalPost{
    top:auto;
    bottom:0
}

#bottomGoal .goalCrossbar{
    top:auto;
    bottom:0
}


/* =================================================
   النتيجة والوقت
================================================= */

#matchInfo{
    position:absolute;
    top:82px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    z-index:35;
}

#score{
    position:relative;
    top:auto;
    left:auto;
    transform:none;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    background:rgba(0,0,0,.35);
    padding:5px 18px;
    border-radius:20px;
    text-shadow:0 2px 4px #000;
    white-space:nowrap
}

#matchTime{
    color:#fff;
    font-size:22px;
    font-weight:900;
    background:rgba(0,0,0,.40);
    padding:5px 12px;
    border-radius:20px;
    text-shadow:0 2px 4px #000;
    min-width:76px;
    text-align:center;
    font-variant-numeric:tabular-nums
}

#matchTime.warning{
    background:rgba(180,0,0,.75);
    animation:timeWarning .6s infinite alternate
}

@keyframes timeWarning{

    from{
        transform:scale(1)
    }

    to{
        transform:scale(1.08)
    }

}


/* =================================================
   رسالة الهدف
================================================= */

#goalMessage{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    color:#fff;
    font-size:42px;
    font-weight:900;
    text-shadow:0 4px 10px rgba(0,0,0,.8);
    background:rgba(0,0,0,.45);
    padding:15px 28px;
    border-radius:25px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s
}

#goalMessage.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1)
}


/* =================================================
   نهاية المباراة
================================================= */

#matchEnd{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);
    width:300px;
    max-width:88%;
    padding:24px 18px;
    background:rgba(0,0,0,.82);
    border:3px solid rgba(255,255,255,.8);
    border-radius:25px;
    color:#fff;
    text-align:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s,transform .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.45)
}

#matchEnd.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    pointer-events:auto
}

#matchEndTitle{
    font-size:30px;
    font-weight:900;
    margin-bottom:10px
}

#matchEndScore{
    font-size:38px;
    font-weight:900;
    margin-bottom:18px
}

#newMatchButton{
    border:0;
    outline:0;
    background:#1769ff;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    padding:12px 24px;
    border-radius:16px;
    box-shadow:0 4px 10px rgba(0,0,0,.35)
}

#newMatchButton:active{
    transform:scale(.94)
}


/* =================================================
   اللاعب
================================================= */

.playerUnit{
    position:absolute;
    width:38px;
    height:38px;
    left:0;
    top:0;
    will-change:transform;
    border-radius:50%;
    border:4px solid #fff;
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    z-index:10;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:23px;
    touch-action:none;
    transition:box-shadow .15s
}

.playerUnit.blue{
    background:#1769ff
}

.playerUnit.red{
    background:#e53935
}

.playerUnit.controlled{
    box-shadow:
    0 0 0 3px rgba(255,215,0,.45),
    0 4px 10px rgba(0,0,0,.35)
}

.playerUnit.tackleFlash{
    animation:tackleFlash .3s ease-out
}

@keyframes tackleFlash{

    0%{
        box-shadow:0 0 0 0 rgba(255,80,80,.9)
    }

    100%{
        box-shadow:0 0 0 22px rgba(255,80,80,0)
    }

}

.controlArrow{
    position:absolute;
    left:50%;
    top:-19px;
    transform:translateX(-50%);
    color:#ffd400;
    font-size:15px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 3px #000;
    opacity:0;
    pointer-events:none
}

.playerUnit.controlled .controlArrow{
    opacity:1
}


/* =================================================
   الكرة
================================================= */

#ball{
    position:absolute;
    width:22px;
    height:22px;
    left:0;
    top:0;
    will-change:transform;
    border-radius:50%;
    background:#fff;
    border:2px solid #222;
    box-shadow:0 3px 7px rgba(0,0,0,.35);
    z-index:9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
    pointer-events:none
}

#aim{
    position:absolute;
    width:78px;
    height:4px;
    left:0;
    top:0;
    will-change:transform;
    background:#ffd400;
    border-radius:5px;
    z-index:8;
    pointer-events:none;
    box-shadow:0 0 6px rgba(255,215,0,.8)
}

#aim::after{
    content:"";
    position:absolute;
    right:-2px;
    top:50%;
    width:0;
    height:0;
    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:14px solid #ffd400;
    transform:translateY(-50%)
}


/* =================================================
   القوة
================================================= */

#powerBox{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:190px;
    height:18px;
    border:2px solid #fff;
    border-radius:20px;
    background:rgba(0,0,0,.35);
    overflow:hidden;
    z-index:30
}

#power{
    width:0;
    height:100%;
    background:#ffd400;
    border-radius:20px;
    transition:width .04s linear
}

#powerText{
    position:absolute;
    top:42px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:14px;
    text-shadow:0 2px 4px #000;
    z-index:30;
    white-space:nowrap
}


/* =================================================
   Joystick
================================================= */

#movePad{
    position:absolute;
    left:22px;
    bottom:28px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(0,0,0,.12);
    border:3px solid rgba(255,255,255,.35);

    z-index:40;
    touch-action:none
}

#joystickCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:54px;
    height:54px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(0,0,0,.30);
    border:3px solid #fff;
    box-shadow:0 4px 8px rgba(0,0,0,.35);
    pointer-events:none;
    transition:transform .04s linear;
    will-change:transform
}

.moveArrow{
    position:absolute;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    opacity:.85;
    pointer-events:none;
    text-shadow:0 2px 4px #000
}

#arrowUp{
    left:50%;
    top:10px;
    transform:translateX(-50%)
}

#arrowDown{
    left:50%;
    bottom:10px;
    transform:translateX(-50%)
}

#arrowLeft{
    left:10px;
    top:50%;
    transform:translateY(-50%)
}

#arrowRight{
    right:10px;
    top:50%;
    transform:translateY(-50%)
}


/* =================================================
   الركل
================================================= */

#kickControl{
    position:absolute;
    right:22px;
    bottom:28px;
    width:84px;
    height:84px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    border:5px solid #fff;
    box-shadow:0 5px 12px rgba(0,0,0,.35);
    z-index:40;
    touch-action:none;
    display:flex;
    justify-content:center;
    align-items:center
}

#kickButton{
    width:68px;
    height:68px;
    border-radius:50%;
    background:#e53935;
    color:#fff;
    font-size:34px;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
    transition:transform .08s
}

#kickDot{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 7px rgba(255,255,255,.9);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0;
    transition:opacity .1s
}


/* =================================================
   معلومات
================================================= */

#info{
    position:absolute;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:12px;
    background:rgba(0,0,0,.35);
    padding:6px 12px;
    border-radius:20px;
    z-index:30;
    white-space:nowrap;
    pointer-events:none
}

#hint{
    position:absolute;
    left:50%;
    top:56%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:16px;
    background:rgba(0,0,0,.55);
    padding:8px 16px;
    border-radius:20px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s
}

#hint.show{
    opacity:1
}

</style>
</head>

<script>

'use strict';


/* =================================================
   عناصر الواجهة
================================================= */

const game=
    document.getElementById("game");

const ball=
    document.getElementById("ball");

const aim=
    document.getElementById("aim");


const kickControl=
    document.getElementById("kickControl");

const kickButton=
    document.getElementById("kickButton");

const kickDot=
    document.getElementById("kickDot");


const powerBar=
    document.getElementById("power");


const movePad=
    document.getElementById("movePad");

const joystickCenter=
    document.getElementById("joystickCenter");


const scoreElement=
    document.getElementById("score");


const matchTimeElement=
    document.getElementById("matchTime");


const matchEndElement=
    document.getElementById("matchEnd");


const matchEndScoreElement=
    document.getElementById("matchEndScore");


const newMatchButton=
    document.getElementById("newMatchButton");


const goalMessage=
    document.getElementById("goalMessage");


const hintElement=
    document.getElementById("hint");


const centerLine=
    document.querySelector(".center-line");


const centerCircle=
    document.querySelector(".center-circle");


const topGoal=
    document.getElementById("topGoal");


const bottomGoal=
    document.getElementById("bottomGoal");


/* =================================================
   أبعاد اللعبة والعالم
================================================= */

let gameWidth=
    game.clientWidth;

let gameHeight=
    game.clientHeight;


/*
   الملعب أصبح ضعف ارتفاع الشاشة.

   gameHeight = الجزء الظاهر
   worldHeight = طول الملعب الحقيقي
*/

let worldWidth=
    gameWidth;

let worldHeight=
    gameHeight*2;


/* =================================================
   الكاميرا
================================================= */

let cameraX=0;
let cameraY=0;

const CAMERA_SMOOTH=0.08;


/*
   تحديث الكاميرا مع الكرة.

   الكاميرا تتحرك فقط عندما تتحرك الكرة
   داخل العالم الطويل.
*/

function updateCamera(){

    const targetX=
        ballX-(gameWidth/2);


    const targetY=
        ballY-(gameHeight/2);


    const maxCameraX=
        Math.max(
            0,
            worldWidth-gameWidth
        );


    const maxCameraY=
        Math.max(
            0,
            worldHeight-gameHeight
        );


    const clampedX=
        Math.max(
            0,
            Math.min(
                targetX,
                maxCameraX
            )
        );


    const clampedY=
        Math.max(
            0,
            Math.min(
                targetY,
                maxCameraY
            )
        );


    cameraX+=
        (clampedX-cameraX)*
        CAMERA_SMOOTH;


    cameraY+=
        (clampedY-cameraY)*
        CAMERA_SMOOTH;

}


/* =================================================
   وقت المباراة
================================================= */

const MATCH_DURATION=180;

let matchTimeRemaining=
    MATCH_DURATION;

let matchRunning=true;

let matchEnded=false;

let matchLastTimestamp=
    performance.now();


function formatMatchTime(seconds){

    const total=
        Math.max(
            0,
            Math.floor(seconds)
        );


    const minutes=
        Math.floor(total/60);


    const secs=
        total%60;


    return(
        String(minutes).padStart(2,"0")+
        ":"+
        String(secs).padStart(2,"0")
    );

}


function updateMatchTimeDisplay(){

    matchTimeElement.textContent=
        formatMatchTime(
            matchTimeRemaining
        );


    if(
        matchTimeRemaining<=10&&
        matchTimeRemaining>0
    ){

        matchTimeElement.classList.add(
            "warning"
        );

    }else{

        matchTimeElement.classList.remove(
            "warning"
        );

    }

}


/* =================================================
   تحديث مؤقت المباراة
================================================= */

function updateMatchTimer(now){

    if(
        !matchRunning||
        matchEnded
    )
        return;


    let elapsed=
        (now-matchLastTimestamp)/1000;


    matchLastTimestamp=now;


    /*
       منع قفزة كبيرة في الوقت
       عند الرجوع من الخلفية.
    */

    if(elapsed>0.2)
        elapsed=0.2;


    matchTimeRemaining-=
        elapsed;


    if(matchTimeRemaining<=0){

        matchTimeRemaining=0;

        updateMatchTimeDisplay();

        endMatch();

        return;

    }


    updateMatchTimeDisplay();

}


/* =================================================
   الثوابت العامة
================================================= */

const FRICTION=0.985;

const MAX_POWER=100;

const POWER_SPEED=90;

const KICK_CHARGE_DISTANCE=35;


const PLAYER_RADIUS=19;

const BALL_RADIUS=11;


const BALL_PICKUP_BLUE=32;

const BALL_PICKUP_RED=30;

const BALL_STEAL_TOUCH_DISTANCE=32;


const GOAL_WIDTH=190;

const POST_WIDTH=12;


const COLLISION_MIN_DIST=36;

const SIDE_WALL_RADIUS=15;


const MANUAL_SWITCH_MIN_DIST=55;

const MANUAL_SWITCH_DOT=0.70;

const MANUAL_SWITCH_COOLDOWN=500;

const AUTO_SWITCH_COOLDOWN=300;


/* =================================================
   حالة الكرة
================================================= */

let ballX=
    gameWidth/2;

let ballY=
    worldHeight/2-42;


let ballVX=0;

let ballVY=0;

let ballMoving=false;


/* =================================================
   حالة التحكم
================================================= */

let activePlayerIndex=0;

let ballOwner=null;

let aimAngle=-Math.PI/2;


let charging=false;

let power=0;


let topScore=0;

let bottomScore=0;


let goalScored=false;

let goalTimer=null;


/* =================================================
   حالة Joystick
================================================= */

let movePointerId=null;

let moveTouching=false;

let moveX=0;

let moveY=0;


/* =================================================
   حالة الركل
================================================= */

let kickPointerId=null;

let kickTouching=false;

let kickDirectionDistance=0;


/* =================================================
   التبديل بين اللاعبين
================================================= */

let lastManualSwitchTime=0;

let manualSwitchArmed=true;

let lastAutoSwitchTime=0;


/* =================================================
   حالات AI
================================================= */

let redPressIndex=-1;

let bluePressIndex=-1;


let redTackleIndex=-1;

let redTackleFrames=0;


let blueTackleIndex=-1;

let blueTackleFrames=0;


let redDecisionCooldown=0;

let redPassCooldown=0;


let redLastDribbleSide=1;

let redDribbleCommitFrames=0;


let redLastMoveX=[];

let redLastMoveY=[];


/* =================================================
   ثوابت الذكاء
================================================= */

const RED_TACKLE_DISTANCE=39;

const RED_TACKLE_FRAMES=10;

const RED_SHOOT_DISTANCE=235;

const RED_PASS_DISTANCE=270;

const RED_DRIBBLE_DISTANCE=120;

const RED_NEAR_BALL_DIST=210;

/* =========================
   أدوات مساعدة
   ========================= */

function distanceBetween(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


/* =========================
   المسافة من نقطة إلى خط
   ========================= */

function pointToSegmentDistance(
  px,py,
  x1,y1,
  x2,y2
){

  const dx = x2-x1;
  const dy = y2-y1;

  if(dx === 0 && dy === 0){

    return Math.hypot(
      px-x1,
      py-y1
    );

  }

  const t = clamp(
    (
      (px-x1)*dx +
      (py-y1)*dy
    ) /
    (
      dx*dx +
      dy*dy
    ),
    0,
    1
  );

  const xx =
    x1+t*dx;

  const yy =
    y1+t*dy;

  return Math.hypot(
    px-xx,
    py-yy
  );

}


/* =========================
   فحص إمكانية التمرير
   ========================= */

function canPassTo(from,to){

  if(!from || !to) return false;

  const d =
    distanceBetween(from,to);

  if(d > BLUE_PASS_DISTANCE)
    return false;

  for(const opp of opponents){

    const block =
      pointToSegmentDistance(
        opp.x,
        opp.y,
        from.x,
        from.y,
        to.x,
        to.y
      );

    if(block < 28)
      return false;

  }

  return true;

}


function redCanPassTo(from,to){

  if(!from || !to) return false;

  const d =
    distanceBetween(from,to);

  if(d > RED_PASS_DISTANCE)
    return false;

  for(const blue of teamPlayers){

    const block =
      pointToSegmentDistance(
        blue.x,
        blue.y,
        from.x,
        from.y,
        to.x,
        to.y
      );

    if(block < 28)
      return false;

  }

  return true;

}


/* =========================
   أقرب لاعب أزرق للكرة
   ========================= */

function getClosestBlueToBall(){

  let closest = null;
  let best = Infinity;

  for(const p of teamPlayers){

    const d =
      Math.hypot(
        p.x-ballX,
        p.y-ballY
      );

    if(d < best){

      best = d;
      closest = p;

    }

  }

  return closest;

}


/* =========================
   أقرب لاعب أحمر للكرة
   ========================= */

function getClosestRedToBall(){

  let closest = null;
  let best = Infinity;

  for(const p of opponents){

    const d =
      Math.hypot(
        p.x-ballX,
        p.y-ballY
      );

    if(d < best){

      best = d;
      closest = p;

    }

  }

  return closest;

}


/* =========================
   تحديد اللاعب الأقرب
   ========================= */

function autoSelectClosestPlayer(){

  if(ballOwner &&
     ballOwner.team === "blue"){

    return;

  }

  const closest =
    getClosestBlueToBall();

  if(!closest) return;

  const current =
    teamPlayers[activePlayerIndex];

  if(!current){

    activePlayerIndex =
      teamPlayers.indexOf(closest);

    return;

  }

  const currentDist =
    Math.hypot(
      current.x-ballX,
      current.y-ballY
    );

  const closestDist =
    Math.hypot(
      closest.x-ballX,
      closest.y-ballY
    );

  if(
    closestDist + playerSwitchMargin <
    currentDist
  ){

    activePlayerIndex =
      teamPlayers.indexOf(closest);

  }

}

  if(!p) return 0;

  if(
    Math.abs(p.moveX) >
    0.05 ||
    Math.abs(p.moveY) >
    0.05
  ){

    return Math.atan2(
      p.moveY,
      p.moveX
    );

  }

  return p.direction || 0;

}

function updateCamera(){

  const targetX =
    ballX -
    viewWidth/2;

  const targetY =
    ballY -
    viewHeight/2;


  const maxCameraX =
    Math.max(
      0,
      worldWidth-viewWidth
    );


  const maxCameraY =
    Math.max(
      0,
      worldHeight-viewHeight
    );


  const clampedX =
    clamp(
      targetX,
      0,
      maxCameraX
    );


  const clampedY =
    clamp(
      targetY,
      0,
      maxCameraY
    );


  cameraX +=
    (
      clampedX-cameraX
    ) *
    CAMERA_SMOOTH;


  cameraY +=
    (
      clampedY-cameraY
    ) *
    CAMERA_SMOOTH;

}

/* =========================
   تحريك اللاعب
   ========================= */

function movePlayer(p,dx,dy,dt){

  if(!p) return;

  const len =
    Math.hypot(dx,dy);

  if(len > 1){

    dx /= len;
    dy /= len;

  }


  const speed =
    p.speed || 90;


  p.x +=
    dx * speed * dt;

  p.y +=
    dy * speed * dt;


  const bounds =
    getRoleBounds(p);


  p.x =
    clamp(
      p.x,
      bounds.minX,
      bounds.maxX
    );


  p.y =
    clamp(
      p.y,
      bounds.minY,
      bounds.maxY
    );


  if(
    Math.abs(dx) > 0.01 ||
    Math.abs(dy) > 0.01
  ){

    p.direction =
      Math.atan2(dy,dx);

  }

}


/* =========================
   حركة اللاعب المتحكم به
   ========================= */

function updateControlledPlayer(dt){

  const p =
    teamPlayers[activePlayerIndex];

  if(!p) return;


  p.moveX =
    joystickX;

  p.moveY =
    joystickY;


  if(
    Math.abs(joystickX) > 0.01 ||
    Math.abs(joystickY) > 0.01
  ){

    movePlayer(
      p,
      joystickX,
      joystickY,
      dt
    );

  }

}


/* =========================
   معرفة الهدف المناسب للاعب
   ========================= */

function getTeamAITarget(p){

  if(!p) return null;


  /* اللاعب الذي يملك الكرة */

  if(ballOwner === p){

    return {
      x:ballX,
      y:ballY
    };

  }


  const ballZone =
    ballY / worldHeight;


  /* الجناح */

  if(p.role === "wing"){

    let targetY =
      p.anchorY;


    /*
       عندما تكون الكرة في نصف ملعب
       الخصم، يتقدم الجناح قليلاً.
    */

    if(ballZone < 0.55){

      targetY =
        Math.min(
          worldHeight*0.30,
          p.anchorY
        );

    }


    /*
       إذا كانت الكرة قريبة من الجناح
       يتحرك باتجاهها.
    */

    const ballDist =
      Math.hypot(
        ballX-p.x,
        ballY-p.y
      );


    if(ballDist < 210){

      return {
        x:ballX,
        y:ballY
      };

    }


    return {
      x:p.anchorX,
      y:targetY
    };

  }


  /* المهاجم */

  if(p.role === "forward"){

    const d =
      Math.hypot(
        ballX-p.x,
        ballY-p.y
      );


    if(
      ballOwner &&
      ballOwner.team === "blue"
    ){

      /*
         لا يطارد المهاجم اللاعب
         إذا كانت الكرة مع لاعب أزرق آخر.
      */

      if(d < 170){

        return {
          x:ballX,
          y:ballY
        };

      }

      return {
        x:p.anchorX,
        y:worldHeight*0.30
      };

    }


    if(d < BLUE_NEAR_BALL_DIST){

      return {
        x:ballX,
        y:ballY
      };

    }


    return {
      x:p.anchorX,
      y:worldHeight*0.30
    };

  }


  /* المدافع */

  if(p.role === "defender"){

    const d =
      Math.hypot(
        ballX-p.x,
        ballY-p.y
      );


    if(
      ballOwner &&
      ballOwner.team === "red" &&
      d < 230
    ){

      return {
        x:ballX,
        y:ballY
      };

    }


    return {
      x:p.anchorX,
      y:worldHeight*0.84
    };

  }


  /* الحارس */

  if(p.role === "guard"){

    let gx =
      ballX;


    gx =
      clamp(
        gx,
        BLUE_GUARD_MIN_X,
        BLUE_GUARD_MAX_X
      );


    return {
      x:gx,
      y:BLUE_GUARD_Y
    };

  }


  return {
    x:p.anchorX,
    y:p.anchorY
  };

}


/* =========================
   حركة لاعبي الأزرق AI
   ========================= */

function updateBlueAI(dt){

  for(let i=0;i<teamPlayers.length;i++){

    const p =
      teamPlayers[i];


    /*
       اللاعب المتحكم به لا يتحرك
       بواسطة AI.
    */

    if(i === activePlayerIndex){

      p.controlled = true;
      continue;

    }


    p.controlled = false;


    const target =
      getTeamAITarget(p);


    if(!target) continue;


    let dx =
      target.x-p.x;

    let dy =
      target.y-p.y;


    const d =
      Math.hypot(dx,dy);


    /*
       لا نحتاج للحركة إذا كان اللاعب
       قريباً من موقعه المطلوب.
    */

    if(d < 5){

      p.moveX = 0;
      p.moveY = 0;

      continue;

    }


    dx /= d;
    dy /= d;


    p.moveX = dx;
    p.moveY = dy;


    movePlayer(
      p,
      dx,
      dy,
      dt
    );

  }

}

      );


    if(d < RED_NEAR_BALL_DIST){

      return {
        x:ballX,
        y:ballY
      };

    }


    return {
      x:p.anchorX,
      y:worldHeight*0.30
    };

  }


  return {
    x:p.anchorX,
    y:p.anchorY
  };

}


/* =========================
   حركة الفريق الأحمر
   ========================= */

function updateRedAI(dt){

  for(const p of opponents){

    const target =
      getRedFormationTarget(p);


    if(!target) continue;


    let dx =
      target.x-p.x;

    let dy =
      target.y-p.y;


    const d =
      Math.hypot(dx,dy);


    if(d < 5){

      p.moveX = 0;
      p.moveY = 0;

      continue;

    }


    dx /= d;
    dy /= d;


    p.moveX = dx;
    p.moveY = dy;


    movePlayer(
      p,
      dx,
      dy,
      dt
    );

  }

}


/* =========================
   فصل اللاعبين عن بعض
   ========================= */

function separatePlayers(players,minDistance){

  for(let i=0;i<players.length;i++){

    for(let j=i+1;j<players.length;j++){

      const a =
        players[i];

      const b =
        players[j];


      const dx =
        b.x-a.x;

      const dy =
        b.y-a.y;


      const d =
        Math.hypot(dx,dy);


      if(
        d === 0 ||
        d >= minDistance
      ){

        continue;

      }


      const nx =
        dx/d;

      const ny =
        dy/d;


      const push =
        (minDistance-d)/2;


      /*
         لا ندفع اللاعب المتحكم به
         بقوة كبيرة.
      */

      if(a !== teamPlayers[activePlayerIndex]){

        a.x -=
          nx*push;

        a.y -=
          ny*push;

      }


      if(b !== teamPlayers[activePlayerIndex]){

        b.x +=
          nx*push;

        b.y +=
          ny*push;

      }


      const ba =
        getRoleBounds(a);

      const bb =
        getRoleBounds(b);


      a.x =
        clamp(
          a.x,
          ba.minX,
          ba.maxX
        );

      a.y =
        clamp(
          a.y,
          ba.minY,
          ba.maxY
        );


      b.x =
        clamp(
          b.x,
          bb.minX,
          bb.maxX
        );

      b.y =
        clamp(
          b.y,
          bb.minY,
          bb.maxY
        );

    }

  }

}


/* =========================
   تصادم اللاعبين مع الكرة
   ========================= */

function resolvePlayerBallCollision(){

  /*
     إذا كانت الكرة مملوكة للاعب
     لا نعمل تصادم عشوائي.
  */

  if(ballOwner)
    return;


  const allPlayers =
    [
      ...teamPlayers,
      ...opponents
    ];


  let nearest =
    null;

  let nearestDistance =
    Infinity;


  for(const p of allPlayers){

    const d =
      Math.hypot(
        ballX-p.x,
        ballY-p.y
      );


    if(
      d < nearestDistance
    ){

      nearestDistance = d;
      nearest = p;

    }

  }


  if(
    nearest &&
    nearestDistance <
    BALL_PICKUP_BLUE
  ){

    /*
       الاستحواذ على الكرة.
    */

    ballOwner =
      nearest;

    ballVX = 0;
    ballVY = 0;

    ballX =
      nearest.x;

    ballY =
      nearest.y -
      (
        nearest.team === "blue"
        ? BALL_PICKUP_BLUE
        : BALL_PICKUP_RED
      );

  }

}


/* =========================
   تحديث الكرة
   ========================= */

function updateBall(dt){

  /*
     إذا كانت الكرة مع لاعب
     تتحرك معه.
  */

  if(ballOwner){

    ballX =
      ballOwner.x;

    ballY =
      ballOwner.y -
      (
        ballOwner.team === "blue"
        ? BALL_PICKUP_BLUE
        : BALL_PICKUP_RED
      );

    ballVX = 0;
    ballVY = 0;

    return;

  }


  ballX +=
    ballVX * dt;

  ballY +=
    ballVY * dt;


  /*
     الاحتكاك
  */

  ballVX *=
    Math.pow(FRICTION,dt*60);

  ballVY *=
    Math.pow(FRICTION,dt*60);


  /*
     إيقاف الكرة عندما تصبح بطيئة جداً.
  */

  const speed =
    Math.hypot(
      ballVX,
      ballVY
    );


  if(speed < 0.15){

    ballVX = 0;
    ballVY = 0;

  }


  /*
     الجدار الأيسر
  */

  if(
    ballX-BALL_RADIUS < 0
  ){

    ballX =
      BALL_RADIUS;

    ballVX =
      Math.abs(ballVX) *
      0.72;

  }


  /*
     الجدار الأيمن
  */

  if(
    ballX+BALL_RADIUS >
    worldWidth
  ){

    ballX =
      worldWidth-BALL_RADIUS;

    ballVX =
      -Math.abs(ballVX) *
      0.72;

  }


  /*
     أعلى الملعب
  */

  if(
    ballY-BALL_RADIUS < 0
  ){

    ballY =
      BALL_RADIUS;

    ballVY =
      Math.abs(ballVY) *
      0.72;

  }


  /*
     أسفل الملعب
  */

  if(
    ballY+BALL_RADIUS >
    worldHeight
  ){

    ballY =
      worldHeight-BALL_RADIUS;

    ballVY =
      -Math.abs(ballVY) *
      0.72;

  }

}


/* =========================
   التحقق من الهدف
   ========================= */

function checkGoal(){

  /*
     الهدف العلوي
     = هدف الفريق الأحمر
  */

  if(
    ballY < 30 &&
    Math.abs(
      ballX-worldWidth/2
    ) <
    GOAL_WIDTH/2
  ){

    scoreBlue++;

    scoreBlueElement.textContent =
      scoreBlue;


    resetAfterGoal(
      "blue"
    );

    return true;

  }


  /*
     الهدف السفلي
     = هدف الفريق الأزرق
  */

  if(
    ballY >
    worldHeight-30 &&
    Math.abs(
      ballX-worldWidth/2
    ) <
    GOAL_WIDTH/2
  ){

    scoreRed++;

    scoreRedElement.textContent =
      scoreRed;


    resetAfterGoal(
      "red"
    );

    return true;

  }


  return false;

}


/* =========================
   إعادة اللعب بعد الهدف
   ========================= */

function resetAfterGoal(scoringTeam){

  ballOwner = null;

  ballVX = 0;
  ballVY = 0;


  if(scoringTeam === "blue"){

    for(const p of teamPlayers){

      if(p.role === "forward"){

        p.x =
          worldWidth/2;

        p.y =
          worldHeight*0.72;

      }

      else if(p.role === "wing"){

        p.y =
          worldHeight*0.62;

      }

      else if(p.role === "defender"){

        p.x =
          worldWidth/2;

        p.y =
          worldHeight*0.86;

      }

      else if(p.role === "guard"){

        p.x =
          worldWidth/2;

        p.y =
          worldHeight*0.95;

      }

    }


    for(const p of opponents){

      p.x =
        p.anchorX;

      p.y =
        p.anchorY;

    }


    const p =
      teamPlayers[activePlayerIndex];


    ballOwner = p;

    ballX = p.x;
    ballY =
      p.y-BALL_PICKUP_BLUE;

  }

  else{

    for(const p of teamPlayers){

      p.x =
        p.anchorX;

      p.y =
        p.anchorY;

    }


    for(const p of opponents){

      p.x =
        p.anchorX;

      p.y =
        p.anchorY;

    }


    const p =
      opponents[0];


    ballOwner = p;

    ballX = p.x;
    ballY =
      p.y-BALL_PICKUP_RED;

  }


  cameraX = 0;

  cameraY = 0;

}

/* =========================================================
   القسم 5 — التسديد + التمرير + AI + التحكم
   ========================================================= */


/* =========================
   إطلاق الكرة
   ========================= */

function kickBall(){

  if(!ballOwner)
    return;

  const p =
    ballOwner;


  /*
     اللاعب الأزرق المتحكم به
  */

  if(
    p.team === "blue" &&
    p === teamPlayers[activePlayerIndex]
  ){

    let dx =
      aimX-ballX;

    let dy =
      aimY-ballY;


    const d =
      Math.hypot(dx,dy);


    if(d < 5)
      return;


    dx /= d;
    dy /= d;


    const power =
      Math.max(
        0.15,
        chargePower/MAX_POWER
      );


    const kickSpeed =
      500 +
      power*850;


    ballOwner = null;


    ballX =
      p.x +
      dx*30;

    ballY =
      p.y +
      dy*30;


    ballVX =
      dx*kickSpeed;

    ballVY =
      dy*kickSpeed;


    chargePower = 0;

    powerText.textContent =
      "0";


    powerBox.classList.remove(
      "charging"
    );

    aiming = false;

    aimArrow.style.display =
      "none";


    return;

  }


  /*
     AI
  */

  aiKickBall(p);

}


/* =========================
   تسديد AI
   ========================= */

function aiKickBall(p){

  if(!p)
    return;

  if(ballOwner !== p)
    return;


  let targetX =
    worldWidth/2;

  let targetY;


  if(p.team === "blue"){

    /*
       الأزرق يهاجم المرمى العلوي
    */

    targetY = -20;

  }else{

    /*
       الأحمر يهاجم المرمى السفلي
    */

    targetY =
      worldHeight+20;

  }


  let dx =
    targetX-ballX;

  let dy =
    targetY-ballY;


  const d =
    Math.hypot(dx,dy);


  if(d < 1)
    return;


  dx /= d;
  dy /= d;


  const speed =
    620;


  ballOwner = null;


  ballX =
    p.x+dx*32;

  ballY =
    p.y+dy*32;


  ballVX =
    dx*speed;

  ballVY =
    dy*speed;

}


/* =========================
   اختيار لاعب للتمرير
   ========================= */

function getBestPassTarget(
  p,
  players
){

  if(!p)
    return null;


  let best = null;
  let bestScore = -Infinity;


  for(const mate of players){

    if(mate === p)
      continue;


    const d =
      distanceBetween(
        p,
        mate
      );


    if(d < 45)
      continue;


    if(d > BLUE_PASS_DISTANCE &&
       p.team === "blue")
      continue;


    if(d > RED_PASS_DISTANCE &&
       p.team === "red")
      continue;


    const passOK =
      p.team === "blue"
      ? canPassTo(p,mate)
      : redCanPassTo(p,mate);


    if(!passOK)
      continue;


    /*
       اللاعب الأقرب للمرمى
       يحصل على أولوية أكبر.
    */

    let progress;


    if(p.team === "blue"){

      progress =
        worldHeight-mate.y;

    }else{

      progress =
        mate.y;

    }


    const score =
      progress*0.8 -
      d*0.35;


    if(score > bestScore){

      bestScore = score;
      best = mate;

    }

  }


  return best;

}


/* =========================
   تمريرة AI
   ========================= */

function aiPass(p,target){

  if(!p || !target)
    return false;

  if(ballOwner !== p)
    return false;


  const dx =
    target.x-p.x;

  const dy =
    target.y-p.y;


  const d =
    Math.hypot(dx,dy);


  if(d < 1)
    return false;


  const nx =
    dx/d;

  const ny =
    dy/d;


  const passSpeed =
    Math.min(
      720,
      430+d*0.75
    );


  ballOwner = null;


  ballX =
    p.x+nx*32;

  ballY =
    p.y+ny*32;


  ballVX =
    nx*passSpeed;

  ballVY =
    ny*passSpeed;


  return true;

}


/* =========================
   ذكاء الأزرق مع الكرة
   ========================= */

function updateBlueBallAI(){

  if(!ballOwner)
    return;


  const p =
    ballOwner;


  if(p.team !== "blue")
    return;


  /*
     اللاعب الذي يتحكم به المستخدم
     لا نترك AI يتدخل فيه.
  */

  if(
    p === teamPlayers[activePlayerIndex]
  )
    return;


  const goalDistance =
    Math.abs(
      p.y
    );


  /*
     إذا اقترب من المرمى
     يسدد.
  */

  if(
    p.y < BLUE_SHOOT_DISTANCE
  ){

    aiKickBall(p);

    return;

  }


  /*
     محاولة التمرير.
  */

  const target =
    getBestPassTarget(
      p,
      teamPlayers
    );


  if(target){

    const passDistance =
      distanceBetween(
        p,
        target
      );


    if(
      passDistance >
      90 &&
      Math.random() < 0.018
    ){

      aiPass(
        p,
        target
      );

      return;

    }

  }

}


/* =========================
   ذكاء الأحمر مع الكرة
   ========================= */

function updateRedBallAI(){

  if(!ballOwner)
    return;


  const p =
    ballOwner;


  if(p.team !== "red")
    return;


  /*
     إذا كان قريباً من مرمى الأزرق
     يسدد.
  */

  if(
    p.y >
    worldHeight-RED_SHOOT_DISTANCE
  ){

    aiKickBall(p);

    return;

  }


  /*
     محاولة تمرير الكرة.
  */

  const target =
    getBestPassTarget(
      p,
      opponents
    );


  if(target){

    const passDistance =
      distanceBetween(
        p,
        target
      );


    if(
      passDistance >
      90 &&
      Math.random() < 0.022
    ){

      aiPass(
        p,
        target
      );

      return;

    }

  }

}


/* =========================
   تدخل الأحمر على اللاعب الأزرق
   ========================= */

function redTackle(){

  const blue =
    teamPlayers[
      activePlayerIndex
    ];


  if(!blue)
    return;


  const red =
    getClosestRedToBall();


  if(!red)
    return;


  const d =
    distanceBetween(
      red,
      blue
    );


  if(
    d <= RED_TACKLE_DISTANCE &&
    ballOwner === blue
  ){

    /*
       نسبة نجاح بسيطة
       حتى لا تصبح اللعبة آلية بالكامل.
    */

    if(
      Math.random() < 0.08
    ){

      ballOwner =
        red;

      ballX =
        red.x;

      ballY =
        red.y-BALL_PICKUP_RED;

      ballVX = 0;
      ballVY = 0;

    }

  }

}


/* =========================
   تدخل الأزرق
   ========================= */

function blueTackle(){

  const blue =
    teamPlayers[
      activePlayerIndex
    ];


  if(!blue)
    return;


  const red =
    getClosestRedToBall();


  if(!red)
    return;


  const d =
    distanceBetween(
      blue,
      red
    );


  if(
    d <= BLUE_TACKLE_DISTANCE &&
    ballOwner === red
  ){

    if(
      Math.random() < 0.12
    ){

      ballOwner =
        blue;

      ballX =
        blue.x;

      ballY =
        blue.y-BALL_PICKUP_BLUE;

      ballVX = 0;
      ballVY = 0;

    }

  }

}


/* =========================
   تبديل اللاعب يدوياً
   ========================= */

function switchPlayer(){

  const current =
    teamPlayers[
      activePlayerIndex
    ];


  let bestIndex = -1;
  let bestDistance =
    Infinity;


  for(let i=0;i<teamPlayers.length;i++){

    if(i === activePlayerIndex)
      continue;


    const p =
      teamPlayers[i];


    const d =
      Math.hypot(
        p.x-ballX,
        p.y-ballY
      );


    if(d < bestDistance){

      bestDistance = d;
      bestIndex = i;

    }

  }


  if(
    bestIndex >= 0 &&
    bestDistance <=
    manualSwitchMinDistance
  ){

    activePlayerIndex =
      bestIndex;


    for(let i=0;i<teamPlayers.length;i++){

      teamPlayers[i].controlled =
        i === activePlayerIndex;

    }


    lastManualSwitchTime =
      performance.now();

  }

}


/* =========================
   اختيار اللاعب بالاتجاه
   ========================= */

function switchPlayerByDirection(){

  const current =
    teamPlayers[
      activePlayerIndex
    ];


  if(!current)
    return;


  const ax =
    joystickX;

  const ay =
    joystickY;


  const magnitude =
    Math.hypot(
      ax,
      ay
    );


  if(
    magnitude <
    manualSwitchDot
  )
    return;


  let bestIndex = -1;
  let bestScore =
    Infinity;


  for(let i=0;i<teamPlayers.length;i++){

    if(i === activePlayerIndex)
      continue;


    const p =
      teamPlayers[i];


    const dx =
      p.x-current.x;

    const dy =
      p.y-current.y;


    const d =
      Math.hypot(
        dx,
        dy
      );


    if(d < 1)
      continue;


    const dot =
      (
        dx*ax +
        dy*ay
      ) / d;


    if(
      dot < manualSwitchDot
    )
      continue;


    const score =
      d/(dot+0.01);


    if(score < bestScore){

      bestScore = score;
      bestIndex = i;

    }

  }


  if(bestIndex >= 0){

    activePlayerIndex =
      bestIndex;


    for(let i=0;i<teamPlayers.length;i++){

      teamPlayers[i].controlled =
        i === activePlayerIndex;

    }


    lastManualSwitchTime =
      performance.now();

  }

}


/* =========================
   لمس الكرة من اللاعب
   ========================= */

function handlePlayerBallContact(){

  if(!ballOwner){

    tryBlueBallPickup();
    tryRedBallPickup();

    return;

  }


  /*
     الأزرق يأخذ الكرة من الأحمر
  */

  if(
    ballOwner.team === "red"
  ){

    blueTackle();

  }


  /*
     الأحمر يأخذ الكرة من الأزرق
  */

  if(
    ballOwner.team === "blue"
  ){

    redTackle();

  }

}

    ];

  ){

    );

function updateAimFromPoint(
  clientX,
  clientY
){

    game.getBoundingClientRect();


  const x =
    clientX -
    rect.left;


  const y =
    clientY -
    rect.top;


  aimX =
    x +
    cameraX;

  aimY =
    y +
    cameraY;

}

/* =========================
   تحديث اللعبة
   ========================= */

function updateGame(dt){

  if(
    !matchRunning ||
    matchEnded
  )
    return;


  updateControlledPlayer(dt);

  updateAI(dt);

  updateCharge(dt);

  updateBall(dt);

  handlePlayerBallContact();

  checkGoal();

  updateCamera();

  draw();

}
/* =========================================================
   القسم 6 — Joystick + المؤقت + الحلقة الرئيسية + Resize
   ========================================================= */


/* =========================
   Joystick
   ========================= */

let joystickActive = false;
let joystickPointerId = null;

let joystickX = 0;
let joystickY = 0;


function resetJoystick(){

  joystickActive = false;
  joystickPointerId = null;

  joystickX = 0;
  joystickY = 0;


  movePad.style.transform =
    "translate3d(0,0,0)";

}


/* =========================
   حساب حركة Joystick
   ========================= */

function updateJoystick(
  clientX,
  clientY
){

  const rect =
    movePad.getBoundingClientRect();


  const centerX =
    rect.left +
    rect.width/2;

  const centerY =
    rect.top +
    rect.height/2;


  let dx =
    clientX-centerX;

  let dy =
    clientY-centerY;


  const distance =
    Math.hypot(dx,dy);


  if(
    distance >
    joystickMaxDistance
  ){

    dx =
      dx/distance *
      joystickMaxDistance;

    dy =
      dy/distance *
      joystickMaxDistance;

  }


  joystickX =
    dx/joystickMaxDistance;

  joystickY =
    dy/joystickMaxDistance;


  /*
     الحركة القطرية تكون بنفس السرعة
     في جميع الاتجاهات.
  */

  const magnitude =
    Math.hypot(
      joystickX,
      joystickY
    );


  if(magnitude > 1){

    joystickX /= magnitude;
    joystickY /= magnitude;

  }


  movePad.style.transform =
    `translate3d(
      ${dx}px,
      ${dy}px,
      0
    )`;

}


/* =========================
   بدء Joystick
   ========================= */

movePad.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    joystickActive = true;

    joystickPointerId =
      e.pointerId;


    movePad.setPointerCapture(
      e.pointerId
    );


    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   تحريك Joystick
   ========================= */

movePad.addEventListener(
  "pointermove",
  e => {

    if(
      !joystickActive ||
      e.pointerId !==
      joystickPointerId
    )
      return;


    e.preventDefault();


    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   إنهاء Joystick
   ========================= */

movePad.addEventListener(
  "pointerup",
  e => {

    if(
      e.pointerId !==
      joystickPointerId
    )
      return;


    resetJoystick();

  }
);


movePad.addEventListener(
  "pointercancel",
  e => {

    if(
      e.pointerId !==
      joystickPointerId
    )
      return;


    resetJoystick();

  }
);


/* =========================
   منع لمس الشاشة من التحريك
   ========================= */

movePad.addEventListener(
  "touchstart",
  e => {

    e.preventDefault();

  },
  {passive:false}
);


kickControl.addEventListener(
  "touchstart",
  e => {

    e.preventDefault();

  },
  {passive:false}
);


/* =========================================================
   المؤقت
   ========================================================= */

function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Math.ceil(seconds)
    );


  const minutes =
    Math.floor(
      seconds/60
    );


  const secs =
    seconds%60;


  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(secs)
      .padStart(2,"0")
  );

}


/* =========================
   تحديث المؤقت
   ========================= */

function updateMatchTimer(now){

  if(
    !matchRunning ||
    matchEnded
  )
    return;


  const elapsed =
    (
      now-matchLastTimestamp
    )/1000;


  matchLastTimestamp =
    now;


  matchTimeRemaining -=
    elapsed;


  if(
    matchTimeRemaining <= 0
  ){

    matchTimeRemaining = 0;

    updateMatchTimerDisplay();

    endMatch();

    return;

  }


  updateMatchTimerDisplay();

}


/* =========================
   عرض الوقت
   ========================= */

function updateMatchTimerDisplay(){

  matchTimeElement.textContent =
    formatTime(
      matchTimeRemaining
    );


  if(
    matchTimeRemaining <= 10
  ){

    matchTimeElement.classList.add(
      "warning"
    );

  }else{

    matchTimeElement.classList.remove(
      "warning"
    );

  }

}


/* =========================================================
   نهاية المباراة
   ========================================================= */

function endMatch(){

  if(matchEnded)
    return;


  matchEnded = true;
  matchRunning = false;


  ballOwner = null;

  ballVX = 0;
  ballVY = 0;


  joystickX = 0;
  joystickY = 0;


  resetJoystick();


  aiming = false;
  chargePower = 0;


  powerBox.classList.remove(
    "charging"
  );


  powerText.textContent =
    "0";


  aimArrow.style.display =
    "none";


  /*
     إيقاف اللاعبين
  */

  for(const p of teamPlayers){

    p.moveX = 0;
    p.moveY = 0;

  }


  for(const p of opponents){

    p.moveX = 0;
    p.moveY = 0;

  }


  /*
     شاشة نهاية المباراة
  */

  if(matchEndOverlay){

    matchEndOverlay.style.display =
      "flex";

  }


  if(finalScoreElement){

    finalScoreElement.textContent =
      `${scoreBlue} - ${scoreRed}`;

  }

}


/* =========================================================
   إعادة المباراة
   ========================================================= */

function resetMatch(){

  scoreBlue = 0;
  scoreRed = 0;


  scoreBlueElement.textContent =
    "0";

  scoreRedElement.textContent =
    "0";


  matchTimeRemaining =
    MATCH_DURATION;


  matchEnded = false;
  matchRunning = true;


  matchLastTimestamp =
    performance.now();


  /*
     إعادة مواقع الأزرق
  */

  teamPlayers[0].x =
    worldWidth/2;

  teamPlayers[0].y =
    worldHeight*0.72;


  teamPlayers[1].x =
    worldWidth*0.18;

  teamPlayers[1].y =
    worldHeight*0.62;


  teamPlayers[2].x =
    worldWidth*0.82;

  teamPlayers[2].y =
    worldHeight*0.62;


  teamPlayers[3].x =
    worldWidth/2;

  teamPlayers[3].y =
    worldHeight*0.86;


  teamPlayers[4].x =
    worldWidth/2;

  teamPlayers[4].y =
    worldHeight*0.95;


  /*
     إعادة مواقع الأحمر
  */

  opponents[0].x =
    worldWidth/2;

  opponents[0].y =
    worldHeight*0.28;


  opponents[1].x =
    worldWidth*0.18;

  opponents[1].y =
    worldHeight*0.38;


  opponents[2].x =
    worldWidth*0.82;

  opponents[2].y =
    worldHeight*0.38;


  opponents[3].x =
    worldWidth/2;

  opponents[3].y =
    worldHeight*0.05;


  opponents[4].x =
    worldWidth/2;

  opponents[4].y =
    worldHeight*0.14;


  /*
     اللاعب الأول هو المتحكم
  */

  activePlayerIndex = 0;


  for(
    let i=0;
    i<teamPlayers.length;
    i++
  ){

    teamPlayers[i].controlled =
      i === activePlayerIndex;

    teamPlayers[i].moveX = 0;
    teamPlayers[i].moveY = 0;

  }


  /*
     الكرة مع المهاجم
  */

  ballOwner =
    teamPlayers[0];


  ballX =
    teamPlayers[0].x;

  ballY =
    teamPlayers[0].y -
    BALL_PICKUP_BLUE;


  ballVX = 0;
  ballVY = 0;


  /*
     إعادة الكاميرا
  */

  cameraX = 0;
  cameraY = 0;


  /*
     إخفاء شاشة النهاية
  */

  if(matchEndOverlay){

    matchEndOverlay.style.display =
      "none";

  }


  updateMatchTimerDisplay();

  draw();

}


/* =========================
   زر New Match
   ========================= */

if(newMatchButton){

  newMatchButton.addEventListener(
    "click",
    () => {

      resetMatch();

    }
  );

}


/* =========================================================
   Resize
   ========================================================= */

function resizeGame(){

  viewWidth =
    game.clientWidth;


  viewHeight =
    game.clientHeight;


  /*
     الملعب الحقيقي أطول من الشاشة
  */

  worldWidth =
    viewWidth;


  worldHeight =
    viewHeight*2;


  /*
     إبقاء اللاعبين داخل الملعب
  */

  for(const p of teamPlayers){

    const b =
      getRoleBounds(p);


    p.x =
      clamp(
        p.x,
        b.minX,
        b.maxX
      );


    p.y =
      clamp(
        p.y,
        b.minY,
        b.maxY
      );

  }


  for(const p of opponents){

    const b =
      getRoleBounds(p);


    p.x =
      clamp(
        p.x,
        b.minX,
        b.maxX
      );


    p.y =
      clamp(
        p.y,
        b.minY,
        b.maxY
      );

  }


  /*
     إبقاء الكرة داخل العالم
  */

  ballX =
    clamp(
      ballX,
      BALL_RADIUS,
      worldWidth-BALL_RADIUS
    );


  ballY =
    clamp(
      ballY,
      BALL_RADIUS,
      worldHeight-BALL_RADIUS
    );


  /*
     حدود الكاميرا
  */

  cameraX =
    clamp(
      cameraX,
      0,
      Math.max(
        0,
        worldWidth-viewWidth
      )
    );


  cameraY =
    clamp(
      cameraY,
      0,
      Math.max(
        0,
        worldHeight-viewHeight
      )
    );


  draw();

}


window.addEventListener(
  "resize",
  resizeGame
);


/* =========================================================
   الحلقة الرئيسية
   ========================================================= */

let lastFrameTime =
  performance.now();


function gameLoop(now){

  let dt =
    (now-lastFrameTime)/1000;


  lastFrameTime =
    now;


  /*
     حماية من القفزات الكبيرة
     في حال توقف التطبيق للحظة.
  */

  dt =
    Math.min(
      dt,
      0.033
    );


  updateMatchTimer(now);

  updateGame(dt);


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   تشغيل اللعبة
   ========================================================= */

resizeGame();

updateMatchTimerDisplay();


matchLastTimestamp =
  performance.now();

lastFrameTime =
  performance.now();


matchRunning = true;
matchEnded = false;


/*
   تأكيد أن الكرة مع اللاعب الأول
*/

ballOwner =
  teamPlayers[0];

ballX =
  teamPlayers[0].x;

ballY =
  teamPlayers[0].y -
  BALL_PICKUP_BLUE;


draw();


/* بدء اللعبة */

requestAnimationFrame(
  gameLoop
);


/* =========================================================
   نهاية JavaScript
   ========================================================= */

</script>
