<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="format-detection"
content="telephone=no">

<title>كرة القدم ⚽️ v4.0</title>

<style>

*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#16843a;
}

#field{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:200%;
    background:
        repeating-linear-gradient(
            to bottom,
            #168b3d 0px,
            #168b3d 80px,
            #15833a 80px,
            #15833a 160px
        );
    overflow:hidden;
}


/* =========================================================
   خطوط الملعب
========================================================= */

.line{
    position:absolute;
    pointer-events:none;
}

.centerLine{
    left:0;
    width:100%;
    height:4px;
    background:white;
    top:50%;
}

.centerCircle{
    position:absolute;
    width:170px;
    height:170px;
    border:4px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.centerDot{
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.goalBox{
    position:absolute;
    left:50%;
    width:300px;
    height:150px;
    border:4px solid white;
    transform:translateX(-50%);
}

.topBox{
    top:0;
    border-top:none;
}

.bottomBox{
    bottom:0;
    border-bottom:none;
}

.goal{
    position:absolute;
    left:50%;
    width:190px;
    height:35px;
    border:4px solid white;
    transform:translateX(-50%);
}

.topGoal{
    top:0;
    border-top:none;
}

.bottomGoal{
    bottom:0;
    border-bottom:none;
}


/* =========================================================
   اللاعبين
========================================================= */

.playerUnit{
    position:absolute;

    /* التعديل المهم */
    left:0;
    top:0;

    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    line-height:1;
    z-index:20;
    will-change:transform;
}

.playerUnit.blue{
    background:#1677ff;
    border:3px solid #fff;
    box-shadow:0 2px 5px #0008;
}

.playerUnit.red{
    background:#e52d38;
    border:3px solid #fff;
    box-shadow:0 2px 5px #0008;
}

.controlArrow{
    position:absolute;
    left:50%;
    top:-21px;
    transform:translateX(-50%);
    color:#ffd400;
    font-size:16px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 3px #000;
    pointer-events:none;
    display:none;
    z-index:30;
}

.playerUnit.controlled{
    box-shadow:
        0 0 0 3px #ffd400,
        0 0 12px #ffd400,
        0 2px 5px #0008;
}


/* =========================================================
   الكرة
========================================================= */

#ball{
    position:absolute;

    /* التعديل المهم */
    left:0;
    top:0;

    width:22px;
    height:22px;
    border-radius:50%;
    background:white;
    border:2px solid #222;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    will-change:transform;
}


/* =========================================================
   سهم التصويب
========================================================= */

#aimArrow{
    position:absolute;

    /* التعديل المهم */
    left:0;
    top:0;

    width:4px;
    height:70px;
    background:#fff;
    transform-origin:50% 100%;
    z-index:15;
    display:none;
    border-radius:4px;
    box-shadow:0 0 5px #000;
}

#aimArrow::after{
    content:"";
    position:absolute;
    left:50%;
    top:-8px;
    transform:translateX(-50%);
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:14px solid white;
}


/* =========================================================
   لوحة النتيجة
========================================================= */

#scoreBoard{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 8px);
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    background:#000b;
    color:white;
    padding:7px 18px;
    border-radius:18px;
    font-size:20px;
    font-weight:bold;
    min-width:130px;
    text-align:center;
}

#matchTime{
    font-size:14px;
    margin-top:2px;
}

#matchTime.warning{
    color:#ff3b30;
}


/* =========================================================
   القوة
========================================================= */

#powerBox{
    position:fixed;
    left:50%;
    bottom:145px;
    transform:translateX(-50%);
    width:150px;
    height:13px;
    border:2px solid white;
    border-radius:10px;
    overflow:hidden;
    background:#0008;
    z-index:100;
    display:none;
}

#powerBar{
    width:0%;
    height:100%;
    background:#ffd400;
}


/* =========================================================
   الجويستك
========================================================= */

#movePad{
    position:fixed;
    left:25px;
    bottom:calc(25px + env(safe-area-inset-bottom));
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ffffff22;
    border:3px solid #ffffff66;
    z-index:200;
    touch-action:none;
}

#joystickCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:55px;
    height:55px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:#ffffff66;
    border:3px solid #fff;
    will-change:transform;
}


/* =========================================================
   زر الركل
========================================================= */

#kickControl{
    position:fixed;
    right:28px;
    bottom:calc(30px + env(safe-area-inset-bottom));
    width:92px;
    height:92px;
    border-radius:50%;
    background:#e52d38dd;
    border:4px solid #fff;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    box-shadow:0 3px 8px #0008;
}

#kickDot{
    width:25px;
    height:25px;
    border-radius:50%;
    background:white;
}


/* =========================================================
   نهاية المباراة
========================================================= */

#matchEnd{
    position:fixed;
    inset:0;
    background:#000b;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
}

#matchEnd h1{
    margin:0 0 15px;
    font-size:32px;
}

#finalScore{
    font-size:28px;
    margin-bottom:25px;
}

#newMatch{
    border:0;
    border-radius:15px;
    padding:14px 28px;
    font-size:20px;
    font-weight:bold;
    background:#1677ff;
    color:white;
}

</style>

</head>

<body>

<div id="game">

<div id="field">

    <div class="line centerLine"></div>

    <div class="centerCircle"></div>

    <div class="centerDot"></div>

    <div class="goalBox topBox"></div>
    <div class="goalBox bottomBox"></div>

    <div class="goal topGoal"></div>
    <div class="goal bottomGoal"></div>


    <!-- الفريق الأزرق -->

    <div id="player" class="playerUnit blue">
        <div class="controlArrow">▼</div>

    <div id="teammate1" class="playerUnit blue">
        <div class="controlArrow">▼</div>

    <div id="teammate2" class="playerUnit blue">

    </div>

    </div>

        <div class="controlArrow">▼</div>
        🧍
    </div>

    <div id="opponent1" class="playerUnit red">🧍</div>
    <div id="opponent2" class="playerUnit red">🧍</div>
    <div id="opponent3" class="playerUnit red">🧍</div>
    <div id="opponent4" class="playerUnit red">🧍</div>
    <div id="opponent5" class="playerUnit red">🧍</div>


    <div id="ball">⚽</div>

    <div id="aimArrow"></div>

</div>


<div id="scoreBoard">

    🔵 <span id="blueScore">0</span>

    &nbsp; - &nbsp;

    <span id="redScore">0</span> 🔴

    <div id="matchTime">03:00</div>

</div>


<div id="powerBox">
    <div id="powerBar"></div>
</div>


<div id="movePad">
    <div id="joystickCenter"></div>
</div>


<div id="kickControl">
    <div id="kickDot"></div>
</div>


<div id="matchEnd">

    <h1>انتهت المباراة</h1>

    <div id="finalScore">
        🔵 0 - 0 🔴
    </div>

    <button id="newMatch">
        مباراة جديدة
    </button>

</div>

</div>


<script>


/* =========================================================
   GAME SETUP
========================================================= */

const game =
    document.getElementById("game");

const field =
    document.getElementById("field");

const ballElement =
    document.getElementById("ball");

const aimArrow =
    document.getElementById("aimArrow");

const movePad =
    document.getElementById("movePad");

const joystickCenter =
    document.getElementById("joystickCenter");

const kickControl =
    document.getElementById("kickControl");

const powerBox =
    document.getElementById("powerBox");

const powerBar =
    document.getElementById("powerBar");

const blueScoreElement =
    document.getElementById("blueScore");

const redScoreElement =
    document.getElementById("redScore");

const matchTimeElement =
    document.getElementById("matchTime");

const matchEnd =
    document.getElementById("matchEnd");

const finalScore =
    document.getElementById("finalScore");

const newMatch =
    document.getElementById("newMatch");


/* =========================================================
   CONSTANTS
========================================================= */

const CAMERA_SMOOTH = 0.12;

const MATCH_DURATION = 180;

const PLAYER_RADIUS = 19;

const BALL_RADIUS = 11;

const FRICTION = 0.985;

const MAX_POWER = 100;

const POWER_SPEED = 90;

const GOAL_WIDTH = 190;

const JOYSTICK_MAX_DISTANCE = 48;

const PLAYER_PICKUP_DISTANCE = 38;

const TACKLE_DISTANCE = 38;


/* =========================================================
   WORLD / CAMERA
========================================================= */

let viewWidth =
    game.clientWidth;

let viewHeight =
    game.clientHeight;

let worldWidth =
    viewWidth;

let worldHeight =
    viewHeight * 2;

let cameraX = 0;

let cameraY = 0;


/* =========================================================
   BALL
========================================================= */

let ballX =
    worldWidth / 2;

let ballY =
    worldHeight / 2;

let ballVX = 0;

let ballVY = 0;


/* =========================================================
   SCORE
========================================================= */

let blueScore = 0;

let redScore = 0;


/* =========================================================
   MATCH
========================================================= */

let matchTimeRemaining =
    MATCH_DURATION;

let matchRunning = true;

let matchEnded = false;

let lastTimestamp =
    performance.now();


/* =========================================================
   JOYSTICK
========================================================= */

let joystickActive = false;

let joystickPointerId = null;

let joystickX = 0;

let joystickY = 0;


/* =========================================================
   KICK
========================================================= */

let chargingActive = false;

let chargePower = 0;


/* =========================================================
   AIM
========================================================= */

let aimAngle =
    -Math.PI / 2;

let aimX =
    worldWidth / 2;

let aimY = 0;


/* =========================================================
   PLAYER SWITCH
========================================================= */

let activePlayerIndex = 0;

let lastTapTime = 0;


/* =========================================================
   PLAYER FACTORY
========================================================= */

function createPlayer(
    id,
    team,
    x,
    y,
    speed,
    role
){

    const el =
        document.getElementById(id);

    return {

        id:id,

        team:team,

        x:x,

        y:y,

        anchorX:x,

        anchorY:y,

        speed:speed,

        role:role,

        el:el,

        controlled:false,

        moveX:0,

        moveY:0,

        direction:-Math.PI / 2,

        vx:0,

        vy:0,

        hasBall:false

    };

}


/* =========================================================
   TEAMS
========================================================= */

let teamPlayers = [];

let opponents = [];


function createTeams(){

    teamPlayers = [

        createPlayer(
            "player",
            "blue",
            worldWidth / 2,
            worldHeight * 0.62,
            130,
            "forward"
        ),

        createPlayer(
            "teammate1",
            "blue",
            worldWidth * 0.15,
            worldHeight * 0.58,
            95,
            "wing"
        ),

        createPlayer(
            "teammate2",
            "blue",
            worldWidth * 0.85,
            worldHeight * 0.58,
            95,
            "wing"
        ),

        createPlayer(
            "teammate3",
            "blue",
            worldWidth * 0.30,
            worldHeight * 0.75,
            90,
            "defender"
        ),

        createPlayer(
            "teammate4",
            "blue",
            worldWidth * 0.50,
            worldHeight * 0.95,
            75,
            "guard"
        )

    ];


    opponents = [

        createPlayer(
            "opponent1",
            "red",
            worldWidth / 2,
            worldHeight * 0.38,
            85,
            "forward"
        ),

        createPlayer(
            "opponent2",
            "red",
            worldWidth * 0.15,
            worldHeight * 0.42,
            88,
            "wing"
        ),

        createPlayer(
            "opponent3",
            "red",
            worldWidth * 0.85,
            worldHeight * 0.42,
            88,
            "wing"
        ),

        createPlayer(
            "opponent4",
            "red",
            worldWidth * 0.70,
            worldHeight * 0.25,
            70,
            "guard"
        ),

        createPlayer(
            "opponent5",
            "red",
            worldWidth * 0.50,
            worldHeight * 0.20,
            82,
            "defender"
        )

    ];

}


/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* =========================================================
   ROLE BOUNDS
========================================================= */

function getRoleBounds(p){

    let minX =
        PLAYER_RADIUS;

    let maxX =
        worldWidth -
        PLAYER_RADIUS;

    let minY =
        PLAYER_RADIUS;

    let maxY =
        worldHeight -
        PLAYER_RADIUS;


    if(p.team === "blue"){

        if(p.role === "guard"){

            minY =
                worldHeight * 0.82;

            maxY =
                worldHeight -
                PLAYER_RADIUS;

        }

        else if(
            p.role === "defender"
        ){

            minY =
                worldHeight * 0.60;

            maxY =
                worldHeight * 0.90;

        }

        else if(
            p.role === "wing"
        ){

            minY =
                worldHeight * 0.40;

            maxY =
                worldHeight * 0.75;

        }

        else if(
            p.role === "forward"
        ){

            minY =
                worldHeight * 0.35;

            maxY =
                worldHeight * 0.68;

        }

    }


    if(p.team === "red"){

        if(p.role === "guard"){

            minY =
                PLAYER_RADIUS;

            maxY =
                worldHeight * 0.18;

        }

        else if(
            p.role === "defender"
        ){

            minY =
                worldHeight * 0.10;

            maxY =
                worldHeight * 0.40;

        }

        else if(
            p.role === "wing"
        ){

            minY =
                worldHeight * 0.25;

            maxY =
                worldHeight * 0.60;

        }

        else if(
            p.role === "forward"
        ){

            minY =
                worldHeight * 0.32;

            maxY =
                worldHeight * 0.65;

        }

    }


    return {
        minX,
        maxX,
        minY,
        maxY
    };

}


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(
    p,
    dx,
    dy,
    dt
){

    const length =
        Math.hypot(dx,dy);


    if(length > 1){

        dx /= length;
        dy /= length;

    }


    p.x +=
        dx *
        p.speed *
        dt;

    p.y +=
        dy *
        p.speed *
        dt;


    const bounds =
        getRoleBounds(p);


    p.x =
        clamp(
            p.x,
            bounds.minX,
            bounds.maxX
        );


    p.y =
        clamp(
            p.y,
            bounds.minY,
            bounds.maxY
        );


    if(
        Math.abs(dx) > 0.01 ||
        Math.abs(dy) > 0.01
    ){

        p.direction =
            Math.atan2(
                dy,
                dx
            );

    }

}


/* =========================================================
   CONTROLLED PLAYER
========================================================= */

function updateControlledPlayer(dt){

    const p =
        teamPlayers[
            activePlayerIndex
        ];


    if(!p)
        return;


    p.controlled = true;


    const dx =
        joystickX;

    const dy =
        joystickY;


    p.moveX = dx;

    p.moveY = dy;


    if(
        Math.abs(dx) > 0.01 ||
        Math.abs(dy) > 0.01
    ){

        movePlayer(
            p,
            dx,
            dy,
            dt
        );

    }

}


/* =========================================================
   BLUE AI
========================================================= */

function updateBlueAI(dt){

    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        if(
            i ===
            activePlayerIndex
        )
            continue;


        const p =
            teamPlayers[i];


        let targetX =
            p.anchorX;

        let targetY =
            p.anchorY;


        const ballDistance =
            Math.hypot(
                ballX - p.x,
                ballY - p.y
            );


        if(
            ballDistance < 260
        ){

            targetX =
                p.anchorX +
                (ballX -
                p.anchorX) *
                0.30;


            targetY =
                p.anchorY +
                (ballY -
                p.anchorY) *
                0.30;

        }


        const dx =
            targetX - p.x;

        const dy =
            targetY - p.y;

        const d =
            Math.hypot(dx,dy);


        if(d > 8){

            movePlayer(
                p,
                dx / d,
                dy / d,
                dt
            );

        }

    }

}


/* =========================================================
   RED AI
========================================================= */

function updateRedAI(dt){

    for(
        const p of opponents
    ){

        let targetX =
            p.anchorX;

        let targetY =
            p.anchorY;


        const dBall =
            Math.hypot(
                ballX - p.x,
                ballY - p.y
            );


        if(
            dBall < 230
        ){

            targetX = ballX;

            targetY = ballY;

        }


        const dx =
            targetX - p.x;

        const dy =
            targetY - p.y;

        const d =
            Math.hypot(dx,dy);


        if(d > 8){

            movePlayer(
                p,
                dx / d,
                dy / d,
                dt
            );

        }

    }

}


/* =========================================================
   BALL AI
========================================================= */

function updateBallAI(dt){

    let owner = null;


    for(
        const p of opponents
    ){

        if(
            Math.hypot(
                p.x - ballX,
                p.y - ballY
            ) <
            PLAYER_PICKUP_DISTANCE
        ){

            owner = p;

            break;

        }

    }


    if(!owner)
        return;


    ballX =
        owner.x;

    ballY =
        owner.y;


    if(
        Math.random() < 0.008
    ){

        const targetX =
            worldWidth / 2;

        const targetY =
            worldHeight;


        const dx =
            targetX - ballX;

        const dy =
            targetY - ballY;

        const d =
            Math.hypot(dx,dy);


        ballVX =
            dx / d * 260;

        ballVY =
            dy / d * 260;

    }

}


/* =========================================================
   BALL PICKUP
========================================================= */

function tryBallPickup(){

    let nearest = null;

    let bestDistance =
        Infinity;


    for(
        const p of teamPlayers
    ){

        const d =
            Math.hypot(
                p.x - ballX,
                p.y - ballY
            );


        if(
            d <
            PLAYER_PICKUP_DISTANCE &&
            d <
            bestDistance
        ){

            bestDistance = d;

            nearest = p;

        }

    }


    if(nearest){

        ballX =
            nearest.x;

        ballY =
            nearest.y;

    }

}


/* =========================================================
   TACKLE
========================================================= */

function tackle(){

    for(
        const blue of teamPlayers
    ){

        for(
            const red of opponents
        ){

            const d =
                Math.hypot(
                    blue.x - red.x,
                    blue.y - red.y
                );


            if(
                d <
                TACKLE_DISTANCE
            ){

                const dx =
                    red.x - blue.x;

                const dy =
                    red.y - blue.y;

                const length =
                    Math.hypot(dx,dy) || 1;


                ballX =
                    red.x +
                    dx / length *
                    35;


                ballY =
                    red.y +
                    dy / length *
                    35;

            }

        }

    }

}


/* =========================================================
   SEPARATE PLAYERS
========================================================= */

function separatePlayers(
    players,
    minDistance
){

    for(
        let i=0;
        i<players.length;
        i++
    ){

        for(
            let j=i+1;
            j<players.length;
            j++
        ){

            const a =
                players[i];

            const b =
                players[j];


            let dx =
                b.x - a.x;

            let dy =
                b.y - a.y;

            let d =
                Math.hypot(dx,dy);


            if(d === 0){

                dx = 1;

                dy = 0;

                d = 1;

            }


            if(
                d <
                minDistance
            ){

                const push =
                    (minDistance - d) / 2;


                dx /= d;

                dy /= d;


                a.x -=
                    dx * push;

                a.y -=
                    dy * push;


                b.x +=
                    dx * push;

                b.y +=
                    dy * push;

            }

        }

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const targetX =
        ballX -
        viewWidth / 2;


    const targetY =
        ballY -
        viewHeight / 2;


    const maxX =
        Math.max(
            0,
            worldWidth -
            viewWidth
        );


    const maxY =
        Math.max(
            0,
            worldHeight -
            viewHeight
        );


    const desiredX =
        clamp(
            targetX,
            0,
            maxX
        );


    const desiredY =
        clamp(
            targetY,
            0,
            maxY
        );


    cameraX +=
        (desiredX -
        cameraX) *
        CAMERA_SMOOTH;


    cameraY +=
        (desiredY -
        cameraY) *
        CAMERA_SMOOTH;

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(p){

    if(!p.el)
        return;


    p.el.style.transform =
        `translate3d(
            ${p.x - PLAYER_RADIUS}px,
            ${p.y - cameraY - PLAYER_RADIUS}px,
            0
        )`;


    const arrow =
        p.el.querySelector(
            ".controlArrow"
        );


    const isControlled =
        p.team === "blue" &&
        p ===
        teamPlayers[
            activePlayerIndex
        ];


    if(arrow){

        arrow.style.display =
            isControlled
            ? "block"
            : "none";

    }


    if(isControlled){

        p.el.classList.add(
            "controlled"
        );

    }else{

        p.el.classList.remove(
            "controlled"
        );

    }

}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

    ballElement.style.transform =
        `translate3d(
            ${ballX - BALL_RADIUS}px,
            ${ballY - cameraY - BALL_RADIUS}px,
            0
        )`;

}


/* =========================================================
   DRAW AIM
========================================================= */

function updateAim(){

    const p =
        teamPlayers[
            activePlayerIndex
        ];


    if(!p)
        return;


    if(!chargingActive){

        aimArrow.style.display =
            "none";

        return;

    }


    aimArrow.style.display =
        "block";


    aimArrow.style.left =
        `${p.x - 2}px`;


    aimArrow.style.top =
        `${p.y - cameraY - 70}px`;


    aimArrow.style.transform =
        `rotate(
            ${aimAngle + Math.PI / 2}rad
        )`;

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    for(
        const p of teamPlayers
    ){

        drawPlayer(p);

    }


    for(
        const p of opponents
    ){

        drawPlayer(p);

    }


    drawBall();

    updateAim();

}


/* =========================================================
   JOYSTICK RESET
========================================================= */

function resetJoystick(){

    joystickActive = false;

    joystickPointerId =
        null;

    joystickX = 0;

    joystickY = 0;


    joystickCenter.style.transform =
        "translate(-50%,-50%)";

}


/* =========================================================
   JOYSTICK UPDATE
========================================================= */

function updateJoystick(
    clientX,
    clientY
){

    const rect =
        movePad.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX - centerX;

    let dy =
        clientY - centerY;


    const d =
        Math.hypot(dx,dy);


    if(
        d >
        JOYSTICK_MAX_DISTANCE
    ){

        dx =
            dx / d *
            JOYSTICK_MAX_DISTANCE;


        dy =
            dy / d *
            JOYSTICK_MAX_DISTANCE;

    }


    joystickX =
        dx /
        JOYSTICK_MAX_DISTANCE;


    joystickY =
        dy /
        JOYSTICK_MAX_DISTANCE;


    joystickCenter.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


/* =========================================================
   JOYSTICK EVENTS
========================================================= */

movePad.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();


        joystickActive =
            true;


        joystickPointerId =
            e.pointerId;


        movePad.setPointerCapture(
            e.pointerId
        );


        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);


movePad.addEventListener(
    "pointermove",
    e => {

        if(
            !joystickActive ||
            e.pointerId !==
            joystickPointerId
        )
            return;


        e.preventDefault();


        updateJoystick(
            e.clientX,
            e.clientY
        );

    }
);


movePad.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;


        resetJoystick();

    }
);


movePad.addEventListener(
    "pointercancel",
    e => {

        if(
            e.pointerId !==
            joystickPointerId
        )
            return;


        resetJoystick();

    }
);


/* =========================================================
   CHARGING
========================================================= */

function startCharging(){

    if(!matchRunning)
        return;


    const p =
        teamPlayers[
            activePlayerIndex
        ];


    if(!p)
        return;


    const d =
        Math.hypot(
            p.x - ballX,
            p.y - ballY
        );


    if(d > 60)
        return;


    chargingActive = true;

    chargePower = 0;


    powerBox.style.display =
        "block";

}


function updateCharge(dt){

    if(!chargingActive)
        return;


    chargePower +=
        POWER_SPEED * dt;


    chargePower =
        Math.min(
            MAX_POWER,
            chargePower
        );


    powerBar.style.width =
        `${chargePower}%`;

}


function cancelCharging(){

    chargingActive = false;

    chargePower = 0;


    powerBox.style.display =
        "none";


    powerBar.style.width =
        "0%";

}


/* =========================================================
   KICK BALL
========================================================= */

function kickBall(){

    const p =
        teamPlayers[
            activePlayerIndex
        ];


    if(!p)
        return;


    const power =
        Math.max(
            0.2,
            chargePower /
            MAX_POWER
        );


    const dx =
        Math.cos(aimAngle);


    const dy =
        Math.sin(aimAngle);


    ballX =
        p.x +
        dx * 35;


    ballY =
        p.y +
        dy * 35;


    ballVX =
        dx *
        (
            350 +
            power * 500
        );


    ballVY =
        dy *
        (
            350 +
            power * 500
        );


    cancelCharging();

}


/* =========================================================
   KICK EVENTS
========================================================= */

kickControl.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();


        startCharging();


        kickControl.setPointerCapture(
            e.pointerId
        );

    }
);


kickControl.addEventListener(
    "pointerup",
    e => {

        e.preventDefault();


        if(chargingActive){

            kickBall();

        }

    }
);


kickControl.addEventListener(
    "pointercancel",
    e => {

        if(chargingActive){

            cancelCharging();

        }

    }
);


/* =========================================================
   BALL PHYSICS
========================================================= */

function updateBall(dt){

    ballX +=
        ballVX * dt;


    ballY +=
        ballVY * dt;


    ballVX *=
        Math.pow(
            FRICTION,
            dt * 60
        );


    ballVY *=
        Math.pow(
            FRICTION,
            dt * 60
        );


    if(
        Math.abs(ballVX) <
        0.15
    ){

        ballVX = 0;

    }


    if(
        Math.abs(ballVY) <
        0.15
    ){

        ballVY = 0;

    }


    if(
        ballX <
        BALL_RADIUS
    ){

        ballX =
            BALL_RADIUS;


        ballVX =
            Math.abs(
                ballVX
            ) * 0.8;

    }


    if(
        ballX >
        worldWidth -
        BALL_RADIUS
    ){

        ballX =
            worldWidth -
            BALL_RADIUS;


        ballVX =
            -Math.abs(
                ballVX
            ) * 0.8;

    }


    if(
        ballY <
        BALL_RADIUS
    ){

        if(
            Math.abs(
                ballX -
                worldWidth / 2
            ) <
            GOAL_WIDTH / 2
        ){

            scoreBlue();

        }else{

            ballY =
                BALL_RADIUS;


            ballVY =
                Math.abs(
                    ballVY
                ) * 0.8;

        }

    }


    if(
        ballY >
        worldHeight -
        BALL_RADIUS
    ){

        if(
            Math.abs(
                ballX -
                worldWidth / 2
            ) <
            GOAL_WIDTH / 2
        ){

            scoreRed();

        }else{

            ballY =
                worldHeight -
                BALL_RADIUS;


            ballVY =
                -Math.abs(
                    ballVY
                ) * 0.8;

        }

    }

}


/* =========================================================
   SCORE
========================================================= */

function scoreBlue(){

    blueScore++;

    blueScoreElement.textContent =
        blueScore;


    resetAfterGoal();

}


function scoreRed(){

    redScore++;

    redScoreElement.textContent =
        redScore;


    resetAfterGoal();

}


/* =========================================================
   RESET AFTER GOAL
========================================================= */

function resetAfterGoal(){

    ballX =
        worldWidth / 2;

    ballY =
        worldHeight / 2;


    ballVX = 0;

    ballVY = 0;


    cancelCharging();


    for(
        const p of teamPlayers
    ){

        p.x =
            p.anchorX;

        p.y =
            p.anchorY;

    }


    for(
        const p of opponents
    ){

        p.x =
            p.anchorX;

        p.y =
            p.anchorY;

    }


    cameraX = 0;


    cameraY =
        worldHeight -
        viewHeight;

}


/* =========================================================
   PLAYER SWITCH
========================================================= */

function switchPlayer(){

    let bestIndex = -1;

    let bestDist =
        Infinity;


    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        if(
            i ===
            activePlayerIndex
        )
            continue;


        const p =
            teamPlayers[i];


        const d =
            Math.hypot(
                p.x - ballX,
                p.y - ballY
            );


        if(
            d <
            bestDist
        ){

            bestDist = d;

            bestIndex = i;

        }

    }


    if(bestIndex < 0)
        return;


    cancelCharging();


    activePlayerIndex =
        bestIndex;


    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        teamPlayers[i].controlled =
            i ===
            activePlayerIndex;


        teamPlayers[i].moveX = 0;

        teamPlayers[i].moveY = 0;

    }


    aimAngle =
        -Math.PI / 2;


    aimX =
        worldWidth / 2;


    aimY = 0;


    draw();

}


/* =========================================================
   DOUBLE TAP SWITCH
========================================================= */

game.addEventListener(
    "pointerdown",
    e => {

        if(
            e.target === movePad ||
            movePad.contains(e.target) ||
            e.target === kickControl ||
            kickControl.contains(e.target)
        ){

            return;

        }


        if(chargingActive)
            return;


        const now =
            performance.now();


        if(
            now -
            lastTapTime <
            320
        ){

            switchPlayer();

        }


        lastTapTime =
            now;

    }
);


/* =========================================================
   TIMER
========================================================= */

function formatTime(seconds){

    seconds =
        Math.max(
            0,
            Math.ceil(seconds)
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        String(minutes)
        .padStart(2,"0")
        +
        ":"
        +
        String(secs)
        .padStart(2,"0")
    );

}


function updateMatchTimer(dt){

    if(
        !matchRunning ||
        matchEnded
    )
        return;


    matchTimeRemaining -= dt;


    if(
        matchTimeRemaining <= 0
    ){

        matchTimeRemaining = 0;

        endMatch();

    }


    matchTimeElement.textContent =
        formatTime(
            matchTimeRemaining
        );


    if(
        matchTimeRemaining <= 10
    ){

        matchTimeElement.classList.add(
            "warning"
        );

    }else{

        matchTimeElement.classList.remove(
            "warning"
        );

    }

}


/* =========================================================
   END MATCH
========================================================= */

function endMatch(){

    matchRunning = false;

    matchEnded = true;


    cancelCharging();

    resetJoystick();


    finalScore.textContent =
        `🔵 ${blueScore} - ${redScore} 🔴`;


    matchEnd.style.display =
        "flex";

}


/* =========================================================
   NEW MATCH
========================================================= */

newMatch.addEventListener(
    "click",
    e => {

        e.preventDefault();


        blueScore = 0;

        redScore = 0;


        blueScoreElement.textContent =
            "0";


        redScoreElement.textContent =
            "0";


        matchTimeRemaining =
            MATCH_DURATION;


        matchRunning = true;

        matchEnded = false;


        matchEnd.style.display =
            "none";


        activePlayerIndex = 0;


        createTeams();


        ballX =
            worldWidth / 2;


        ballY =
            worldHeight / 2;


        ballVX = 0;

        ballVY = 0;


        cameraX = 0;


        cameraY =
            worldHeight -
            viewHeight;


        resetJoystick();

        cancelCharging();


        draw();

    }
);


/* =========================================================
   RESIZE
========================================================= */

function resizeGame(){

    viewWidth =
        game.clientWidth;


    viewHeight =
        game.clientHeight;


    worldWidth =
        viewWidth;


    worldHeight =
        viewHeight * 2;


    field.style.width =
        `${worldWidth}px`;


    field.style.height =
        `${worldHeight}px`;

}


/* =========================================================
   UPDATE GAME
========================================================= */

function updateGame(dt){

    if(
        !matchRunning ||
        matchEnded
    )
        return;


    updateMatchTimer(dt);


    updateControlledPlayer(dt);


    updateBlueAI(dt);


    updateRedAI(dt);


    updateBallAI(dt);


    tackle();


    updateCharge(dt);


    updateBall(dt);


    tryBallPickup();


    separatePlayers(
        teamPlayers,
        55
    );


    separatePlayers(
        opponents,
        55
    );


    updateCamera();


    draw();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

    let dt =
        (now -
        lastTimestamp) /
        1000;


    lastTimestamp =
        now;


    dt =
        Math.min(
            dt,
            0.033
        );


    updateGame(dt);


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

function initializeGame(){

    resizeGame();


    createTeams();


    ballX =
        worldWidth / 2;


    ballY =
        worldHeight / 2;


    cameraX = 0;


    cameraY =
        worldHeight -
        viewHeight;


    activePlayerIndex = 0;


    for(
        let i=0;
        i<teamPlayers.length;
        i++
    ){

        teamPlayers[i].controlled =
            i ===
            activePlayerIndex;

    }


    draw();


    lastTimestamp =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   RESIZE EVENT
========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeGame();


        ballX =
            clamp(
                ballX,
                BALL_RADIUS,
                worldWidth -
                BALL_RADIUS
            );


        ballY =
            clamp(
                ballY,
                BALL_RADIUS,
                worldHeight -
                BALL_RADIUS
            );


        draw();

    }
);


/* =========================================================
   START
========================================================= */

initializeGame();

</script>
