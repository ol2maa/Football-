<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<title>كرة القدم ⚽️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #16803c;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    touch-action: none;

    overscroll-behavior: none;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;

    touch-action: none;
}


/* =========================================
   الملعب
========================================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 700px;

    overflow: hidden;

    background:

        repeating-linear-gradient(
            90deg,

            rgba(255,255,255,0.035)
            0px,

            rgba(255,255,255,0.035)
            50px,

            rgba(0,0,0,0.035)
            50px,

            rgba(0,0,0,0.035)
            100px
        ),

        #16803c;

    touch-action: none;

    overscroll-behavior: none;
}


/* =========================================
   خط المنتصف
========================================= */

.center-line {

    position: absolute;

    width: 100%;
    height: 2px;

    left: 0;
    top: 50%;

    background:
        rgba(255,255,255,0.55);

    pointer-events: none;
}


/* =========================================
   دائرة المنتصف
========================================= */

.center-circle {

    position: absolute;

    width: 170px;
    height: 170px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,0.55);

    border-radius: 50%;

    pointer-events: none;
}


/* =========================================
   اللاعب
========================================= */

#player {

    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #1769ff;

    border:
        4px solid white;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.35);

    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 25px;

    touch-action: none;
}


/* =========================================
   الكرة
========================================= */

#ball {

    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: white;

    border:
        2px solid #222;

    box-shadow:
        0 3px 7px
        rgba(0,0,0,0.35);

    transform:
        translate(-50%, -50%);

    z-index: 9;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 18px;

    pointer-events: none;
}


/* =========================================
   سهم اتجاه الركلة
========================================= */

#aim {

    position: absolute;

    width: 78px;
    height: 4px;

    background: #ffd400;

    border-radius: 5px;

    transform-origin:
        left center;

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 6px
        rgba(255,215,0,0.8);
}


#aim::after {

    content: "";

    position: absolute;

    right: -2px;
    top: 50%;

    width: 0;
    height: 0;

    border-top:
        8px solid transparent;

    border-bottom:
        8px solid transparent;

    border-left:
        14px solid #ffd400;

    transform:
        translateY(-50%);
}


/* =========================================
   عداد القوة
========================================= */

#powerBox {

    position: absolute;

    top: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 190px;
    height: 18px;

    border:
        2px solid white;

    border-radius: 20px;

    background:
        rgba(0,0,0,0.35);

    overflow: hidden;

    z-index: 30;
}


#power {

    width: 0%;

    height: 100%;

    background: #ffd400;

    border-radius: 20px;
}


/* =========================================
   نص القوة
========================================= */

#powerText {

    position: absolute;

    top: 42px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 14px;

    text-shadow:
        0 2px 4px black;

    z-index: 30;

    white-space: nowrap;
}


/* =========================================
   JOYSTICK الحركة
========================================= */

#movePad {

    position: absolute;

    left: 22px;
    bottom: 28px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.12);

    border:
        3px solid
        rgba(255,255,255,0.35);

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.25);

    z-index: 40;

    touch-action: none;

    /*
       مهم:
       الإصبع يستطيع التحرك
       داخل وخارج الدائرة
       بدون فقدان التحكم
    */
}


/* =========================================
   دائرة وسط Joystick
========================================= */

#joystickCenter {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 54px;
    height: 54px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.30);

    border:
        3px solid white;

    box-shadow:
        0 4px 8px
        rgba(0,0,0,0.35);

    pointer-events: none;

    transition:
        transform 0.04s linear;
}


/* =========================================
   أسهم الاتجاه
========================================= */

.moveArrow {

    position: absolute;

    color: white;

    font-size: 24px;

    font-weight: bold;

    opacity: 0.85;

    pointer-events: none;

    text-shadow:
        0 2px 4px black;
}


/* أعلى */

#arrowUp {

    left: 50%;
    top: 10px;

    transform:
        translateX(-50%);
}


/* أسفل */

#arrowDown {

    left: 50%;
    bottom: 10px;

    transform:
        translateX(-50%);
}


/* يسار */

#arrowLeft {

    left: 10px;
    top: 50%;

    transform:
        translateY(-50%);
}


/* يمين */

#arrowRight {

    right: 10px;
    top: 50%;

    transform:
        translateY(-50%);
}


/* =========================================
   وحدة تحكم الركلة
========================================= */

#kickControl {

    position: absolute;

    right: 22px;
    bottom: 28px;

    width: 84px;
    height: 84px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.18);

    border:
        5px solid white;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.35);

    z-index: 40;

    touch-action: none;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================================
   الزر الأحمر
========================================= */

#kickButton {

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #e53935;

    color: white;

    font-size: 34px;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        inset 0 0 0 2px
        rgba(255,255,255,0.15);

    pointer-events: none;

    transition:
        transform 0.08s ease;
}


/* =========================================
   مؤشر الإصبع للركلة
========================================= */

#kickDot {

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px
        rgba(255,255,255,0.9);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0;
}


/* =========================================
   التعليمات
========================================= */

#info {

    position: absolute;

    top: 72px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 12px;

    background:
        rgba(0,0,0,0.35);

    padding:
        6px 12px;

    border-radius: 20px;

    z-index: 30;

    white-space: nowrap;

    pointer-events: none;
}

</style>

</head>


<body>

<div id="game">

    <div class="center-line"></div>

    <div class="center-circle"></div>


    <div id="player">
        🧍
    </div>


    <div id="ball">
        ⚽
    </div>


    <div id="aim"></div>


    <div id="powerBox">

        <div id="power"></div>

    </div>


    <div id="powerText">
        قوة الركلة
    </div>


    <!-- =====================================
         JOYSTICK الحركة
    ====================================== -->

    <div id="movePad">

        <div
            class="moveArrow"
            id="arrowUp">
            ▲
        </div>

        <div
            class="moveArrow"
            id="arrowDown">
            ▼
        </div>

        <div
            class="moveArrow"
            id="arrowLeft">
            ◀
        </div>

        <div
            class="moveArrow"
            id="arrowRight">
            ▶
        </div>

        <div id="joystickCenter"></div>

    </div>


    <!-- =====================================
         الركلة
    ====================================== -->

    <div id="kickControl">

        <div id="kickButton">
            👟
        </div>

        <div id="kickDot"></div>

    </div>


    <div id="info">
        حرّك إصبعك للتحكم • الحركة والركل معًا
    </div>

</div>


<script>

/* =================================================
   العناصر
================================================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const ball =
    document.getElementById("ball");

const aim =
    document.getElementById("aim");

const kickControl =
    document.getElementById("kickControl");

const kickButton =
    document.getElementById("kickButton");

const kickDot =
    document.getElementById("kickDot");

const powerBar =
    document.getElementById("power");


const movePad =
    document.getElementById("movePad");

const joystickCenter =
    document.getElementById(
        "joystickCenter"
    );


/* =================================================
   حجم الملعب
================================================= */

let gameWidth =
    game.clientWidth;

let gameHeight =
    game.clientHeight;


/* =================================================
   اللاعب
================================================= */

let playerX =
    gameWidth / 2;

let playerY =
    gameHeight / 2;


/* =================================================
   الكرة
================================================= */

let ballX =
    playerX;

let ballY =
    playerY - 42;


/* =================================================
   اتجاه الركلة
================================================= */

let aimAngle =
    -Math.PI / 2;


/* =================================================
   سرعة اللاعب
================================================= */

/*
   تم تخفيض السرعة بشكل واضح.

   سابقًا:
   4.5

   الآن:
   2.0
*/

const playerSpeed = 2.0;


/* =================================================
   حركة الكرة
================================================= */

let ballVX = 0;

let ballVY = 0;

let ballMoving = false;


/* =================================================
   احتكاك الكرة
================================================= */

const friction = 0.985;


/* =================================================
   قوة الركلة
================================================= */

let charging = false;

let power = 0;

const maxPower = 100;

const powerSpeed = 1.4;


/* =================================================
   Joystick الحركة
================================================= */

let movePointerId = null;

let moveTouching = false;


/*
   اتجاه الحركة الحالي

   القيم من -1 إلى +1
*/

let moveX = 0;

let moveY = 0;


/* =================================================
   وحدة الركلة
================================================= */

let kickPointerId = null;

let kickTouching = false;


/* =================================================
   الكرة أمام اللاعب
================================================= */

function placeBallWithPlayer() {

    if (ballMoving)
        return;


    const distance = 42;


    ballX =
        playerX +
        Math.cos(aimAngle) *
        distance;


    ballY =
        playerY +
        Math.sin(aimAngle) *
        distance;
}


/* =================================================
   الرسم
================================================= */

function draw() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";


    ball.style.left =
        ballX + "px";

    ball.style.top =
        ballY + "px";


    aim.style.left =
        ballX + "px";

    aim.style.top =
        ballY + "px";


    aim.style.transform =
        `rotate(${aimAngle}rad)`;


    if (ballMoving) {

        aim.style.opacity =
            "0.25";

    } else {

        aim.style.opacity =
            "1";

    }

}


/* =================================================
   حركة اللاعب
================================================= */

function movePlayer(dx, dy) {

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length < 0.001)
        return;


    /*
       توحيد السرعة.

       هذا يجعل:
       ↑

       و

       ↗️

       بنفس السرعة.
    */

    dx /= length;
    dy /= length;


    playerX +=
        dx * playerSpeed;

    playerY +=
        dy * playerSpeed;


    const radius = 24;


    playerX =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                playerX
            )
        );


    playerY =
        Math.max(
            radius,
            Math.min(
                gameHeight - radius,
                playerY
            )
        );


    if (!ballMoving) {

        placeBallWithPlayer();

    }

}


/* =================================================
   تحديث اللعبة
================================================= */

function update() {

    /*
       الحركة تأتي مباشرة
       من مكان الإصبع على Joystick
    */

    movePlayer(
        moveX,
        moveY
    );


    /* =============================================
       حركة الكرة
    ============================================= */

    if (ballMoving) {

        ballX += ballVX;

        ballY += ballVY;


        ballVX *= friction;

        ballVY *= friction;


        const ballRadius = 15;


        /* يمين */

        if (
            ballX >
            gameWidth - ballRadius
        ) {

            ballX =
                gameWidth -
                ballRadius;

            ballVX =
                -Math.abs(ballVX);

        }


        /* يسار */

        if (
            ballX <
            ballRadius
        ) {

            ballX =
                ballRadius;

            ballVX =
                Math.abs(ballVX);

        }


        /* أعلى */

        if (
            ballY <
            ballRadius
        ) {

            ballY =
                ballRadius;

            ballVY =
                Math.abs(ballVY);

        }


        /* أسفل */

        if (
            ballY >
            gameHeight - ballRadius
        ) {

            ballY =
                gameHeight -
                ballRadius;

            ballVY =
                -Math.abs(ballVY);

        }


        const speed =
            Math.sqrt(
                ballVX * ballVX +
                ballVY * ballVY
            );


        if (speed < 0.15) {

            ballVX = 0;

            ballVY = 0;

            ballMoving = false;

            placeBallWithPlayer();

        }

    }


    draw();


    requestAnimationFrame(update);

}


/* =================================================
   حساب اتجاه Joystick
================================================= */

function updateMoveJoystick(
    clientX,
    clientY
) {

    const rect =
        movePad.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX - centerX;


    let dy =
        clientY - centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       نصف قطر الحركة
    */

    const maxDistance = 48;


    /*
       إذا خرج الإصبع من الدائرة
       نثبت الاتجاه عند الحافة
    */

    if (
        distance > maxDistance
    ) {

        dx =
            (dx / distance) *
            maxDistance;

        dy =
            (dy / distance) *
            maxDistance;

    }


    /*
       الاتجاه الحقيقي.

       هنا توجد الحركة القطرية.
    */

    if (distance > 6) {

        moveX =
            dx / maxDistance;

        moveY =
            dy / maxDistance;

    } else {

        moveX = 0;

        moveY = 0;

    }


    /*
       تحريك الدائرة الوسطى
       مع الإصبع
    */

    joystickCenter.style.transform =
        `translate(calc(-50% + ${dx}px),
                   calc(-50% + ${dy}px))`;

}


/* =================================================
   بداية Joystick
================================================= */

movePad.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        moveTouching = true;

        movePointerId =
            e.pointerId;


        try {

            movePad.setPointerCapture(
                e.pointerId
            );

        } catch (error) {}


        updateMoveJoystick(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   حركة الإصبع على Joystick
================================================= */

movePad.addEventListener(
    "pointermove",
    function(e) {

        if (!moveTouching)
            return;


        if (
            e.pointerId !==
            movePointerId
        )
            return;


        e.preventDefault();


        /*
           أهم تغيير:

           لا نحتاج رفع الإصبع
           لتغيير الاتجاه.
        */

        updateMoveJoystick(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   إيقاف Joystick
================================================= */

function stopMoveJoystick(e) {

    if (
        e.pointerId !==
        movePointerId
    )
        return;


    moveTouching = false;

    movePointerId = null;


    moveX = 0;

    moveY = 0;


    joystickCenter.style.transform =
        "translate(-50%, -50%)";

}


movePad.addEventListener(
    "pointerup",
    stopMoveJoystick
);


movePad.addEventListener(
    "pointercancel",
    stopMoveJoystick
);


movePad.addEventListener(
    "lostpointercapture",
    function() {

        moveTouching = false;

        movePointerId = null;

        moveX = 0;

        moveY = 0;

        joystickCenter.style.transform =
            "translate(-50%, -50%)";

    }
);


/* =================================================
   تحديد اتجاه الركلة
================================================= */

function updateKickDirection(
    clientX,
    clientY
) {

    const rect =
        kickControl.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX - centerX;


    let dy =
        clientY - centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > 5) {

        aimAngle =
            Math.atan2(
                dy,
                dx
            );

    }


    const maxDotDistance = 30;


    let dotX = dx;

    let dotY = dy;


    if (
        distance >
        maxDotDistance
    ) {

        dotX =
            (dx / distance) *
            maxDotDistance;

        dotY =
            (dy / distance) *
            maxDotDistance;

    }


    kickDot.style.left =
        `calc(50% + ${dotX}px)`;


    kickDot.style.top =
        `calc(50% + ${dotY}px)`;


    kickDot.style.opacity =
        "1";


    if (
        distance < 20
    ) {

        kickDot.style.opacity =
            "0";

    }


    if (!ballMoving) {

        placeBallWithPlayer();

    }


    draw();

}


/* =================================================
   بداية الركلة
================================================= */

kickControl.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (ballMoving)
            return;


        kickTouching = true;

        kickPointerId =
            e.pointerId;


        try {

            kickControl.setPointerCapture(
                e.pointerId
            );

        } catch (error) {}


        updateKickDirection(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   حركة إصبع الركلة
================================================= */

kickControl.addEventListener(
    "pointermove",
    function(e) {

        if (!kickTouching)
            return;


        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        e.preventDefault();


        updateKickDirection(
            e.clientX,
            e.clientY
        );


        const rect =
            kickControl.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const dx =
            e.clientX -
            centerX;


        const dy =
            e.clientY -
            centerY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           دخول المركز = بدء الشحن
        */

        if (
            distance < 20 &&
            !charging
        ) {

            startCharging();

        }


        /*
           الخروج من المركز
           يوقف الشحن
        */

        if (
            distance >= 20 &&
            charging
        ) {

            charging = false;

        }

    }
);


/* =================================================
   بدء شحن الركلة
================================================= */

function startCharging() {

    if (ballMoving)
        return;


    charging = true;

    power = 0;


    kickButton.style.transform =
        "scale(0.92)";


    chargePower();

}


/* =================================================
   شحن الركلة
================================================= */

function chargePower() {

    if (!charging)
        return;


    power += powerSpeed;


    if (
        power >
        maxPower
    ) {

        power =
            maxPower;

    }


    powerBar.style.width =
        power + "%";


    requestAnimationFrame(
        chargePower
    );

}


/* =================================================
   رفع إصبع الركلة
================================================= */

kickControl.addEventListener(
    "pointerup",
    function(e) {

        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        const rect =
            kickControl.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const dx =
            e.clientX -
            centerX;


        const dy =
            e.clientY -
            centerY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        if (
            charging &&
            distance < 20
        ) {

            kick();

        } else {

            charging = false;

            power = 0;

            powerBar.style.width =
                "0%";

        }


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

    }
);


/* =================================================
   إلغاء الركلة
================================================= */

kickControl.addEventListener(
    "pointercancel",
    function() {

        charging = false;

        power = 0;

        powerBar.style.width =
            "0%";


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

    }
);


/* =================================================
   تنفيذ الركلة
================================================= */

function kick() {

    if (!charging)
        return;


    charging = false;


    if (power < 5)
        power = 5;


    const minSpeed = 5;

    const maxSpeed = 18;


    const speed =
        minSpeed +
        (power / 100) *
        (maxSpeed - minSpeed);


    ballVX =
        Math.cos(aimAngle) *
        speed;


    ballVY =
        Math.sin(aimAngle) *
        speed;


    ballMoving = true;


    power = 0;


    powerBar.style.width =
        "0%";


    kickButton.style.transform =
        "scale(1)";

}


/* =================================================
   منع التكبير والإيماءات
================================================= */

document.addEventListener(
    "gesturestart",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


/* =================================================
   تغيير حجم الشاشة
================================================= */

window.addEventListener(
    "resize",
    function() {

        gameWidth =
            game.clientWidth;

        gameHeight =
            game.clientHeight;


        playerX =
            Math.max(
                24,
                Math.min(
                    gameWidth - 24,
                    playerX
                )
            );


        playerY =
            Math.max(
                24,
                Math.min(
                    gameHeight - 24,
                    playerY
                )
            );


        if (!ballMoving) {

            placeBallWithPlayer();

        }

    }
);


/* =================================================
   البداية
================================================= */

placeBallWithPlayer();

draw();

update();

</script>
