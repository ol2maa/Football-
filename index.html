<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="format-detection"
content="telephone=no">

<title>كرة القدم ⚽️ v4.1.0</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
box-sizing:border-box;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
-webkit-tap-highlight-color:transparent;
}


html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

background:#111;

font-family:Arial,sans-serif;

touch-action:none;

-webkit-text-size-adjust:100%;

}


/* =========================================================
   GAME
========================================================= */

#game{

position:fixed;

inset:0;

overflow:hidden;

background:#16843a;

touch-action:none;

}


/* =========================================================
   FIELD
========================================================= */

#field{

position:absolute;

left:0;
top:0;

width:1200px;
height:2200px;

background:
repeating-linear-gradient(
to bottom,

#168b3d 0px,
#168b3d 80px,

#15833a 80px,
#15833a 160px
);

overflow:hidden;

transform:
translate3d(0,0,0);

will-change:transform;

}


/* =========================================================
   PITCH MARKINGS
========================================================= */

.pitchMarkings{

position:absolute;

left:0;
top:0;

width:1200px;
height:2200px;

z-index:5;

pointer-events:none;

overflow:visible;

}


/* =========================================================
   PLAYER
========================================================= */

.playerUnit{

position:absolute;

left:0;
top:0;

width:38px;
height:38px;

border-radius:50%;

display:flex;

align-items:center;
justify-content:center;

font-size:24px;

line-height:1;

z-index:20;

will-change:transform;

}


.playerUnit.blue{

background:#1677ff;

border:3px solid #fff;

box-shadow:
0 2px 5px #0008;

}


.playerUnit.red{

background:#e52d38;

border:3px solid #fff;

box-shadow:
0 2px 5px #0008;

}


/* =========================================================
   CONTROL ARROW
========================================================= */

.controlArrow{

position:absolute;

left:50%;
top:-21px;

transform:
translateX(-50%);

color:#ffd400;

font-size:16px;

font-weight:900;

line-height:1;

text-shadow:
0 2px 3px #000;

pointer-events:none;

display:none;

z-index:30;

}


.playerUnit.controlled{

box-shadow:

0 0 0 3px #ffd400,

0 0 12px #ffd400,

0 2px 5px #0008;

}


/* =========================================================
   BALL
========================================================= */

#ball{

position:absolute;

left:0;
top:0;

width:22px;
height:22px;

border-radius:50%;

background:white;

border:2px solid #222;

z-index:25;

display:flex;

align-items:center;
justify-content:center;

font-size:14px;

will-change:transform;

}


/* =========================================================
   AIM ARROW
========================================================= */

#aimArrow{

position:absolute;

left:0;
top:0;

width:5px;
height:70px;

background:#ffd400;

transform-origin:
50% 100%;

z-index:15;

display:none;

border-radius:4px;

box-shadow:
0 0 6px #000;

pointer-events:none;

}


#aimArrow::after{

content:"";

position:absolute;

left:50%;
top:-10px;

transform:
translateX(-50%);

border-left:
9px solid transparent;

border-right:
9px solid transparent;

border-bottom:
16px solid #ffd400;

}


/* =========================================================
   SCORE BOARD
========================================================= */

#scoreBoard{

position:fixed;

top:
calc(
env(safe-area-inset-top) + 8px
);

left:50%;

transform:
translateX(-50%);

z-index:100;

background:#000b;

color:white;

padding:7px 18px;

border-radius:18px;

font-size:20px;

font-weight:bold;

min-width:130px;

text-align:center;

}


#matchTime{

font-size:14px;

margin-top:2px;

}


#matchTime.warning{

color:#ff3b30;

}


/* =========================================================
   GOAL CELEBRATION
========================================================= */

#goalCelebration{

position:fixed;

inset:0;

z-index:450;

display:none;

align-items:center;
justify-content:center;

pointer-events:none;

}


#goalCelebrationText{

padding:20px 35px;

border-radius:25px;

background:#000c;

color:white;

font-size:48px;

font-weight:900;

text-align:center;

text-shadow:
0 3px 8px #000;

transform:
scale(0.7);

animation:
goalPop .35s ease-out forwards;

}


@keyframes goalPop{

0%{

transform:
scale(.7);

opacity:0;

}

70%{

transform:
scale(1.15);

opacity:1;

}

100%{

transform:
scale(1);

opacity:1;

}

}


/* =========================================================
   POWER
========================================================= */

#powerBox{

position:fixed;

left:50%;

bottom:145px;

transform:
translateX(-50%);

width:150px;
height:13px;

border:2px solid white;

border-radius:10px;

overflow:hidden;

background:#0008;

z-index:100;

display:none;

}


#powerBar{

width:0%;

height:100%;

background:#ffd400;

}


/* =========================================================
   JOYSTICK
========================================================= */

#movePad{

position:fixed;

left:25px;

bottom:
calc(
25px +
env(safe-area-inset-bottom)
);

width:120px;
height:120px;

border-radius:50%;

background:#ffffff22;

border:3px solid #ffffff66;

z-index:200;

touch-action:none;

}


#joystickCenter{

position:absolute;

left:50%;
top:50%;

width:55px;
height:55px;

border-radius:50%;

transform:
translate(-50%,-50%);

background:#ffffff66;

border:3px solid #fff;

will-change:transform;

}


/* =========================================================
   KICK CONTROL
========================================================= */

#kickControl{

position:fixed;

right:28px;

bottom:
calc(
30px +
env(safe-area-inset-bottom)
);

width:92px;
height:92px;

border-radius:50%;

background:#e52d38dd;

border:4px solid #fff;

z-index:200;

display:flex;

align-items:center;
justify-content:center;

touch-action:none;

box-shadow:
0 3px 8px #0008;

}


#kickDot{

width:25px;
height:25px;

border-radius:50%;

background:white;

display:flex;

align-items:center;
justify-content:center;

font-size:22px;

line-height:1;

}


/* =========================================================
   MATCH END
========================================================= */

#matchEnd{

position:fixed;

inset:0;

background:#000b;

z-index:500;

display:none;

align-items:center;

justify-content:center;

flex-direction:column;

color:white;

}


#matchEnd h1{

margin:0 0 15px;

font-size:32px;

}


#finalScore{

font-size:28px;

margin-bottom:25px;

}


#newMatch{

border:0;

border-radius:15px;

padding:14px 28px;

font-size:20px;

font-weight:bold;

background:#1677ff;

color:white;

}

</style>

</head>
