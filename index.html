<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<title>كرة القدم ⚽️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #16803c;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    touch-action: none;
    overscroll-behavior: none;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;

    touch-action: none;
}


/* =================================================
   الملعب
================================================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 700px;

    overflow: hidden;

    background:

        repeating-linear-gradient(
            90deg,

            rgba(255,255,255,0.035)
            0px,

            rgba(255,255,255,0.035)
            50px,

            rgba(0,0,0,0.035)
            50px,

            rgba(0,0,0,0.035)
            100px
        ),

        #16803c;

    touch-action: none;
    overscroll-behavior: none;
}


/* =================================================
   خطوط الملعب
================================================= */

.center-line {

    position: absolute;

    width: 100%;
    height: 2px;

    left: 0;
    top: 50%;

    background:
        rgba(255,255,255,0.55);

    pointer-events: none;
}

.center-circle {

    position: absolute;

    width: 170px;
    height: 170px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,0.55);

    border-radius: 50%;

    pointer-events: none;
}


/* =================================================
   المرمى
================================================= */

.goal {

    position: absolute;

    left: 50%;

    width: 190px;
    height: 48px;

    transform:
        translateX(-50%);

    z-index: 3;

    pointer-events: none;
}

#topGoal {
    top: 0;
}

#bottomGoal {
    bottom: 0;
}

.goalNet {

    position: absolute;

    left: 50%;

    width: 190px;
    height: 48px;

    transform:
        translateX(-50%);

    border-left:
        2px solid
        rgba(255,255,255,0.65);

    border-right:
        2px solid
        rgba(255,255,255,0.65);

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.08) 0px,
            rgba(255,255,255,0.08) 2px,
            transparent 2px,
            transparent 8px
        );

    opacity: 0.8;
}

.goalPost {

    position: absolute;

    width: 12px;
    height: 58px;

    background: white;

    border-radius: 5px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.35);
}

.goalPost.left {

    left: 0;
    top: 0;
}

.goalPost.right {

    right: 0;
    top: 0;
}

.goalCrossbar {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 12px;

    background: white;

    border-radius: 5px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.35);
}

#bottomGoal .goalPost {

    top: auto;
    bottom: 0;
}

#bottomGoal .goalCrossbar {

    top: auto;
    bottom: 0;
}


/* =================================================
   النتيجة
================================================= */

#score {

    position: absolute;

    top: 82px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 24px;
    font-weight: bold;

    background:
        rgba(0,0,0,0.35);

    padding:
        5px 18px;

    border-radius: 20px;

    z-index: 35;

    text-shadow:
        0 2px 4px black;
}


/* =================================================
   رسالة الهدف
================================================= */

#goalMessage {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.7);

    color: white;

    font-size: 42px;
    font-weight: 900;

    text-shadow:
        0 4px 10px
        rgba(0,0,0,0.8);

    background:
        rgba(0,0,0,0.45);

    padding:
        15px 28px;

    border-radius: 25px;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

#goalMessage.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}


/* =================================================
   اللاعبين
================================================= */

.playerUnit {

    position: absolute;

    width: 38px;
    height: 38px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        4px solid white;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.35);

    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 23px;

    touch-action: none;
}

.playerUnit.blue {
    background: #1769ff;
}

.playerUnit.red {
    background: #e53935;
}

.playerUnit.controlled {

    box-shadow:
        0 0 0 3px
        rgba(255,215,0,0.45),
        0 4px 10px
        rgba(0,0,0,0.35);
}


/* =================================================
   سهم التحكم
================================================= */

.controlArrow {

    position: absolute;

    left: 50%;
    top: -19px;

    transform:
        translateX(-50%);

    color: #ffd400;

    font-size: 15px;
    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 2px 3px black;

    opacity: 0;

    pointer-events: none;
}

.playerUnit.controlled .controlArrow {
    opacity: 1;
}


/* =================================================
   الكرة
================================================= */

#ball {

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: white;

    border:
        2px solid #222;

    box-shadow:
        0 3px 7px
        rgba(0,0,0,0.35);

    transform:
        translate(-50%, -50%);

    z-index: 9;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 14px;

    pointer-events: none;
}


/* =================================================
   سهم الركلة
================================================= */

#aim {

    position: absolute;

    width: 78px;
    height: 4px;

    background: #ffd400;

    border-radius: 5px;

    transform-origin:
        left center;

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 6px
        rgba(255,215,0,0.8);
}

#aim::after {

    content: "";

    position: absolute;

    right: -2px;
    top: 50%;

    width: 0;
    height: 0;

    border-top:
        8px solid transparent;

    border-bottom:
        8px solid transparent;

    border-left:
        14px solid #ffd400;

    transform:
        translateY(-50%);
}


/* =================================================
   القوة
================================================= */

#powerBox {

    position: absolute;

    top: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 190px;
    height: 18px;

    border:
        2px solid white;

    border-radius: 20px;

    background:
        rgba(0,0,0,0.35);

    overflow: hidden;

    z-index: 30;
}

#power {

    width: 0%;
    height: 100%;

    background: #ffd400;

    border-radius: 20px;
}

#powerText {

    position: absolute;

    top: 42px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 14px;

    text-shadow:
        0 2px 4px black;

    z-index: 30;

    white-space: nowrap;
}


/* =================================================
   JOYSTICK
================================================= */

#movePad {

    position: absolute;

    left: 22px;
    bottom: 28px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.12);

    border:
        3px solid
        rgba(255,255,255,0.35);

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.25);

    z-index: 40;

    touch-action: none;
}

#joystickCenter {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 54px;
    height: 54px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.30);

    border:
        3px solid white;

    box-shadow:
        0 4px 8px
        rgba(0,0,0,0.35);

    pointer-events: none;

    transition:
        transform 0.04s linear;
}

.moveArrow {

    position: absolute;

    color: white;

    font-size: 24px;
    font-weight: bold;

    opacity: 0.85;

    pointer-events: none;

    text-shadow:
        0 2px 4px black;
}

#arrowUp {

    left: 50%;
    top: 10px;

    transform:
        translateX(-50%);
}

#arrowDown {

    left: 50%;
    bottom: 10px;

    transform:
        translateX(-50%);
}

#arrowLeft {

    left: 10px;
    top: 50%;

    transform:
        translateY(-50%);
}

#arrowRight {

    right: 10px;
    top: 50%;

    transform:
        translateY(-50%);
}


/* =================================================
   الركلة
================================================= */

#kickControl {

    position: absolute;

    right: 22px;
    bottom: 28px;

    width: 84px;
    height: 84px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.18);

    border:
        5px solid white;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.35);

    z-index: 40;

    touch-action: none;

    display: flex;

    justify-content: center;
    align-items: center;
}

#kickButton {

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #e53935;

    color: white;

    font-size: 34px;

    display: flex;

    justify-content: center;
    align-items: center;

    pointer-events: none;

    transition:
        transform 0.08s ease;
}

#kickDot {

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px
        rgba(255,255,255,0.9);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0;
}


/* =================================================
   التعليمات
================================================= */

#info {

    position: absolute;

    top: 72px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 12px;

    background:
        rgba(0,0,0,0.35);

    padding:
        6px 12px;

    border-radius: 20px;

    z-index: 30;

    white-space: nowrap;

    pointer-events: none;
}

</style>

</head>


<body>

<div id="game">

    <div class="center-line"></div>

    ================================================= -->

    <!-- الجناح الأيسر -->

    <!-- الجناح الأيمن -->

    <div

    <!-- الدفاع الأيسر -->

    <div
    id="opponent4"

    <div

<script>

/* =================================================
   العناصر
================================================= */

const game =
    document.getElementById("game");

const ball =
    document.getElementById("ball");

const aim =
    document.getElementById("aim");

const kickControl =
    document.getElementById("kickControl");

const kickButton =
    document.getElementById("kickButton");

const kickDot =
    document.getElementById("kickDot");

const powerBar =
    document.getElementById("power");

const movePad =
    document.getElementById("movePad");

const joystickCenter =
    document.getElementById("joystickCenter");

const scoreElement =
    document.getElementById("score");

const goalMessage =
    document.getElementById("goalMessage");


/* =================================================
   حجم الملعب
================================================= */

let gameWidth =
    game.clientWidth;

let gameHeight =
    game.clientHeight;


/* =================================================
   فريقك - 5 لاعبين
================================================= */

const teamPlayers = [

    /*
       0 - المهاجم
    */

    {
        id: "player",
        el: document.getElementById("player"),

        role: "forward",

        x: gameWidth / 2,
        y: gameHeight * 0.48,

        anchorX: 0.50,
        anchorY: 0.48,

        speed: 1.0
    },


    /*
       1 - الجناح الأيسر
    */

    {
        id: "teammate1",
        el: document.getElementById("teammate1"),

        role: "wing",

        x: gameWidth * 0.20,
        y: gameHeight * 0.55,

        anchorX: 0.20,
        anchorY: 0.55,

        speed: 0.72
    },


    /*
       2 - الجناح الأيمن
    */

    {
        id: "teammate2",
        el: document.getElementById("teammate2"),

        role: "wing",

        x: gameWidth * 0.80,
        y: gameHeight * 0.55,

        anchorX: 0.80,
        anchorY: 0.55,

        speed: 0.72
    },


    /*
       3 - الدفاع الأيسر
    */

    {
        id: "teammate3",
        el: document.getElementById("teammate3"),

        role: "defense",

        x: gameWidth * 0.30,
        y: gameHeight * 0.70,

        anchorX: 0.30,
        anchorY: 0.70,

        speed: 0.68
    },


    /*
       4 - الدفاع الأيمن
    */

    {
        id: "teammate4",
        el: document.getElementById("teammate4"),

        role: "defense",

        x: gameWidth * 0.70,
        y: gameHeight * 0.70,

        anchorX: 0.70,
        anchorY: 0.70,

        speed: 0.68
    }

];


/* =================================================
   الخصم - 5 لاعبين
================================================= */

const opponents = [

    /*
       0 - المهاجم
       يبقى متقدمًا وقريبًا من دفاع الأزرق
    */

    {
        id: "opponent1",
        el: document.getElementById("opponent1"),

        role: "forward",

        x: gameWidth * 0.50,
        y: gameHeight * 0.20,

        anchorX: 0.50,
        anchorY: 0.20,

        speed: 0.62
    },


    /*
       1 - الجناح الأيسر
    */

    {
        id: "opponent2",
        el: document.getElementById("opponent2"),

        role: "wing",

        x: gameWidth * 0.18,
        y: gameHeight * 0.38,

        anchorX: 0.18,
        anchorY: 0.38,

        speed: 0.65
    },


    /*
       2 - الجناح الأيمن
    */

    {
        id: "opponent3",
        el: document.getElementById("opponent3"),

        role: "wing",

        x: gameWidth * 0.82,
        y: gameHeight * 0.38,

        anchorX: 0.82,
        anchorY: 0.38,

        speed: 0.65
    },


    /*
       3 - المدافع الثابت
       لا يتجاوز تقريبًا خط الـ18
    */

    {
        id: "opponent4",
        el: document.getElementById("opponent4"),

        role: "defense",

        defensive: true,

        x: gameWidth * 0.50,
        y: gameHeight * 0.88,

        anchorX: 0.50,
        anchorY: 0.88,

        speed: 0.50
    },


    /*
       4 - مدافع بناء الهجمة
       يتحرك من الدفاع باتجاه الوسط
    */

    {
        id: "opponent5",
        el: document.getElementById("opponent5"),

        role: "builder",

        x: gameWidth * 0.50,
        y: gameHeight * 0.65,

        anchorX: 0.50,
        anchorY: 0.65,

        speed: 0.58
    }

];


/* =================================================
   اللاعب المتحكم
================================================= */

let activePlayerIndex = 0;


/* =================================================
   الكرة
================================================= */

let ballX =
    gameWidth / 2;

let ballY =
    gameHeight / 2 - 42;

let ballVX = 0;
let ballVY = 0;

let ballMoving = false;


/*
   صاحب الكرة
*/

let ballOwner =
    teamPlayers[0];


/* =================================================
   اتجاه الركلة
================================================= */

let aimAngle =
    -Math.PI / 2;


/* =================================================
   الاحتكاك
================================================= */

const friction = 0.985;


/* =================================================
   قوة الركلة
================================================= */

let charging = false;

let power = 0;

const maxPower = 100;

const powerSpeed = 1.4;


/* =================================================
   النتيجة
================================================= */

let topScore = 0;
let bottomScore = 0;


/* =================================================
   الهدف
================================================= */

let goalScored = false;

let goalTimer = null;


/* =================================================
   أبعاد المرمى
================================================= */

const goalWidth = 190;

const postWidth = 12;

const ballRadius = 15;


/* =================================================
   Joystick
================================================= */

let movePointerId = null;

let moveTouching = false;

let moveX = 0;
let moveY = 0;


/* =================================================
   الركلة
================================================= */

let kickPointerId = null;

let kickTouching = false;

let kickDirectionDistance = 0;

const kickChargeDistance = 35;


/* =================================================
   التبديل اليدوي
================================================= */

const manualSwitchMinDistance = 55;

const manualSwitchDot = 0.70;

const manualSwitchCooldown = 500;

let manualControlLock = false;

let lastManualSwitchTime = 0;

let manualSwitchArmed = true;


/* =================================================
   التبديل التلقائي
================================================= */

let lastAutoSwitchTime = 0;

const autoSwitchCooldown = 300;


/* =================================================
   مسافة
================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =================================================
   اللاعب الحالي
================================================= */

function getActivePlayer() {

    return teamPlayers[
        activePlayerIndex
    ];

}


/* =================================================
   هل اللاعب من فريقنا؟
================================================= */

function isTeamPlayer(p) {

    return teamPlayers.includes(p);

}


/* =================================================
   اختيار اللاعب الأقرب
================================================= */

function autoSelectClosestPlayer() {

    if (goalScored)
        return;


    /*
       إذا الكرة مع لاعب من فريقنا
       يصبح هو المتحكم.
    */

    if (
        ballOwner &&
        isTeamPlayer(ballOwner)
    ) {

        const index =
            teamPlayers.indexOf(
                ballOwner
            );


        if (
            index !== -1 &&
            index !== activePlayerIndex
        ) {

            activePlayerIndex =
                index;

            manualControlLock =
                false;

            manualSwitchArmed =
                true;

        }

        return;

    }


    const now =
        Date.now();


    if (
        now -
        lastAutoSwitchTime <
        autoSwitchCooldown
    )
        return;


    let closestIndex = -1;

    let closestDistance =
        Infinity;


    teamPlayers.forEach(
        function(p, index) {

            const d =
                distanceBetween(
                    p.x,
                    p.y,
                    ballX,
                    ballY
                );


            if (
                d <
                closestDistance
            ) {

                closestDistance =
                    d;

                closestIndex =
                    index;

            }

        }
    );


    if (
        closestIndex === -1
    )
        return;


    const active =
        getActivePlayer();


    const activeDistance =
        distanceBetween(
            active.x,
            active.y,
            ballX,
            ballY
        );


    if (
        closestIndex !==
        activePlayerIndex
    ) {

        if (
            closestDistance <
            activeDistance - 20
        ) {

            activePlayerIndex =
                closestIndex;

            lastAutoSwitchTime =
                now;

            manualControlLock =
                false;

            manualSwitchArmed =
                true;

        }

    }

}


/* =================================================
   وضع الكرة أمام اللاعب
================================================= */

function placeBallWithOwner() {

    if (!ballOwner)
        return;


    const distance = 34;


    ballX =
        ballOwner.x +
        Math.cos(aimAngle) *
        distance;


    ballY =
        ballOwner.y +
        Math.sin(aimAngle) *
        distance;

}


/* =================================================

function updateScore() {

}

function draw() {

/* =================================================
   حدود المراكز
================================================= */

function getRoleBounds(p) {

    /*
       فريقنا يهاجم للأعلى.
    */

    if (
        isTeamPlayer(p)
    ) {

        if (p.role === "defense") {

            return {

                minY:
                    gameHeight * 0.50,

                maxY:
                    gameHeight - 35

            };

        }


        if (p.role === "wing") {

            return {

                minY:
                    gameHeight * 0.24,

                maxY:
                    gameHeight * 0.78

            };

        }


        return {

            minY:
                55,

            maxY:
                gameHeight * 0.62

        };

    }


    /*
       الخصم يهاجم للأسفل.
    */

    if (p.role === "defense") {

        return {

            minY:
                35,

            maxY:
                gameHeight * 0.50

        };

    }


    if (p.role === "wing") {

        return {

            minY:
                gameHeight * 0.22,

            maxY:
                gameHeight * 0.76

        };

    }


    return {

        minY:
            gameHeight * 0.38,

        maxY:
            gameHeight - 55

    };

}


/* =================================================
   حركة AI
================================================= */

function moveAITo(
    p,
    targetX,
    targetY,
    speed
) {

    let dx =
        targetX - p.x;

    let dy =
        targetY - p.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance < 2)
        return;


    dx /= distance;
    dy /= distance;


    p.x +=
        dx * speed;

    p.y +=
        dy * speed;


    const radius = 19;


    p.x =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                p.x
            )
        );


    const bounds =
        getRoleBounds(p);


    p.y =
        Math.max(
            bounds.minY,
            Math.min(
                bounds.maxY,
                p.y
            )
        );

}


/* =================================================
   هدف زملاء الفريق
================================================= */

function getTeamAITarget(p) {

    const active =
        getActivePlayer();


    /*
       الكرة مع الخصم.
    */

    if (
        ballOwner &&
        !isTeamPlayer(ballOwner)
    ) {

        if (p.role === "defense") {

            return {

                x:
                    p.anchorX *
                    gameWidth * 0.75 +
                    ballX * 0.25,

                y:
                    Math.max(
                        gameHeight * 0.55,
                        ballY + 70
                    )

            };

        }


        if (p.role === "wing") {

            const side =
                p.anchorX < 0.5
                    ? -1
                    : 1;


            return {

                x:
                    ballX +
                    side * 120,

                y:
                    Math.max(
                        gameHeight * 0.35,
                        ballY + 30
                    )

            };

        }


        return {

            x:
                ballX,

            y:
                Math.min(
                    gameHeight * 0.58,
                    ballY + 25
                )

        };

    }


    /*
       الكرة حرة.
    */

    if (!ballOwner) {

        if (p.role === "defense") {

            return {

                x:
                    p.anchorX *
                    gameWidth,

                y:
                    Math.max(
                        gameHeight * 0.55,
                        ballY + 85
                    )

            };

        }


        if (p.role === "wing") {

            const side =
                p.anchorX < 0.5
                    ? -1
                    : 1;


            return {

                x:
                    ballX +
                    side * 90,

                y:
                    ballY + 25

            };

        }


        return {

            x:
                ballX,

            y:
                Math.min(
                    ballY + 20,
                    gameHeight * 0.60
                )

        };

    }


    /*
       الكرة مع فريقنا.
    */

    if (
        ballOwner &&
        isTeamPlayer(ballOwner)
    ) {

        /*
           الدفاعان يحافظان على
           مسافة خلف الهجمة.
        */

        if (p.role === "defense") {

            const side =
                p.anchorX < 0.5
                    ? -1
                    : 1;


            return {

                x:
                    ballX +
                    side * 90,

                y:
                    gameHeight * 0.67

            };

        }


        /*
           الجناحان يفتحان الملعب.
        */

        if (p.role === "wing") {

            const side =
                p.anchorX < 0.5
                    ? -1
                    : 1;


            let targetX =
                ballX +
                side * 135;


            targetX =
                Math.max(
                    45,
                    Math.min(
                        gameWidth - 45,
                        targetX
                    )
                );


            return {

                x:
                    targetX,

                y:
                    Math.min(
                        gameHeight * 0.50,
                        ballY + 65
                    )

            };

        }


        /*
           المهاجم يتقدم.
        */

        return {

            x:
                ballX,

            y:
                gameHeight * 0.25

        };

    }


    /*
       العودة للمركز.
    */

    return {

        x:
            p.anchorX *
            gameWidth,

        y:
            p.anchorY *
            gameHeight

    };

}


/* =================================================
   AI فريقنا
================================================= */

function updateTeamAI() {

    teamPlayers.forEach(
        function(p, index) {

            if (
                index ===
                activePlayerIndex
            )
                return;


            if (goalScored)
                return;


            let target =
                getTeamAITarget(p);


            /*
               منع التكتل.
            */

            const active =
                getActivePlayer();


            const d =
                distanceBetween(
                    p.x,
                    p.y,
                    active.x,
                    active.y
                );


            if (d < 65) {

                const dx =
                    p.x -
                    active.x;

                const dy =
                    p.y -
                    active.y;


                const len =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (len > 0.01) {

                    target.x =
                        p.x +
                        (dx / len) *
                        85;

                    target.y =
                        p.y +
                        (dy / len) *
                        85;

                }

            }


            moveAITo(
                p,
                target.x,
                target.y,
                p.speed
            );

        }
    );

}

/* =================================================
   AI الخصم
================================================= */

function updateOpponentAI() {

    opponents.forEach(
        function(p) {

            if (goalScored)
                return;


            let target =
                getOpponentTarget(p);


            /*
               الجناح لا يطارد الكرة
               من مسافة بعيدة.
            */

            if (
                ballOwner &&
                ballOwner !== p &&
                p.role === "wing"
            ) {

                const d =
                    distanceBetween(
                        p.x,
                        p.y,
                        ballX,
                        ballY
                    );


                if (d > 180) {

                    target.x =
                        p.anchorX *
                        gameWidth;

                    target.y =
                        p.anchorY *
                        gameHeight;

                }

            }


            moveAITo(
                p,
                target.x,
                target.y,
                p.speed
            );


            /*
               الخصم يركل فقط عندما
               يقترب من مرمانا.
            */

            if (
                ballOwner === p
            ) {

                const distanceToGoal =
                    gameHeight -
                    p.y;


                if (
                    distanceToGoal < 180
                ) {

                    aiKickOpponent(p);

                }

            }

        }
    );

}


/* =================================================
   تحديث AI
================================================= */

function updatePlayersAI() {

    updateTeamAI();

    updateOpponentAI();

}


/* =================================================
   التبديل اليدوي
================================================= */

function tryManualPlayerSwitch() {

    if (goalScored)
        return false;


    if (
        ballOwner &&
        isTeamPlayer(ballOwner)
    )
        return false;


    const joystickLength =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );


    if (
        joystickLength <
        0.25
    ) {

        manualSwitchArmed =
            true;

        return false;

    }


    if (!manualSwitchArmed)
        return false;


    const now =
        Date.now();


    if (
        now -
        lastManualSwitchTime <
        manualSwitchCooldown
    )
        return false;


    const active =
        getActivePlayer();


    let bestIndex = -1;

    let bestDot =
        manualSwitchDot;


    teamPlayers.forEach(
        function(p, index) {

            if (
                index ===
                activePlayerIndex
            )
                return;


            const dx =
                p.x -
                active.x;

            const dy =
                p.y -
                active.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                manualSwitchMinDistance
            )
                return;


            const dirX =
                dx / distance;

            const dirY =
                dy / distance;


            const dot =
                moveX * dirX +
                moveY * dirY;


            if (
                dot >
                bestDot
            ) {

                bestDot =
                    dot;

                bestIndex =
                    index;

            }

        }
    );


    if (
        bestIndex ===
        -1
    )
        return false;


    activePlayerIndex =
        bestIndex;


    manualControlLock =
        true;


    lastManualSwitchTime =
        now;


    manualSwitchArmed =
        false;


    return true;

}


/* =================================================
   حركة اللاعب
================================================= */

function movePlayer(
    dx,
    dy
) {

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        length <
        0.001
    )
        return;


    dx /= length;
    dy /= length;


    const p =
        getActivePlayer();


    const radius = 19;


    p.x +=
        dx *
        1.0;


    p.y +=
        dy *
        1.0;


    p.x =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                p.x
            )
        );


    p.y =
        Math.max(
            radius,
            Math.min(
                gameHeight - radius,
                p.y
            )
        );


    if (
        ballOwner === p
    ) {

        placeBallWithOwner();

    }

}


/* =================================================
   التقاط الكرة
================================================= */

function tryPickupBall() {

    if (ballOwner)
        return;


    let closest = null;

    let closestDistance =
        Infinity;


    teamPlayers.forEach(
        function(p) {

            const d =
                distanceBetween(
                    ballX,
                    ballY,
                    p.x,
                    p.y
                );


            if (
                d < 32 &&
                d < closestDistance
            ) {

                closest =
                    p;

                closestDistance =
                    d;

            }

        }
    );


    opponents.forEach(
        function(p) {

            const d =
                distanceBetween(
                    ballX,
                    ballY,
                    p.x,
                    p.y
                );


            if (
                d < 30 &&
                d < closestDistance
            ) {

                closest =
                    p;

                closestDistance =
                    d;

            }

        }
    );


    if (!closest)
        return;


    ballOwner =
        closest;


    ballMoving =
        false;

    ballVX = 0;
    ballVY = 0;


    if (
        isTeamPlayer(closest)
    ) {

        activePlayerIndex =
            teamPlayers.indexOf(
                closest
            );


        manualControlLock =
            false;

        manualSwitchArmed =
            true;

        lastAutoSwitchTime =
            Date.now();


        placeBallWithOwner();

    } else {

        aimAngle =
            Math.atan2(
                gameHeight -
                closest.y,
                gameWidth / 2 -
                closest.x
            );


        placeBallWithOwner();

    }

}


/* =================================================
   ركلة الخصم
================================================= */

let opponentKickCooldown = 0;


function aiKickOpponent(p) {

    if (
        ballOwner !== p
    )
        return;


    if (
        opponentKickCooldown > 0
    )
        return;


    const targetX =
        gameWidth / 2;

    const targetY =
        gameHeight;


    const dx =
        targetX -
        p.x;

    const dy =
        targetY -
        p.y;


    aimAngle =
        Math.atan2(
            dy,
            dx
        );


    ballOwner =
        null;


    const speed = 5.2;


    ballVX =
        Math.cos(
            aimAngle
        ) *
        speed;


    ballVY =
        Math.sin(
            aimAngle
        ) *
        speed;


    ballMoving = true;


    opponentKickCooldown =
        80;

}


/* =================================================
   تصادم القائم
================================================= */

function collideWithPost(
    postX,
    postY
) {

    const dx =
        ballX - postX;

    const dy =
        ballY - postY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const collisionDistance =
        ballRadius +
        postWidth / 2;


    if (
        distance >=
        collisionDistance
    )
        return;


    let nx;
    let ny;


    if (
        distance <
        0.001
    ) {

        nx = 1;
        ny = 0;

    } else {

        nx =
            dx / distance;

        ny =
            dy / distance;

    }


    ballX =
        postX +
        nx *
        collisionDistance;


    ballY =
        postY +
        ny *
        collisionDistance;


    const velocityAlongNormal =
        ballVX * nx +
        ballVY * ny;


    if (
        velocityAlongNormal < 0
    ) {

        const bounce =
            0.55;


        ballVX -=
            (1 + bounce) *
            velocityAlongNormal *
            nx;


        ballVY -=
            (1 + bounce) *
            velocityAlongNormal *
            ny;

    }

}


/* =================================================
   القوائم
================================================= */

function handleGoalPosts() {

    const left =
        (gameWidth -
        goalWidth) / 2;

    const right =
        left +
        goalWidth;


    collideWithPost(
        left,
        10
    );


    collideWithPost(
        right,
        10
    );


    collideWithPost(
        left,
        gameHeight - 10
    );


    collideWithPost(
        right,
        gameHeight - 10
    );

}


/* =================================================
   فحص الهدف
================================================= */

function checkGoal() {

    const goalLeft =
        (gameWidth -
        goalWidth) / 2;

    const goalRight =
        goalLeft +
        goalWidth;


    const insideGoalWidth =
        ballX -
        ballRadius >
        goalLeft &&

        ballX +
        ballRadius <
        goalRight;


    if (!insideGoalWidth)
        return false;


    if (
        ballY <
        -ballRadius
    )
        return "top";


    if (
        ballY >
        gameHeight +
        ballRadius
    )
        return "bottom";


    return false;

}


/* =================================================
   تسجيل الهدف
================================================= */

function scoreGoal(side) {

    if (goalScored)
        return;


    goalScored = true;


    ballOwner =
        null;


    ballMoving = false;

    ballVX = 0;
    ballVY = 0;


    charging = false;
    power = 0;


    powerBar.style.width =
        "0%";


    if (
        side === "top"
    ) {

        topScore++;

    } else {

        bottomScore++;

    }


    updateScore();


    goalMessage.classList.add(
        "show"
    );


    ball.style.opacity =
        "0";

    aim.style.opacity =
        "0";


    clearTimeout(goalTimer);


    goalTimer =
        setTimeout(
            resetAfterGoal,
            1500
        );

}


/* =================================================
   إعادة اللعب
================================================= */

function resetAfterGoal() {

    goalScored = false;


    goalMessage.classList.remove(
        "show"
    );


    ball.style.opacity =
        "1";


    /*
       فريقنا
    */

    teamPlayers[0].x =
        gameWidth * 0.50;

    teamPlayers[0].y =
        gameHeight * 0.48;


    teamPlayers[1].x =
        gameWidth * 0.20;

    teamPlayers[1].y =
        gameHeight * 0.55;


    teamPlayers[2].x =
        gameWidth * 0.80;

    teamPlayers[2].y =
        gameHeight * 0.55;


    teamPlayers[3].x =
        gameWidth * 0.30;

    teamPlayers[3].y =
        gameHeight * 0.70;


    teamPlayers[4].x =
        gameWidth * 0.70;

    teamPlayers[4].y =
        gameHeight * 0.70;


    /*
       الخصم
    */

    opponents[0].x =
        gameWidth * 0.50;

    opponents[0].y =
        gameHeight * 0.38;


    opponents[1].x =
        gameWidth * 0.20;

    opponents[1].y =
        gameHeight * 0.44;


    opponents[2].x =
        gameWidth * 0.80;

    opponents[2].y =
        gameHeight * 0.44;


    opponents[3].x =
        gameWidth * 0.30;

    opponents[3].y =
        gameHeight * 0.30;


    opponents[4].x =
        gameWidth * 0.70;

    opponents[4].y =
        gameHeight * 0.30;


    activePlayerIndex =
        0;


    manualControlLock =
        false;

    lastManualSwitchTime =
        0;

    lastAutoSwitchTime =
        0;

    manualSwitchArmed =
        true;


    ballOwner =
        teamPlayers[0];


    ballMoving = false;

    ballVX = 0;
    ballVY = 0;


    charging = false;
    power = 0;


    powerBar.style.width =
        "0%";


    aimAngle =
        -Math.PI / 2;


    opponentKickCooldown =
        0;


    placeBallWithOwner();

    draw();

}


/* =================================================
   تحديث الكرة
================================================= */

function updateBall() {

    if (ballOwner) {

        if (
            isTeamPlayer(ballOwner)
        ) {

            if (
                ballOwner ===
                getActivePlayer()
            ) {

                placeBallWithOwner();

            }

        }


        if (
            opponents.includes(
                ballOwner
            )
        ) {

            placeBallWithOwner();

        }


        return;

    }


    if (!ballMoving)
        return;


    ballX +=
        ballVX;

    ballY +=
        ballVY;


    ballVX *=
        friction;

    ballVY *=
        friction;


    handleGoalPosts();


    const goal =
        checkGoal();


    if (goal) {

        scoreGoal(goal);

        return;

    }


    const sideRadius = 15;


    if (
        ballX >
        gameWidth -
        sideRadius
    ) {

        ballX =
            gameWidth -
            sideRadius;

        ballVX =
            -Math.abs(
                ballVX
            );

    }


    if (
        ballX <
        sideRadius
    ) {

        ballX =
            sideRadius;

        ballVX =
            Math.abs(
                ballVX
            );

    }


    const goalLeft =
        (gameWidth -
        goalWidth) / 2;

    const goalRight =
        goalLeft +
        goalWidth;


    const outsideGoal =
        ballX -
        ballRadius <=
        goalLeft ||

        ballX +
        ballRadius >=
        goalRight;


    if (
        ballY <
        ballRadius &&
        outsideGoal
    ) {

        ballY =
            ballRadius;

        ballVY =
            Math.abs(
                ballVY
            );

    }


    if (
        ballY >
        gameHeight -
        ballRadius &&
        outsideGoal
    ) {

        ballY =
            gameHeight -
            ballRadius;

        ballVY =
            -Math.abs(
                ballVY
            );

    }


    const speed =
        Math.sqrt(
            ballVX *
            ballVX +
            ballVY *
            ballVY
        );


    if (
        speed <
        0.15
    ) {

        ballVX = 0;
        ballVY = 0;

        ballMoving = false;

    }

}


/* =================================================
   تحديث اللعبة
================================================= */

function update() {

    if (!goalScored) {

        if (
            opponentKickCooldown >
            0
        ) {

            opponentKickCooldown--;

        }


        updatePlayersAI();


        autoSelectClosestPlayer();


        movePlayer(
            moveX,
            moveY
        );


        updateBall();


        tryPickupBall();

    }


    draw();


    requestAnimationFrame(
        update
    );

}


/* =================================================
   Joystick
================================================= */

function updateMoveJoystick(
    clientX,
    clientY
) {

    const rect =
        movePad.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const maxDistance = 48;


    if (
        distance >
        maxDistance
    ) {

        dx =
            (dx / distance) *
            maxDistance;

        dy =
            (dy / distance) *
            maxDistance;

    }


    if (
        distance > 6
    ) {

        moveX =
            dx /
            maxDistance;

        moveY =
            dy /
            maxDistance;

    } else {

        moveX = 0;
        moveY = 0;

    }


    tryManualPlayerSwitch();


    joystickCenter.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


movePad.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();
        e.stopPropagation();


        moveTouching = true;

        movePointerId =
            e.pointerId;


        try {

            movePad.setPointerCapture(
                e.pointerId
            );

        } catch (error) {}


        updateMoveJoystick(
            e.clientX,
            e.clientY
        );

    }
);


movePad.addEventListener(
    "pointermove",
    function(e) {

        if (!moveTouching)
            return;


        if (
            e.pointerId !==
            movePointerId
        )
            return;


        e.preventDefault();


        updateMoveJoystick(
            e.clientX,
            e.clientY
        );

    }
);


function stopMoveJoystick(e) {

    if (
        e.pointerId !==
        movePointerId
    )
        return;


    moveTouching = false;

    movePointerId = null;


    moveX = 0;
    moveY = 0;


    manualSwitchArmed =
        true;


    joystickCenter.style.transform =
        "translate(-50%, -50%)";

}


movePad.addEventListener(
    "pointerup",
    stopMoveJoystick
);


movePad.addEventListener(
    "pointercancel",
    stopMoveJoystick
);


movePad.addEventListener(
    "lostpointercapture",
    function() {

        moveTouching = false;

        movePointerId = null;

        moveX = 0;
        moveY = 0;

        manualSwitchArmed =
            true;

        joystickCenter.style.transform =
            "translate(-50%, -50%)";

    }
);


/* =================================================
   اتجاه الركلة
================================================= */

function updateKickDirection(
    clientX,
    clientY
) {

    const rect =
        kickControl.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    kickDirectionDistance =
        distance;


    if (
        distance > 3
    ) {

        aimAngle =
            Math.atan2(
                dy,
                dx
            );

    }


    const maxDotDistance =
        30;


    let dotX = dx;
    let dotY = dy;


    if (
        distance >
        maxDotDistance
    ) {

        dotX =
            (dx / distance) *
            maxDotDistance;

        dotY =
            (dy / distance) *
            maxDotDistance;

    }


    kickDot.style.left =
        `calc(50% + ${dotX}px)`;


    kickDot.style.top =
        `calc(50% + ${dotY}px)`;


    kickDot.style.opacity =
        "1";


    if (
        ballOwner ===
        getActivePlayer()
    ) {

        placeBallWithOwner();

    }


    draw();

}


/* =================================================
   الشحن
================================================= */

function checkKickCharging() {

    if (charging)
        return;


    if (
        ballOwner !==
        getActivePlayer()
    )
        return;


    if (
        kickDirectionDistance >=
        kickChargeDistance
    ) {

        startCharging();

    }

}


function startCharging() {

    if (
        ballOwner !==
        getActivePlayer()
    )
        return;


    if (charging)
        return;


    charging = true;

    power = 0;


    kickButton.style.transform =
        "scale(0.92)";


    chargePower();

}


function chargePower() {

    if (!charging)
        return;


    power +=
        powerSpeed;


    if (
        power >=
        maxPower
    ) {

        power =
            maxPower;

    }


    powerBar.style.width =
        power + "%";


    if (
        power <
        maxPower
    ) {

        requestAnimationFrame(
            chargePower
        );

    }

}


/* =================================================
   الركلة
================================================= */

function kick() {

    if (!charging)
        return;


    if (
        ballOwner !==
        getActivePlayer()
    ) {

        charging = false;

        power = 0;

        powerBar.style.width =
            "0%";

        return;

    }


    charging = false;


    ballOwner =
        null;


    if (
        power < 1
    )
        power = 1;


    const minSpeed = 3;
    const maxSpeed = 12;


    const speed =
        minSpeed +
        (power / 100) *
        (maxSpeed - minSpeed);


    ballVX =
        Math.cos(
            aimAngle
        ) *
        speed;


    ballVY =
        Math.sin(
            aimAngle
        ) *
        speed;


    ballMoving = true;


    power = 0;


    powerBar.style.width =
        "0%";


    kickButton.style.transform =
        "scale(1)";

}


/* =================================================
   بداية الركلة
================================================= */

kickControl.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();
        e.stopPropagation();


        if (
            ballOwner !==
            getActivePlayer()
        )
            return;


        kickTouching = true;

        kickPointerId =
            e.pointerId;


        try {

            kickControl.setPointerCapture(
                e.pointerId
            );

        } catch (error) {}


        charging = false;

        power = 0;

        kickDirectionDistance = 0;


        powerBar.style.width =
            "0%";


        kickButton.style.transform =
            "scale(1)";


        updateKickDirection(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   حركة الركلة
================================================= */

kickControl.addEventListener(
    "pointermove",
    function(e) {

        if (!kickTouching)
            return;


        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        e.preventDefault();


        updateKickDirection(
            e.clientX,
            e.clientY
        );


        checkKickCharging();

    }
);


/* =================================================
   رفع الإصبع
================================================= */

kickControl.addEventListener(
    "pointerup",
    function(e) {

        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        e.preventDefault();


        updateKickDirection(
            e.clientX,
            e.clientY
        );


        if (
            charging &&
            ballOwner ===
            getActivePlayer()
        ) {

            kick();

        } else {

            charging = false;

            power = 0;

            powerBar.style.width =
                "0%";

        }


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

        kickDirectionDistance = 0;

    }
);


/* =================================================
   إلغاء الركلة
================================================= */

kickControl.addEventListener(
    "pointercancel",
    function() {

        charging = false;

        power = 0;


        powerBar.style.width =
            "0%";


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

        kickDirectionDistance = 0;

    }
);

        }


        lastTouchEnd =
            now;

    },

        passive: false
    }
);
