<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="apple-mobile-web-app-capable"
content="yes">

<title>كرة القدم ⚽️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #16803c;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   الملعب
========================================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 700px;

    overflow: hidden;

    background:

        repeating-linear-gradient(
            90deg,

            rgba(255,255,255,0.035)
            0px,

            rgba(255,255,255,0.035)
            50px,

            rgba(0,0,0,0.035)
            50px,

            rgba(0,0,0,0.035)
            100px
        ),

        #16803c;

    touch-action: none;
}


/* =========================================
   خط المنتصف
========================================= */

.center-line {

    position: absolute;

    width: 100%;
    height: 2px;

    left: 0;
    top: 50%;

    background:
        rgba(255,255,255,0.55);

    pointer-events: none;
}


/* =========================================
   دائرة المنتصف
========================================= */

.center-circle {

    position: absolute;

    width: 170px;
    height: 170px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,0.55);

    border-radius: 50%;

    pointer-events: none;
}


/* =========================================
   اللاعب
========================================= */

#player {

    position: absolute;

    width: 48px;
    height: 48px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #1769ff;

    border:
        4px solid white;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.35);

    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 25px;

    touch-action: none;
}


/* =========================================
   الكرة
========================================= */

#ball {

    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: white;

    border:
        2px solid #222;

    box-shadow:
        0 3px 7px
        rgba(0,0,0,0.35);

    transform:
        translate(-50%, -50%);

    z-index: 9;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 18px;

    pointer-events: none;
}


/* =========================================
   سهم اتجاه الركلة
========================================= */

#aim {

    position: absolute;

    width: 78px;
    height: 4px;

    background: #ffd400;

    border-radius: 5px;

    transform-origin:
        left center;

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 6px
        rgba(255,215,0,0.8);
}


#aim::after {

    content: "";

    position: absolute;

    right: -2px;
    top: 50%;

    width: 0;
    height: 0;

    border-top:
        8px solid transparent;

    border-bottom:
        8px solid transparent;

    border-left:
        14px solid #ffd400;

    transform:
        translateY(-50%);
}


/* =========================================
   عداد القوة
========================================= */

#powerBox {

    position: absolute;

    top: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 190px;
    height: 18px;

    border:
        2px solid white;

    border-radius: 20px;

    background:
        rgba(0,0,0,0.35);

    overflow: hidden;

    z-index: 30;
}


#power {

    width: 0%;

    height: 100%;

    background: #ffd400;

    border-radius: 20px;
}


/* =========================================
   نص القوة
========================================= */

#powerText {

    position: absolute;

    top: 42px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 14px;

    text-shadow:
        0 2px 4px black;

    z-index: 30;

    white-space: nowrap;
}


/* =========================================
   وحدة تحكم الركلة
========================================= */

#kickControl {

    position: absolute;

    right: 22px;
    bottom: 28px;

    width: 84px;
    height: 84px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.18);

    border:
        5px solid white;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.35);

    z-index: 40;

    touch-action: none;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================================
   الجزء الأحمر الداخلي
========================================= */

#kickButton {

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #e53935;

    color: white;

    font-size: 34px;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        inset 0 0 0 2px
        rgba(255,255,255,0.15);

    pointer-events: none;

    transition:
        transform 0.08s ease;
}


/* =========================================
   مؤشر مكان الإصبع
========================================= */

#kickDot {

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px
        rgba(255,255,255,0.9);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0;
}


/* =========================================
   التعليمات
========================================= */

#info {

    position: absolute;

    bottom: 20px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 13px;

    background:
        rgba(0,0,0,0.35);

    padding:
        7px 14px;

    border-radius: 20px;

    z-index: 30;

    white-space: nowrap;
}

</style>

</head>


<body>

<div id="game">

    <div class="center-line"></div>

    <div class="center-circle"></div>


    <div id="player">
        🧍
    </div>


    <div id="ball">
        ⚽
    </div>


    <div id="aim"></div>


    <div id="powerBox">

        <div id="power"></div>

    </div>


    <div id="powerText">
        قوة الركلة
    </div>


    <!-- وحدة تحكم الركلة -->

    <div id="kickControl">

        <div id="kickButton">
            👟
        </div>

        <div id="kickDot"></div>

    </div>


    <div id="info">
        اسحب اللاعب للتحرك • استخدم إطار الركلة لتحديد الاتجاه
    </div>

</div>


<script>

/* =================================================
   العناصر
================================================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const ball =
    document.getElementById("ball");

const aim =
    document.getElementById("aim");

const kickControl =
    document.getElementById("kickControl");

const kickButton =
    document.getElementById("kickButton");

const kickDot =
    document.getElementById("kickDot");

const powerBar =
    document.getElementById("power");


/* =================================================
   حجم الملعب
================================================= */

let gameWidth =
    game.clientWidth;

let gameHeight =
    game.clientHeight;


/* =================================================
   اللاعب
================================================= */

let playerX =
    gameWidth / 2;

let playerY =
    gameHeight / 2;


/* =================================================
   الكرة
================================================= */

let ballX =
    playerX;

let ballY =
    playerY - 42;


/* =================================================
   اتجاه الركلة
================================================= */

let aimAngle =
    -Math.PI / 2;


/* =================================================
   سرعة اللاعب
================================================= */

const playerSpeed = 4.5;


/* =================================================
   حركة الكرة
================================================= */

let ballVX = 0;

let ballVY = 0;

let ballMoving = false;


/* =================================================
   احتكاك الكرة
================================================= */

const friction = 0.985;


/* =================================================
   قوة الركلة
================================================= */

let charging = false;

let power = 0;

const maxPower = 100;

const powerSpeed = 1.4;


/* =================================================
   لمس اللاعب
================================================= */

let playerTouching = false;

let playerPointerId = null;

let lastPlayerTouchX = 0;

let lastPlayerTouchY = 0;


/* =================================================
   وحدة تحكم الركلة
================================================= */

let kickPointerId = null;

let kickTouching = false;


/* =================================================
   مركز وحدة الركل
================================================= */

const controlRadius = 42;


/* =================================================
   لوحة المفاتيح
================================================= */

let keys = {

    up: false,
    down: false,
    left: false,
    right: false

};


/* =================================================
   وضع الكرة أمام اللاعب
================================================= */

function placeBallWithPlayer() {

    if (ballMoving)
        return;


    const distance = 42;


    ballX =
        playerX +
        Math.cos(aimAngle) *
        distance;


    ballY =
        playerY +
        Math.sin(aimAngle) *
        distance;
}


/* =================================================
   الرسم
================================================= */

function draw() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";


    ball.style.left =
        ballX + "px";

    ball.style.top =
        ballY + "px";


    aim.style.left =
        ballX + "px";

    aim.style.top =
        ballY + "px";


    aim.style.transform =
        `rotate(${aimAngle}rad)`;


    if (ballMoving) {

        aim.style.opacity =
            "0.25";

    } else {

        aim.style.opacity =
            "1";

    }

}


/* =================================================
   حركة اللاعب
================================================= */

function movePlayer(dx, dy) {

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length === 0)
        return;


    dx /= length;

    dy /= length;


    playerX +=
        dx * playerSpeed;

    playerY +=
        dy * playerSpeed;


    const radius = 24;


    playerX =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                playerX
            )
        );


    playerY =
        Math.max(
            radius,
            Math.min(
                gameHeight - radius,
                playerY
            )
        );


    if (!ballMoving) {

        placeBallWithPlayer();

    }

}


/* =================================================
   تحديث اللعبة
================================================= */

function update() {


    let dx = 0;

    let dy = 0;


    if (keys.left)
        dx -= 1;

    if (keys.right)
        dx += 1;

    if (keys.up)
        dy -= 1;

    if (keys.down)
        dy += 1;


    movePlayer(dx, dy);


    /* ---------------------------------------------
       حركة الكرة
    --------------------------------------------- */

    if (ballMoving) {

        ballX += ballVX;

        ballY += ballVY;


        ballVX *= friction;

        ballVY *= friction;


        const ballRadius = 15;


        /* اليمين */

        if (
            ballX >
            gameWidth - ballRadius
        ) {

            ballX =
                gameWidth -
                ballRadius;

            ballVX =
                -Math.abs(ballVX);

        }


        /* اليسار */

        if (
            ballX <
            ballRadius
        ) {

            ballX =
                ballRadius;

            ballVX =
                Math.abs(ballVX);

        }


        /* الأعلى */

        if (
            ballY <
            ballRadius
        ) {

            ballY =
                ballRadius;

            ballVY =
                Math.abs(ballVY);

        }


        /* الأسفل */

        if (
            ballY >
            gameHeight - ballRadius
        ) {

            ballY =
                gameHeight -
                ballRadius;

            ballVY =
                -Math.abs(ballVY);

        }


        /* -----------------------------------------
           إيقاف الكرة
        ----------------------------------------- */

        const speed =
            Math.sqrt(
                ballVX * ballVX +
                ballVY * ballVY
            );


        if (speed < 0.15) {

            ballVX = 0;

            ballVY = 0;

            ballMoving = false;

            placeBallWithPlayer();

        }

    }


    draw();


    requestAnimationFrame(update);

}


/* =================================================
   حركة اللاعب باللمس
================================================= */

player.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (ballMoving)
            return;


        playerTouching = true;

        playerPointerId =
            e.pointerId;


        lastPlayerTouchX =
            e.clientX;

        lastPlayerTouchY =
            e.clientY;


        player.setPointerCapture(
            e.pointerId
        );

    }
);


player.addEventListener(
    "pointermove",
    function(e) {

        if (!playerTouching)
            return;


        if (
            e.pointerId !==
            playerPointerId
        )
            return;


        const dx =
            e.clientX -
            lastPlayerTouchX;


        const dy =
            e.clientY -
            lastPlayerTouchY;


        playerX += dx;

        playerY += dy;


        const radius = 24;


        playerX =
            Math.max(
                radius,
                Math.min(
                    gameWidth - radius,
                    playerX
                )
            );


        playerY =
            Math.max(
                radius,
                Math.min(
                    gameHeight - radius,
                    playerY
                )
            );


        lastPlayerTouchX =
            e.clientX;

        lastPlayerTouchY =
            e.clientY;


        if (!ballMoving) {

            placeBallWithPlayer();

        }


        draw();

    }
);


function stopPlayerTouch(e) {

    if (
        e.pointerId !==
        playerPointerId
    )
        return;


    playerTouching = false;

    playerPointerId = null;

}


player.addEventListener(
    "pointerup",
    stopPlayerTouch
);


player.addEventListener(
    "pointercancel",
    stopPlayerTouch
);


/* =================================================
   تحديد الاتجاه من وحدة الركلة
================================================= */

function updateKickDirection(
    clientX,
    clientY
) {

    const rect =
        kickControl.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX - centerX;


    let dy =
        clientY - centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       الاتجاه الجديد
    */

    if (distance > 5) {

        aimAngle =
            Math.atan2(
                dy,
                dx
            );

    }


    /*
       نحرك النقطة البيضاء
       داخل إطار التحكم
    */

    const maxDotDistance = 30;


    let dotX = dx;

    let dotY = dy;


    if (
        distance >
        maxDotDistance
    ) {

        dotX =
            (dx / distance) *
            maxDotDistance;

        dotY =
            (dy / distance) *
            maxDotDistance;

    }


    kickDot.style.left =
        `calc(50% + ${dotX}px)`;

    kickDot.style.top =
        `calc(50% + ${dotY}px)`;


    kickDot.style.opacity = "1";


    /*
       إذا أصبح الإصبع قريبًا
       من المركز
    */

    if (
        distance < 20
    ) {

        kickDot.style.opacity =
            "0";

    }


    /*
       الكرة تتبع اتجاه السهم
    */

    if (!ballMoving) {

        placeBallWithPlayer();

    }


    draw();

}


/* =================================================
   الضغط على وحدة الركلة
================================================= */

kickControl.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (ballMoving)
            return;


        kickTouching = true;

        kickPointerId =
            e.pointerId;


        kickControl.setPointerCapture(
            e.pointerId
        );


        updateKickDirection(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   تحريك الإصبع داخل وحدة الركلة
================================================= */

kickControl.addEventListener(
    "pointermove",
    function(e) {

        if (!kickTouching)
            return;


        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        updateKickDirection(
            e.clientX,
            e.clientY
        );


        /*
           نحسب المسافة من المركز
        */

        const rect =
            kickControl.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const dx =
            e.clientX -
            centerX;


        const dy =
            e.clientY -
            centerY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           عندما يدخل الإصبع
           إلى المركز تبدأ الشحن
        */

        if (
            distance < 20 &&
            !charging
        ) {

            startCharging();

        }


        /*
           إذا خرج الإصبع من المركز
           نتوقف عن الشحن
           لكن لا نركل بعد
        */

        if (
            distance >= 20 &&
            charging
        ) {

            charging = false;

        }

    }
);


/* =================================================
   بدء شحن الركلة
================================================= */

function startCharging() {

    if (ballMoving)
        return;


    charging = true;

    power = 0;


    kickButton.style.transform =
        "scale(0.92)";


    chargePower();

}


/* =================================================
   شحن القوة
================================================= */

function chargePower() {

    if (!charging)
        return;


    power += powerSpeed;


    if (
        power >
        maxPower
    ) {

        power =
            maxPower;

    }


    powerBar.style.width =
        power + "%";


    requestAnimationFrame(
        chargePower
    );

}


/* =================================================
   رفع الإصبع
================================================= */

kickControl.addEventListener(
    "pointerup",
    function(e) {

        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        /*
           هل الإصبع في المركز؟
        */

        const rect =
            kickControl.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const dx =
            e.clientX -
            centerX;


        const dy =
            e.clientY -
            centerY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
           الركلة فقط إذا
           انتهى اللمس في المركز
        */

        if (
            charging &&
            distance < 20
        ) {

            kick();

        } else {

            charging = false;

            power = 0;

            powerBar.style.width =
                "0%";

        }


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

    }
);


kickControl.addEventListener(
    "pointercancel",
    function() {

        charging = false;

        power = 0;

        powerBar.style.width =
            "0%";


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

    }
);


/* =================================================
   تنفيذ الركلة
================================================= */

function kick() {

    if (!charging)
        return;


    charging = false;


    if (power < 5)
        power = 5;


    const minSpeed = 5;

    const maxSpeed = 18;


    const speed =
        minSpeed +
        (power / 100) *
        (maxSpeed - minSpeed);


    ballVX =
        Math.cos(aimAngle) *
        speed;


    ballVY =
        Math.sin(aimAngle) *
        speed;


    ballMoving = true;


    power = 0;


    powerBar.style.width =
        "0%";


    kickButton.style.transform =
        "scale(1)";

}


/* =================================================
   لوحة المفاتيح
================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.key === "ArrowUp"
        )
            keys.up = true;


        if (
            e.key === "ArrowDown"
        )
            keys.down = true;


        if (
            e.key === "ArrowLeft"
        )
            keys.left = true;


        if (
            e.key === "ArrowRight"
        )
            keys.right = true;

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (
            e.key === "ArrowUp"
        )
            keys.up = false;


        if (
            e.key === "ArrowDown"
        )
            keys.down = false;


        if (
            e.key === "ArrowLeft"
        )
            keys.left = false;


        if (
            e.key === "ArrowRight"
        )
            keys.right = false;

    }
);


/* =================================================
   تغيير حجم الشاشة
================================================= */

window.addEventListener(
    "resize",
    function() {

        gameWidth =
            game.clientWidth;

        gameHeight =
            game.clientHeight;


        playerX =
            Math.max(
                24,
                Math.min(
                    gameWidth - 24,
                    playerX
                )
            );


        playerY =
            Math.max(
                24,
                Math.min(
                    gameHeight - 24,
                    playerY
                )
            );


        if (!ballMoving) {

            placeBallWithPlayer();

        }

    }
);


/* =================================================
   البداية
================================================= */

placeBallWithPlayer();

draw();

update();

</script>

</body>

</html>
