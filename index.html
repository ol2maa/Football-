<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="format-detection"
content="telephone=no">

<title>كرة القدم ⚽️ v4.0</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#16803c;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:none;
    overscroll-behavior:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    max-width:700px;
    overflow:hidden;

    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.035) 0,
        rgba(255,255,255,.035) 50px,
        rgba(0,0,0,.035) 50px,
        rgba(0,0,0,.035) 100px
    ),
    #16803c;

    touch-action:none;
    overscroll-behavior:none;
}


/* =================================================
   خط المنتصف
================================================= */

.center-line{
    position:absolute;
    width:100%;
    height:2px;
    left:0;
    top:50%;
    background:rgba(255,255,255,.55);
    pointer-events:none;
    z-index:2;
}

.center-circle{
    position:absolute;
    width:170px;
    height:170px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.55);
    border-radius:50%;
    pointer-events:none;
    z-index:2;
}


/* =================================================
   الأهداف
================================================= */

.goal{
    position:absolute;
    left:50%;
    width:190px;
    height:48px;
    transform:translateX(-50%);
    z-index:5;
    pointer-events:none;
}

#topGoal{
    top:0;
}

#bottomGoal{
    top:calc(100% - 48px);
}


.goalNet{
    position:absolute;
    left:50%;
    width:190px;
    height:48px;
    transform:translateX(-50%);

    border-left:2px solid rgba(255,255,255,.65);
    border-right:2px solid rgba(255,255,255,.65);

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.08) 0,
        rgba(255,255,255,.08) 2px,
        transparent 2px,
        transparent 8px
    );

    opacity:.8;
}


.goalPost{
    position:absolute;
    width:12px;
    height:58px;
    background:#fff;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
}

.goalPost.left{
    left:0;
    top:0;
}

.goalPost.right{
    right:0;
    top:0;
}

.goalCrossbar{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:12px;
    background:#fff;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
}

#bottomGoal .goalPost{
    top:auto;
    bottom:0;
}

#bottomGoal .goalCrossbar{
    top:auto;
    bottom:0;
}


/* =================================================
   النتيجة والوقت
================================================= */

#matchInfo{
    position:absolute;
    top:82px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:8px;
    z-index:60;
}

#score{
    color:#fff;
    font-size:24px;
    font-weight:bold;
    background:rgba(0,0,0,.35);
    padding:5px 18px;
    border-radius:20px;
    text-shadow:0 2px 4px #000;
    white-space:nowrap;
}

#matchTime{
    color:#fff;
    font-size:22px;
    font-weight:900;
    background:rgba(0,0,0,.40);
    padding:5px 12px;
    border-radius:20px;
    text-shadow:0 2px 4px #000;
    min-width:76px;
    text-align:center;
    font-variant-numeric:tabular-nums;
}

#matchTime.warning{
    background:rgba(180,0,0,.75);
    animation:timeWarning .6s infinite alternate;
}

@keyframes timeWarning{
    from{ transform:scale(1); }
    to{ transform:scale(1.08); }
}


/* =================================================
   رسالة الهدف
================================================= */

#goalMessage{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.7);
    color:#fff;
    font-size:42px;
    font-weight:900;
    text-shadow:0 4px 10px rgba(0,0,0,.8);
    background:rgba(0,0,0,.45);
    padding:15px 28px;
    border-radius:25px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s;
}

#goalMessage.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}


/* =================================================
   نهاية المباراة
================================================= */

#matchEnd{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.8);
    width:300px;
    max-width:88%;
    padding:24px 18px;
    background:rgba(0,0,0,.82);
    border:3px solid rgba(255,255,255,.8);
    border-radius:25px;
    color:#fff;
    text-align:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s,transform .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
}

#matchEnd.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    pointer-events:auto;
}

#matchEndTitle{
    font-size:30px;
    font-weight:900;
    margin-bottom:10px;
}

#matchEndScore{
    font-size:38px;
    font-weight:900;
    margin-bottom:18px;
}

#newMatchButton{
    border:0;
    outline:0;
    background:#1769ff;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    padding:12px 24px;
    border-radius:16px;
    box-shadow:0 4px 10px rgba(0,0,0,.35);
}

#newMatchButton:active{
    transform:scale(.94);
}


/* =================================================
   اللاعبون
================================================= */

.playerUnit{
    position:absolute;
    width:38px;
    height:38px;
    left:0;
    top:0;

    border-radius:50%;
    border:4px solid #fff;

    box-shadow:
        0 4px 10px rgba(0,0,0,.35);

    z-index:20;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;

    will-change:transform;
    pointer-events:none;
}

.playerUnit.blue{
    background:#1769ff;
}

.playerUnit.red{
    background:#e53935;
}

.playerUnit.controlled{
    box-shadow:
        0 0 0 3px rgba(255,215,0,.55),
        0 4px 10px rgba(0,0,0,.35);
}

.controlArrow{
    position:absolute;
    left:50%;
    top:-20px;
    transform:translateX(-50%);
    color:#ffd400;
    font-size:15px;
    font-weight:900;
    line-height:1;
    text-shadow:0 2px 3px #000;
    pointer-events:none;
}
/* =================================================
   الكرة
================================================= */

#ball{
    position:absolute;
    width:22px;
    height:22px;
    left:0;
    top:0;

    border-radius:50%;
    background:#fff;
    border:2px solid #222;

    box-shadow:
        0 3px 7px rgba(0,0,0,.35);

    z-index:25;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:14px;

    will-change:transform;
    pointer-events:none;
}


/* =================================================
   سهم التسديد
================================================= */

#aim{
    position:absolute;
    width:78px;
    height:4px;
    left:0;
    top:0;

    background:#ffd400;
    border-radius:5px;

    z-index:24;
    pointer-events:none;

    box-shadow:
        0 0 6px rgba(255,215,0,.8);

    display:none;

    transform-origin:0 50%;
}

#aim::after{
    content:"";
    position:absolute;
    right:-2px;
    top:50%;

    width:0;
    height:0;

    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:14px solid #ffd400;

    transform:translateY(-50%);
}


/* =================================================
   قوة الركلة
================================================= */

#powerBox{
    position:absolute;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    width:190px;
    height:18px;

    border:2px solid #fff;
    border-radius:20px;

    background:rgba(0,0,0,.35);

    overflow:hidden;

    z-index:70;
}

#power{
    width:0;
    height:100%;

    background:#ffd400;
    border-radius:20px;

    transition:width .05s linear;
}

#powerText{
    position:absolute;
    top:42px;
    left:50%;
    transform:translateX(-50%);

    color:#fff;
    font-size:14px;

    text-shadow:0 2px 4px #000;

    z-index:70;
    white-space:nowrap;
}


/* =================================================
   Joystick
================================================= */

#movePad{
    position:absolute;

    left:22px;
    bottom:28px;

    width:150px;
    height:150px;

    border-radius:50%;

    background:rgba(0,0,0,.12);

    border:3px solid rgba(255,255,255,.35);

    box-shadow:
        0 5px 12px rgba(0,0,0,.25);

    z-index:80;

    touch-action:none;
}

#joystickCenter{
    position:absolute;

    left:50%;
    top:50%;

    width:54px;
    height:54px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:rgba(0,0,0,.30);

    border:3px solid #fff;

    box-shadow:
        0 4px 8px rgba(0,0,0,.35);

    pointer-events:none;
}


.moveArrow{
    position:absolute;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    opacity:.85;
    pointer-events:none;
    text-shadow:0 2px 4px #000;
}

#arrowUp{
    left:50%;
    top:10px;
    transform:translateX(-50%);
}

#arrowDown{
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
}

#arrowLeft{
    left:10px;
    top:50%;
    transform:translateY(-50%);
}

#arrowRight{
    right:10px;
    top:50%;
    transform:translateY(-50%);
}


/* =================================================
   الركل
================================================= */

#kickControl{
    position:absolute;

    right:22px;
    bottom:28px;

    width:84px;
    height:84px;

    border-radius:50%;

    background:rgba(255,255,255,.18);

    border:5px solid #fff;

    box-shadow:
        0 5px 12px rgba(0,0,0,.35);

    z-index:80;

    touch-action:none;

    display:flex;
    justify-content:center;
    align-items:center;
}

#kickButton{
    width:68px;
    height:68px;

    border-radius:50%;

    background:#e53935;

    color:#fff;

    font-size:34px;

    display:flex;
    justify-content:center;
    align-items:center;

    pointer-events:none;
}

#kickDot{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 7px rgba(255,255,255,.9);

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    opacity:0;
}


/* =================================================
   المعلومات
================================================= */

#info{
    position:absolute;

    top:125px;
    left:50%;

    transform:translateX(-50%);

    color:#fff;

    font-size:12px;

    background:rgba(0,0,0,.35);

    padding:6px 12px;

    border-radius:20px;

    z-index:65;

    white-space:nowrap;

    pointer-events:none;
}

</style>

</head>


<body>

<script>

"use strict";
/* =================================================
   عناصر الواجهة
================================================= */

const game = document.getElementById("game");

const ballElement = document.getElementById("ball");

const aimArrow = document.getElementById("aim");

const powerBox = document.getElementById("powerBox");

const powerElement = document.getElementById("power");

const powerText = document.getElementById("powerText");

const movePad = document.getElementById("movePad");

const joystickCenter = document.getElementById("joystickCenter");

const kickControl = document.getElementById("kickControl");

const kickButton = document.getElementById("kickButton");

const kickDot = document.getElementById("kickDot");

const scoreElement = document.getElementById("score");

const matchTimeElement = document.getElementById("matchTime");

const matchEndElement = document.getElementById("matchEnd");

const matchEndScoreElement = document.getElementById("matchEndScore");

const newMatchButton = document.getElementById("newMatchButton");

const goalMessage = document.getElementById("goalMessage");

const centerLine = document.querySelector(".center-line");

const centerCircle = document.querySelector(".center-circle");

const topGoal = document.getElementById("topGoal");

const bottomGoal = document.getElementById("bottomGoal");


/* =================================================
   أبعاد الشاشة والعالم
================================================= */

let viewWidth = game.clientWidth;

let viewHeight = game.clientHeight;

let worldWidth = viewWidth;

let worldHeight = viewHeight * 2;


/* =================================================
   الكاميرا
================================================= */

let cameraX = 0;

let cameraY = 0;

const CAMERA_SMOOTH = 0.12;


/* =================================================
   الثوابت
================================================= */

const MATCH_DURATION = 180;

const PLAYER_RADIUS = 19;

const BALL_RADIUS = 11;

const FRICTION = 0.985;

const MAX_POWER = 100;

const POWER_SPEED = 90;

const GOAL_WIDTH = 190;


/* =================================================
   حالة المباراة
================================================= */

let matchTimeRemaining = MATCH_DURATION;

let matchRunning = true;

let matchEnded = false;

let lastFrameTime = performance.now();

let matchLastTimestamp = performance.now();


let blueScore = 0;

let redScore = 0;


/* =================================================
   الكرة
================================================= */

let ballX = worldWidth / 2;

let ballY = worldHeight * 0.28;

let ballVX = 0;

let ballVY = 0;

let ballOwner = null;


/* =================================================
   التحكم
================================================= */

let activePlayerIndex = 0;


/* =================================================
   Joystick
================================================= */

let joystickX = 0;

let joystickY = 0;

let joystickActive = false;

let joystickPointerId = null;

const JOYSTICK_MAX_DISTANCE = 48;


/* =================================================
   التسديد (جديد)
================================================= */

let aiming = false;

let chargePower = 0;

let aimX = worldWidth / 2;

let aimY = 0;

let aimPointerId = null;

let chargingActive = false;

let aimAngle = -Math.PI / 2;


/* =================================================
   الفريق الأزرق (أنت)
================================================= */

const teamPlayers = [

    {
        id: "player",
        role: "forward",
        team: "blue",

        x: worldWidth / 2,
        y: worldHeight * 0.28,

        anchorX: worldWidth / 2,
        anchorY: worldHeight * 0.28,

        speed: 130,

        el: document.getElementById("player"),

        moveX: 0,
        moveY: 0,
        direction: 0,
        controlled: true
    },

    {
        id: "teammate1",
        role: "wing",
        team: "blue",

        x: worldWidth * 0.12,
        y: worldHeight * 0.36,

        anchorX: worldWidth * 0.12,
        anchorY: worldHeight * 0.36,

        speed: 95,

        el: document.getElementById("teammate1"),

        el: document.getElementById("teammate2"),

    },

    {

        anchorX: worldWidth / 2,
        anchorY: worldHeight * 0.78,

        speed: 90,

        el: document.getElementById("teammate3"),

    },

    {

    }

];


/* =================================================
   الفريق الأحمر (الخصم)
================================================= */

const opponents = [

    {

        role: "forward",
        team: "red",

        anchorX: worldWidth / 2,

    },

        el: document.getElementById("opponent2"),

    }

/* =================================================
   أدوات
================================================= */

function clamp(value, min, max){

    return Math.max(min, Math.min(max, value));

}


function distance(a, b){

    return Math.hypot(a.x - b.x, a.y - b.y);

}


/* =================================================
   حدود حركة اللاعبين (محدّثة)
================================================= */

function getRoleBounds(p){

    /*
       اللاعب المتحكم فيه → كامل الملعب
    */

    if(
        p.team === "blue" &&
        p === teamPlayers[activePlayerIndex]
    ){

        return {
            minX: PLAYER_RADIUS,
            maxX: worldWidth - PLAYER_RADIUS,
            minY: PLAYER_RADIUS,
            maxY: worldHeight - PLAYER_RADIUS
        };

    }


    /* ============ الفريق الأزرق ============ */

    if(p.team === "blue"){

        if(p.role === "guard"){

            return {
                minX: worldWidth * 0.25,
                maxX: worldWidth * 0.75,
                minY: worldHeight * 0.80,
                maxY: worldHeight - PLAYER_RADIUS
            };

        }


        if(p.role === "defender"){

            return {
                minX: PLAYER_RADIUS,
                maxX: worldWidth - PLAYER_RADIUS,
                minY: worldHeight * 0.60,
                maxY: worldHeight * 0.90
            };

        }


        if(p.role === "wing"){

            return {
                minX: PLAYER_RADIUS,
                maxX: worldWidth - PLAYER_RADIUS,
                minY: worldHeight * 0.15,
                maxY: worldHeight * 0.55
            };

        }


        if(p.role === "forward"){

            return {
                minX: PLAYER_RADIUS,
                maxX: worldWidth - PLAYER_RADIUS,
                minY: PLAYER_RADIUS,
                maxY: worldHeight * 0.45
            };

        }

    }


    /* ============ الفريق الأحمر ============ */

    if(p.team === "red"){

        if(p.role === "guard"){

            return {
                minX: worldWidth * 0.25,
                maxX: worldWidth * 0.75,
                minY: PLAYER_RADIUS,
                maxY: worldHeight * 0.20
            };

        }


        if(p.role === "defender"){

            return {
                minX: PLAYER_RADIUS,
                maxX: worldWidth - PLAYER_RADIUS,
                minY: worldHeight * 0.10,
                maxY: worldHeight * 0.40
            };

        }


        if(p.role === "wing"){

            return {
                minX: PLAYER_RADIUS,
                maxX: worldWidth - PLAYER_RADIUS,
                minY: worldHeight * 0.45,
                maxY: worldHeight * 0.85
            };

        }


        if(p.role === "forward"){

            return {
                minX: PLAYER_RADIUS,
                maxX: worldWidth - PLAYER_RADIUS,
                minY: worldHeight * 0.55,
                maxY: worldHeight - PLAYER_RADIUS
            };

        }

    }


    return {
        minX: PLAYER_RADIUS,
        maxX: worldWidth - PLAYER_RADIUS,
        minY: PLAYER_RADIUS,
        maxY: worldHeight - PLAYER_RADIUS
    };

}


/* =================================================
   تحريك لاعب
================================================= */

function movePlayer(p, dx, dy, dt){

    const length = Math.hypot(dx, dy);


    if(length > 1){

        dx /= length;
        dy /= length;

    }


    p.x += dx * p.speed * dt;

    p.y += dy * p.speed * dt;


    const bounds = getRoleBounds(p);


    p.x = clamp(p.x, bounds.minX, bounds.maxX);

    p.y = clamp(p.y, bounds.minY, bounds.maxY);


    if(
        Math.abs(dx) > 0.01 ||
        Math.abs(dy) > 0.01
    ){

        p.direction = Math.atan2(dy, dx);

    }

}

function updateCamera(){

    const targetY = ballY - viewHeight / 2;

    const maxY = Math.max(0, worldHeight - viewHeight);


    const desiredX = clamp(targetX, 0, maxX);

    const desiredY = clamp(targetY, 0, maxY);


    cameraX += (desiredX - cameraX) * CAMERA_SMOOTH;

    cameraY += (desiredY - cameraY) * CAMERA_SMOOTH;

}

/* =================================================
   تحديد الهدف الذكي للاعب أزرق (بدون كرة)
================================================= */

function getBlueAITarget(p){

    const distToBall = Math.hypot(ballX - p.x, ballY - p.y);


    /*
       إذا كان اللاعب قريب من الكرة (أقل من 80px)
       → يتجه للكرة مباشرة (ضغط).
    */

    if(distToBall < 80){

        return { x: ballX, y: ballY };

    }


    /*
       إذا كانت الكرة مع الخصم (أحمر)
       → اللاعب يدافع.
    */

    const redHasBall = ballOwner && ballOwner.team === "red";


    if(redHasBall){

        /* الحارس يبقى في مكانه أمام المرمى */

        if(p.role === "guard"){

            return {
                x: clamp(ballX, worldWidth * 0.35, worldWidth * 0.65),
                y: worldHeight * 0.94
            };

        }


        /* المدافع يضغط على الكرة لو قريبة */

        if(p.role === "defender"){

            if(distToBall < 280){

                return { x: ballX, y: ballY };

            }


            return {
                x: worldWidth / 2,
                y: worldHeight * 0.78
            };

        }


        /* الجناح يرجع للدفاع لو الكرة في نص ملعبنا */

        if(p.role === "wing"){

            if(ballY > worldHeight * 0.45){

                return {
                    x: p.anchorX,
                    y: worldHeight * 0.55
                };

            }


            return { x: p.anchorX, y: p.anchorY };

        }


        /* المهاجم يضغط على صاحب الكرة لو قريب */

        if(p.role === "forward"){

            if(distToBall < 220){

                return { x: ballX, y: ballY };

            }


            return {
                x: worldWidth / 2,
                y: worldHeight * 0.30
            };

        }

    }


    /*
       إذا كانت الكرة مع فريقنا (الأزرق)
       أو حرة في الملعب.
    */

    /* الحارس يبقى أمام المرمى */

    if(p.role === "guard"){

        return {
            x: clamp(ballX, worldWidth * 0.35, worldWidth * 0.65),
            y: worldHeight * 0.94
        };

    }


    /* المدافع: يرجع لموقعه الدفاعي */

    if(p.role === "defender"){

        return {
            x: worldWidth / 2,
            y: worldHeight * 0.78
        };

    }


    /* الجناح: يفتح على الطرف + يتقدم لفوق */

    if(p.role === "wing"){

        return {
            x: p.anchorX,
            y: worldHeight * 0.35
        };

    }


    /* المهاجم: يفتح في وسط ملعب الخصم */

    if(p.role === "forward"){

        return {
            x: worldWidth / 2,
            y: worldHeight * 0.20
        };

    }


    return { x: p.anchorX, y: p.anchorY };

}


/* =================================================

function updateBlueAI(dt){

/* =================================================
   AI صاحب الكرة (أزرق أو أحمر)
================================================= */

function updateBallAI(dt){

    if(!ballOwner)
        return;


    const p = ballOwner;


    /*
       لو صاحب الكرة هو اللاعب المتحكم فيه → تجاهل
    */

    if(
        p === teamPlayers[activePlayerIndex] &&
        p.team === "blue"
    ){

        return;

    }


    /*
       ===== تحديد اتجاه الهجوم =====
       الأزرق يهجم لفوق (y = 0)
       الأحمر يهجم لتحت (y = worldHeight)
    */

    const goalX = worldWidth / 2;

    const goalY =
        p.team === "blue"
        ? 0
        : worldHeight;


    const distToGoal = Math.hypot(
        goalX - p.x,
        goalY - p.y
    );


    /*
       ===== قرار التسديد =====
       لو قريب من المرمى (أقل من 280px)
       → يسدد (نسبة عالية)
    */

    if(distToGoal < 280){

        if(
            p.team === "red" &&
            Math.random() < 0.06
        ){

            aiShoot(p);
            return;

        }


        if(
            p.team === "blue" &&
            Math.random() < 0.04
        ){

            aiShoot(p);
            return;

        }

    }


    /*
       ===== قرار التمرير =====
       لو فيه خصم قريب منه (أقل من 65px)
       → يمرر بسرعة (نسبة عالية)
    */

    const nearOpponent = findNearOpponent(p, 65);


    if(nearOpponent){

        if(
            p.team === "red" &&
            Math.random() < 0.10
        ){

            aiPass(p);
            return;

        }


        if(
            p.team === "blue" &&
            Math.random() < 0.06
        ){

            aiPass(p);
            return;

        }

    }


    /*
       ===== تمرير عشوائي كل فترة =====
    */

    if(
        p.team === "red" &&
        Math.random() < 0.015
    ){

        aiPass(p);
        return;

    }


    if(
        p.team === "blue" &&
        Math.random() < 0.008
    ){

        aiPass(p);
        return;

    }


    /*
       ===== الحركة الافتراضية: ناحية المرمى =====
    */

    let dx = goalX - p.x;
    let dy = goalY - p.y;


    const d = Math.hypot(dx, dy);


    if(d < 1)
        return;


    dx /= d;
    dy /= d;


    movePlayer(p, dx, dy, dt);

}


/* =================================================
   إيجاد أقرب خصم للاعب
================================================= */

function findNearOpponent(p, maxDist){

    const enemies =
        p.team === "blue"
        ? opponents
        : teamPlayers;


    let closest = null;

    let closestDist = maxDist;


    for(const e of enemies){

        const d = Math.hypot(e.x - p.x, e.y - p.y);


        if(d < closestDist){

            closestDist = d;
            closest = e;

        }

    }


    return closest;

}


/* =================================================
   تسديد AI
================================================= */

function aiShoot(p){

    if(!p || ballOwner !== p)
        return;


    const goalY =
        p.team === "blue"
        ? -50
        : worldHeight + 50;


    const targetX = worldWidth / 2;
    const targetY = goalY;


    let dx = targetX - p.x;
    let dy = targetY - p.y;


    const d = Math.hypot(dx, dy);


    if(d < 1)
        return;


    dx /= d;
    dy /= d;


    const distToGoal =
        p.team === "blue"
        ? p.y
        : worldHeight - p.y;


    const powerFactor = Math.max(
        0.5,
        1 - distToGoal / (worldHeight * 0.8)
    );


    const speed = 600 + powerFactor * 400;


    ballOwner = null;


    ballX = p.x + dx * 30;
    ballY = p.y + dy * 30;

    ballVX = dx * speed;
    ballVY = dy * speed;

}


/* =================================================
   تمرير AI
================================================= */

function aiPass(p){

    if(!p || ballOwner !== p)
        return;


    const mates =
        p.team === "blue"
        ? teamPlayers
        : opponents;


    const attackDir =
        p.team === "blue" ? -1 : 1;


    let best = null;

    let bestScore = -Infinity;


    for(const mate of mates){

        if(mate === p)
            continue;


        const d = Math.hypot(mate.x - p.x, mate.y - p.y);


        if(d < 80 || d > 350)
            continue;


        const progress =
            attackDir === -1
            ? -mate.y
            : mate.y;


        const nearEnemy = findNearOpponent(mate, 60);

        const enemyPenalty = nearEnemy ? 200 : 0;


        const score = progress - d * 0.3 - enemyPenalty;


        if(score > bestScore){

            bestScore = score;
            best = mate;

        }

    }


    /*
       لو مفيش زميل مناسب → يمرر للأمام مباشرة
    */

    if(!best){

        const dx = 0;
        const dy = attackDir;

        ballOwner = null;

        ballX = p.x + dx * 30;
        ballY = p.y + dy * 30;

        ballVX = dx * 400;
        ballVY = dy * 400;

        return;

    }


    let dx = best.x - p.x;
    let dy = best.y - p.y;


    const d = Math.hypot(dx, dy);


    if(d < 1)
        return;


    dx /= d;
    dy /= d;


    const speed = Math.min(800, 350 + d * 1.5);


    ballOwner = null;


    ballX = p.x + dx * 30;
    ballY = p.y + dy * 30;

    ballVX = dx * speed;
    ballVY = dy * speed;

}


/* =================================================
   أقرب لاعب أزرق
================================================= */

function closestBluePlayer(){

    let best = null;

    let bestDist = Infinity;


    for(const p of teamPlayers){

        const d = Math.hypot(p.x - ballX, p.y - ballY);


        if(d < bestDist){

            bestDist = d;
            best = p;

        }

    }


    return best;

}


/* =================================================
   أقرب لاعب أحمر
================================================= */

function closestRedPlayer(){

    let best = null;

    let bestDist = Infinity;


    for(const p of opponents){

        const d = Math.hypot(p.x - ballX, p.y - ballY);


        if(d < bestDist){

            bestDist = d;
            best = p;

        }

    }


    return best;

}


/* =================================================
   الاستحواذ على الكرة الحرة
================================================= */

function tryBallPickup(){

    if(ballOwner)
        return;


    const blue = closestBluePlayer();

    const red = closestRedPlayer();


    const blueDist = blue
        ? Math.hypot(blue.x - ballX, blue.y - ballY)
        : Infinity;


    const redDist = red
        ? Math.hypot(red.x - ballX, red.y - ballY)
        : Infinity;


    const PICKUP_RADIUS = 26;


    if(
        blue &&
        blueDist <= PICKUP_RADIUS &&
        blueDist <= redDist
    ){

        ballOwner = blue;

        ballVX = 0;
        ballVY = 0;

        return;

    }


    if(
        red &&
        redDist <= PICKUP_RADIUS &&
        redDist <= blueDist
    ){

        ballOwner = red;

        ballVX = 0;
        ballVY = 0;

        return;

    }

}


/* =================================================
   الافتكاك (Tackle)
================================================= */

function tackle(){

    if(!ballOwner)
        return;


    if(ballOwner.team === "blue"){

        const red = findNearOpponent(ballOwner, 45);


        if(!red)
            return;


        const d = Math.hypot(
            red.x - ballOwner.x,
            red.y - ballOwner.y
        );


        const chance = 0.05 * (1 - d / 45);


        if(Math.random() < chance){

            ballOwner = red;

            ballVX = 0;
            ballVY = 0;

        }

    }


    else{

        const blue = findNearOpponent(ballOwner, 45);


        if(!blue)
            return;


        const d = Math.hypot(
            blue.x - ballOwner.x,
            blue.y - ballOwner.y
        );


        const chance = 0.07 * (1 - d / 45);


        if(Math.random() < chance){

            ballOwner = blue;

            ballVX = 0;
            ballVY = 0;

        }

    }

}


/* =================================================
   فصل اللاعبين (منع التكدس)
================================================= */

function separatePlayers(players, minimum){

    for(let i = 0; i < players.length; i++){

        for(let j = i + 1; j < players.length; j++){

            const a = players[i];
            const b = players[j];


            const dx = b.x - a.x;
            const dy = b.y - a.y;


            const d = Math.hypot(dx, dy);


            if(d <= 0 || d >= minimum)
                continue;


            const nx = dx / d;
            const ny = dy / d;


            const push = (minimum - d) / 2;


            const aFixed =
                a === teamPlayers[activePlayerIndex];

            const bFixed =
                b === teamPlayers[activePlayerIndex];


            if(!aFixed){
                a.x -= nx * push;
                a.y -= ny * push;
            }


            if(!bFixed){
                b.x += nx * push;
                b.y += ny * push;
            }


            const ba = getRoleBounds(a);
            const bb = getRoleBounds(b);


            a.x = clamp(a.x, ba.minX, ba.maxX);
            a.y = clamp(a.y, ba.minY, ba.maxY);


            b.x = clamp(b.x, bb.minX, bb.maxX);
            b.y = clamp(b.y, bb.minY, bb.maxY);

        }

    }

}

/* =================================================
   التسديد الجديد
================================================= */

/*
   منطق التسديد:
   1. ضغط زر 👟 → startCharging (يظهر السهم فورًا).
   2. سحب الإصبع → updateAim (يحدّث الاتجاه).
   3. الشحن يزيد تلقائيًا أثناء السحب.
   4. رفع الإصبع → kickBall (يسدد).
   القوة النهائية = قوة الشحن × معامل المسافة.
*/


/* =================================================
   بدء التسديد
================================================= */

function startCharging(){

    if(matchEnded)
        return;


    const p = teamPlayers[activePlayerIndex];


    if(!p || ballOwner !== p){

        return;

    }


    chargingActive = true;

    aiming = true;

    chargePower = 0;

    aimAngle = -Math.PI / 2;

    aimX = worldWidth / 2;
    aimY = 0;


    powerElement.style.width = "0%";

    powerText.textContent = "0";

    aimArrow.style.display = "block";

}


/* =================================================
   تحديث الشحن (يزيد تلقائيًا)
================================================= */

function updateCharge(dt){

    if(!chargingActive)
        return;


    chargePower += POWER_SPEED * dt;


    chargePower = Math.min(MAX_POWER, chargePower);


    powerElement.style.width = `${chargePower}%`;

    powerText.textContent = Math.round(chargePower);

}


/* =================================================
   تحديث اتجاه السهم بالسحب
================================================= */

function updateAim(clientX, clientY){

    if(!chargingActive)
        return;


    const rect = game.getBoundingClientRect();


    const worldTouchX = clientX - rect.left + cameraX;

    const worldTouchY = clientY - rect.top + cameraY;


    let dx = worldTouchX - ballX;
    let dy = worldTouchY - ballY;


    const d = Math.hypot(dx, dy);


    if(d < 8)
        return;


    aimAngle = Math.atan2(dy, dx);


    const AIM_LENGTH = 200;

    aimX = ballX + Math.cos(aimAngle) * AIM_LENGTH;
    aimY = ballY + Math.sin(aimAngle) * AIM_LENGTH;

}


/* =================================================
   معامل المسافة للهدف
================================================= */

function getDistanceFactor(){

    const goalX = worldWidth / 2;
    const goalY = 0;


    const distToGoal = Math.hypot(
        ballX - goalX,
        ballY - goalY
    );


    const maxDist = Math.hypot(worldWidth, worldHeight);


    const t = Math.min(1, distToGoal / maxDist);


    return 1 - t * 0.7;

}


/* =================================================
   تنفيذ الركلة
================================================= */

function kickBall(){

    const p = teamPlayers[activePlayerIndex];


    if(!p || ballOwner !== p){

        cancelCharging();
        return;

    }


    let dx = Math.cos(aimAngle);
    let dy = Math.sin(aimAngle);


    const distanceFactor = getDistanceFactor();


    const chargeNormalized = Math.max(0.15, chargePower / 100);


    const finalPower = chargeNormalized * distanceFactor;


    const speed = 350 + finalPower * 950;


    ballOwner = null;

    ballX = p.x + dx * 30;
    ballY = p.y + dy * 30;

    ballVX = dx * speed;
    ballVY = dy * speed;


    cancelCharging();

}


/* =================================================
   إلغاء التسديد
================================================= */

function cancelCharging(){

    chargingActive = false;

    aiming = false;

    chargePower = 0;

    aimPointerId = null;

    powerElement.style.width = "0%";

    powerText.textContent = "قوة الركلة";

    aimArrow.style.display = "none";

}


/* =================================================
   إنهاء الركلة (عند رفع الإصبع)
================================================= */

function finishKick(){

    if(!chargingActive)
        return;


    kickBall();

}


/* =================================================
   تحديث الكرة
================================================= */

function updateBall(dt){

    if(ballOwner){

        const offset = -30;


        ballX = ballOwner.x;

        ballY = ballOwner.y + offset;


        ballVX = 0;
        ballVY = 0;

        return;

    }


    ballX += ballVX * dt;

    ballY += ballVY * dt;


    const friction = Math.pow(FRICTION, dt * 60);


    ballVX *= friction;

    ballVY *= friction;


    if(checkGoal()){

        return;

    }


    if(ballX - BALL_RADIUS < 0){

        ballX = BALL_RADIUS;

        ballVX = Math.abs(ballVX) * 0.72;

    }


    if(ballX + BALL_RADIUS > worldWidth){

        ballX = worldWidth - BALL_RADIUS;

        ballVX = -Math.abs(ballVX) * 0.72;

    }


    if(ballY < 0){

        ballY = 0;

        ballVY = Math.abs(ballVY) * 0.72;

    }


    if(ballY > worldHeight){

        ballY = worldHeight;

        ballVY = -Math.abs(ballVY) * 0.72;

    }


    if(Math.hypot(ballVX, ballVY) < 0.15){

        ballVX = 0;
        ballVY = 0;

    }

}


/* =================================================
   الهدف
================================================= */

function checkGoal(){

    if(
        ballY <= 8 &&
        Math.abs(ballX - worldWidth / 2) <= GOAL_WIDTH / 2
    ){

        blueScore++;

        updateScore();

        showGoal("GOAL! 🔵⚽");

        resetAfterGoal("blue");

        return true;

    }


    if(
        ballY >= worldHeight - 8 &&
        Math.abs(ballX - worldWidth / 2) <= GOAL_WIDTH / 2
    ){

        redScore++;

        updateScore();

        showGoal("GOAL! 🔴⚽");

        resetAfterGoal("red");

        return true;

    }


    return false;

}


/* =================================================
   عرض النتيجة
================================================= */

function updateScore(){

    scoreElement.textContent = `${blueScore} - ${redScore}`;

}


/* =================================================
   رسالة الهدف
================================================= */

function showGoal(text){

    goalMessage.textContent = text;

    goalMessage.classList.add("show");


    setTimeout(() => {

        goalMessage.classList.remove("show");

    }, 1200);

}


/* =================================================
   بعد الهدف
================================================= */

function resetAfterGoal(scoringTeam){

    ballVX = 0;
    ballVY = 0;


    for(const p of teamPlayers){

        p.x = p.anchorX;
        p.y = p.anchorY;

    }


    for(const p of opponents){

        p.x = p.anchorX;
        p.y = p.anchorY;

    }


    /*
       الفريق الذي سجل يبدأ بالكرة.
    */

    if(scoringTeam === "blue"){

        ballOwner = teamPlayers[activePlayerIndex];

    }else{

        ballOwner = opponents[0];

    }


    ballX = ballOwner.x;
    ballY = ballOwner.y - 30;


    cameraX = clamp(
        ballX - viewWidth / 2,
        0,
        Math.max(0, worldWidth - viewWidth)
    );

    cameraY = clamp(
        ballY - viewHeight / 2,
        0,
        Math.max(0, worldHeight - viewHeight)
    );


    draw();

}


/* =================================================
   Joystick
================================================= */

function resetJoystick(){

    joystickActive = false;

    joystickPointerId = null;

    joystickX = 0;
    joystickY = 0;


    joystickCenter.style.transform = "translate(-50%,-50%)";

}


function updateJoystick(clientX, clientY){

    const rect = movePad.getBoundingClientRect();


    const centerX = rect.left + rect.width / 2;

    const centerY = rect.top + rect.height / 2;


    let dx = clientX - centerX;
    let dy = clientY - centerY;


    const d = Math.hypot(dx, dy);


    if(d > JOYSTICK_MAX_DISTANCE){

        dx = dx / d * JOYSTICK_MAX_DISTANCE;

        dy = dy / d * JOYSTICK_MAX_DISTANCE;

    }


    joystickX = dx / JOYSTICK_MAX_DISTANCE;

    joystickY = dy / JOYSTICK_MAX_DISTANCE;


    joystickCenter.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}

/* =================================================
   أحداث Joystick
================================================= */

movePad.addEventListener("pointerdown", e => {

    e.preventDefault();

    joystickActive = true;

    joystickPointerId = e.pointerId;

    movePad.setPointerCapture(e.pointerId);

    updateJoystick(e.clientX, e.clientY);

});


movePad.addEventListener("pointermove", e => {

    if(!joystickActive || e.pointerId !== joystickPointerId)
        return;

    e.preventDefault();

    updateJoystick(e.clientX, e.clientY);

});


movePad.addEventListener("pointerup", e => {

    if(e.pointerId !== joystickPointerId)
        return;

    resetJoystick();

});


movePad.addEventListener("pointercancel", e => {

    if(e.pointerId !== joystickPointerId)
        return;

    resetJoystick();

});


/* =================================================
   أحداث زر التسديد
================================================= */

kickControl.addEventListener("pointerdown", e => {

    e.preventDefault();

    if(chargingActive)
        return;

    aimPointerId = e.pointerId;

    kickControl.setPointerCapture(e.pointerId);

    startCharging();

});


kickControl.addEventListener("pointermove", e => {

    if(!chargingActive)
        return;

    if(e.pointerId !== aimPointerId)
        return;

    e.preventDefault();

    updateAim(e.clientX, e.clientY);

});


kickControl.addEventListener("pointerup", e => {

    if(e.pointerId !== aimPointerId)
        return;

    finishKick();

    aimPointerId = null;

});


kickControl.addEventListener("pointercancel", e => {

    if(e.pointerId !== aimPointerId)
        return;

    cancelCharging();

});


/* =================================================
   سحب السهم من أي مكان في الشاشة
================================================= */

game.addEventListener("pointermove", e => {

    if(!chargingActive)
        return;

    if(e.pointerId !== aimPointerId)
        return;

    e.preventDefault();

    updateAim(e.clientX, e.clientY);

});


game.addEventListener("pointerup", e => {

    if(!chargingActive)
        return;

    if(e.pointerId !== aimPointerId)
        return;

    finishKick();

    aimPointerId = null;

});


/* =================================================
   تبديل اللاعب (Double Tap)
================================================= */

let lastTapTime = 0;


game.addEventListener("pointerdown", e => {

    if(
        e.target === movePad ||
        movePad.contains(e.target) ||
        e.target === kickControl ||
        kickControl.contains(e.target)
    ){

        return;

    }


    if(chargingActive)
        return;


    const now = performance.now();


    if(now - lastTapTime < 320){

        switchPlayer();

    }


    lastTapTime = now;

});


/* =================================================
   تبديل اللاعب اليدوي
================================================= */

function switchPlayer(){

    let bestIndex = -1;

    let bestDist = Infinity;


    for(let i = 0; i < teamPlayers.length; i++){

        if(i === activePlayerIndex)
            continue;


        const p = teamPlayers[i];


        const d = Math.hypot(p.x - ballX, p.y - ballY);


        if(d < bestDist){

            bestDist = d;
            bestIndex = i;

        }

    }


    if(bestIndex < 0)
        return;


    cancelCharging();


    activePlayerIndex = bestIndex;


    for(let i = 0; i < teamPlayers.length; i++){

        teamPlayers[i].controlled =
            i === activePlayerIndex;

        teamPlayers[i].moveX = 0;
        teamPlayers[i].moveY = 0;

    }


    aimAngle = -Math.PI / 2;

    aimX = worldWidth / 2;

    aimY = 0;

}


/* =================================================
   تحديث اللعبة
================================================= */

function updateGame(dt){

    if(!matchRunning || matchEnded)
        return;


    updateControlledPlayer(dt);

    updateBlueAI(dt);

    updateRedAI(dt);

    updateBallAI(dt);

    tackle();

    updateCharge(dt);

    updateBall(dt);

    tryBallPickup();

    separatePlayers(teamPlayers, 55);

    separatePlayers(opponents, 55);

    updateCamera();

    draw();

}


/* =================================================
   المؤقت
================================================= */

function formatTime(seconds){

    seconds = Math.max(0, Math.ceil(seconds));


    const minutes = Math.floor(seconds / 60);

    const secs = seconds % 60;


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


function updateTimer(){

    matchTimeElement.textContent = formatTime(matchTimeRemaining);


    if(matchTimeRemaining <= 10){

        matchTimeElement.classList.add("warning");

    }else{

        matchTimeElement.classList.remove("warning");

    }

}


/* =================================================
   تحديث الوقت
================================================= */

function updateMatchTimer(now){

    if(!matchRunning || matchEnded)
        return;


    let elapsed = (now - matchLastTimestamp) / 1000;


    matchLastTimestamp = now;


    elapsed = Math.min(elapsed, 0.1);


    matchTimeRemaining -= elapsed;


    if(matchTimeRemaining <= 0){

        matchTimeRemaining = 0;

        updateTimer();

        endMatch();

        return;

    }


    updateTimer();

}


/* =================================================
   نهاية المباراة
================================================= */

function endMatch(){

    if(matchEnded)
        return;


    matchEnded = true;

    matchRunning = false;


    ballOwner = null;

    ballVX = 0;
    ballVY = 0;


    cancelCharging();

    resetJoystick();


    matchEndScoreElement.textContent =
        `${blueScore} - ${redScore}`;

    matchEndElement.classList.add("show");

}


/* =================================================
   مباراة جديدة
================================================= */

function resetMatch(){

    blueScore = 0;
    redScore = 0;

    updateScore();


    matchTimeRemaining = MATCH_DURATION;

    matchEnded = false;

    matchRunning = true;


    activePlayerIndex = 0;


    cancelCharging();

    resetJoystick();


    /*
       ===== إعادة مراكز الأزرق =====
    */

    teamPlayers[0].x = worldWidth / 2;
    teamPlayers[0].y = worldHeight * 0.28;

    teamPlayers[1].x = worldWidth * 0.12;
    teamPlayers[1].y = worldHeight * 0.36;

    teamPlayers[2].x = worldWidth * 0.88;
    teamPlayers[2].y = worldHeight * 0.36;

    teamPlayers[3].x = worldWidth / 2;
    teamPlayers[3].y = worldHeight * 0.78;

    teamPlayers[4].x = worldWidth / 2;
    teamPlayers[4].y = worldHeight * 0.94;


    /*
       ===== إعادة مراكز الأحمر =====
    */

    opponents[0].x = worldWidth / 2;
    opponents[0].y = worldHeight * 0.72;

    opponents[1].x = worldWidth * 0.12;
    opponents[1].y = worldHeight * 0.64;

    opponents[2].x = worldWidth * 0.88;
    opponents[2].y = worldHeight * 0.64;

    opponents[3].x = worldWidth / 2;
    opponents[3].y = worldHeight * 0.22;

    opponents[4].x = worldWidth / 2;
    opponents[4].y = worldHeight * 0.06;


    for(let i = 0; i < teamPlayers.length; i++){

        teamPlayers[i].controlled = i === 0;

        teamPlayers[i].moveX = 0;
        teamPlayers[i].moveY = 0;

    }


    /*
       ===== الكرة مع المهاجم الأزرق =====
    */

    ballOwner = teamPlayers[0];

    ballX = ballOwner.x;

    ballY = ballOwner.y - 30;

    ballVX = 0;
    ballVY = 0;


    aimAngle = -Math.PI / 2;

    aimX = worldWidth / 2;

    aimY = 0;


    cameraX = clamp(
        ballX - viewWidth / 2,
        0,
        Math.max(0, worldWidth - viewWidth)
    );

    cameraY = clamp(
        ballY - viewHeight / 2,
        0,
        Math.max(0, worldHeight - viewHeight)
    );


    matchEndElement.classList.remove("show");


    updateTimer();

    draw();

}


/* =================================================
   تغيير حجم الشاشة
================================================= */

function resizeGame(){

    viewWidth = game.clientWidth;

    viewHeight = game.clientHeight;


    worldWidth = viewWidth;

    worldHeight = viewHeight * 2;


    teamPlayers[0].anchorX = worldWidth / 2;
    teamPlayers[0].anchorY = worldHeight * 0.28;

    teamPlayers[1].anchorX = worldWidth * 0.12;
    teamPlayers[1].anchorY = worldHeight * 0.36;

    teamPlayers[2].anchorX = worldWidth * 0.88;
    teamPlayers[2].anchorY = worldHeight * 0.36;

    teamPlayers[3].anchorX = worldWidth / 2;
    teamPlayers[3].anchorY = worldHeight * 0.78;

    teamPlayers[4].anchorX = worldWidth / 2;
    teamPlayers[4].anchorY = worldHeight * 0.94;


    opponents[0].anchorX = worldWidth / 2;
    opponents[0].anchorY = worldHeight * 0.72;

    opponents[1].anchorX = worldWidth * 0.12;
    opponents[1].anchorY = worldHeight * 0.64;

    opponents[2].anchorX = worldWidth * 0.88;
    opponents[2].anchorY = worldHeight * 0.64;

    opponents[3].anchorX = worldWidth / 2;
    opponents[3].anchorY = worldHeight * 0.22;

    opponents[4].anchorX = worldWidth / 2;
    opponents[4].anchorY = worldHeight * 0.06;


    if(ballOwner){

        ballX = ballOwner.x;

        ballY = ballOwner.y - 30;

    }


    cameraX = clamp(
        cameraX,
        0,
        Math.max(0, worldWidth - viewWidth)
    );

    cameraY = clamp(
        cameraY,
        0,
        Math.max(0, worldHeight - viewHeight)
    );


    draw();

}


window.addEventListener("resize", resizeGame);


/* =================================================
   الحلقة الرئيسية
================================================= */

function gameLoop(now){

    let dt = (now - lastFrameTime) / 1000;

    lastFrameTime = now;

    dt = Math.min(dt, 0.033);


    updateMatchTimer(now);

    updateGame(dt);


    requestAnimationFrame(gameLoop);

}


/* =================================================
   زر مباراة جديدة
================================================= */

newMatchButton.addEventListener("click", e => {

    e.preventDefault();

    resetMatch();

});


/* =================================================
   منع السلوك الافتراضي
================================================= */

document.addEventListener("gesturestart", e => e.preventDefault());

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("dblclick", e => e.preventDefault());


/* =================================================
   البداية
================================================= */

resizeGame();


ballOwner = teamPlayers[0];

ballX = teamPlayers[0].x;

ballY = teamPlayers[0].y - 30;


cameraX = clamp(
    ballX - viewWidth / 2,
    0,
    Math.max(0, worldWidth - viewWidth)
);

cameraY = clamp(
    ballY - viewHeight / 2,
    0,
    Math.max(0, worldHeight - viewHeight)
);


aimAngle = -Math.PI / 2;

aimX = worldWidth / 2;

aimY = 0;


updateTimer();

draw();


lastFrameTime = performance.now();

matchLastTimestamp = performance.now();


requestAnimationFrame(gameLoop);

</script>
