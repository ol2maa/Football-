<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Mirror Control</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #333333;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    background: #333333;
    overflow: hidden;
}

/* الدائرة M */
#circle {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: white;
    border: 3px solid black;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: -apple-system,
                 BlinkMacSystemFont,
                 "Segoe UI",
                 sans-serif;

    font-size: 28px;
    font-weight: 900;
    color: black;

    z-index: 2;

    transform: translate3d(0, 0, 0);
    will-change: transform;
    
    /* منع تحديد النص أو التكبير عند اللمس */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
}

/* منطقة التحكم */
#controlArea {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 250px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 5;
}

/* لوحة MIRROR */
#pad {
    position: relative;
    width: 150px;
    height: 150px;

    background: rgba(51, 51, 51, 0.9);
    border-radius: 20px;

    /* هذه الخاصية تمنع تكبير الشاشة عند اللمس السريع */
    touch-action: manipulation;
    
    /* منع تحديد النص */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

/* النص MIRROR */
#mirror {
    position: absolute;
    left: 0;
    top: 0;
    width: 150px;
    height: 150px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-family: -apple-system,
                 BlinkMacSystemFont,
                 "Segoe UI",
                 sans-serif;

    font-size: 18px;
    font-weight: 700;

    pointer-events: none;
}

/* الأسهم */
.arrow {
    position: absolute;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    line-height: 1;

    pointer-events: none;
}

.up {
    top: 10px;
    left: 65px;
}

.down {
    bottom: 10px;
    left: 65px;
}

.left {
    left: 8px;
    top: 65px;
}

.right {
    right: 8px;
    top: 65px;
}
</style>
</head>

<body>

<div id="game">

    <div id="circle">M</div>

    <div id="controlArea">
        <div id="pad">

            <div id="mirror">MIRROR</div>

            <div class="arrow up">▲</div>
            <div class="arrow down">▼</div>
            <div class="arrow left">◀</div>
            <div class="arrow right">▶</div>

        </div>
    </div>

</div>

<script>

const game = document.getElementById("game");
const circle = document.getElementById("circle");
const pad = document.getElementById("pad");

const CIRCLE_SIZE = 60;
const SPEED = 1.5;

let dx = 0;
let dy = 0;
let touching = false;
let activePointerId = null;

let x = 0;
let y = 0;

/*
    تحديد موقع الدائرة في المنتصف
*/
function centerCircle() {
    const width = game.clientWidth;
    const height = game.clientHeight;

    x = (width - CIRCLE_SIZE) / 2;
    y = (height - CIRCLE_SIZE) / 2;

    drawCircle();
}

function drawCircle() {
    circle.style.transform =
        `translate3d(${x}px, ${y}px, 0)`;
}

function keepInsideScreen() {
    const maxX = game.clientWidth - CIRCLE_SIZE;
    const maxY = game.clientHeight - CIRCLE_SIZE;

    if (x < 0) x = 0;
    if (x > maxX) x = maxX;
    if (y < 0) y = 0;
    if (y > maxY) y = maxY;
}

/*
    تحديث الاتجاه (يدعم 8 اتجاهات)
*/
function updateDirection(clientX, clientY) {

    const rect = pad.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const offsetX = clientX - centerX;
    const offsetY = clientY - centerY;

    const deadZone = 12;
    const distance = Math.hypot(offsetX, offsetY);

    if (distance < deadZone) {
        dx = 0;
        dy = 0;
        return;
    }

    dx = (offsetX / distance) * SPEED;
    dy = (offsetY / distance) * SPEED;
}

/*
    بداية اللمس
*/
pad.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    touching = true;
    activePointerId = event.pointerId;

    if (pad.setPointerCapture) {
        pad.setPointerCapture(event.pointerId);
    }

    updateDirection(event.clientX, event.clientY);
}, { passive: false });

/*
    تحريك الإصبع
*/
pad.addEventListener("pointermove", function(event) {
    if (!touching || event.pointerId !== activePointerId) return;
    event.preventDefault();
    updateDirection(event.clientX, event.clientY);
}, { passive: false });

/*
    رفع الإصبع
*/
function stopMovement(event) {
    if (activePointerId !== null && event.pointerId !== activePointerId) return;

    touching = false;
    activePointerId = null;
    dx = 0;
    dy = 0;
}

pad.addEventListener("pointerup", stopMovement);
pad.addEventListener("pointercancel", stopMovement);

pad.addEventListener("lostpointercapture", function() {
    touching = false;
    activePointerId = null;
    dx = 0;
    dy = 0;
});

/*
    حلقة الحركة
*/
function gameLoop() {
    if (touching) {
        x += dx;
        y += dy;
        keepInsideScreen();
        drawCircle();
    }
    requestAnimationFrame(gameLoop);
}

window.addEventListener("resize", function() {
    keepInsideScreen();
    drawCircle();
});

centerCircle();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
