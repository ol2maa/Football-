<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<title>كرة القدم ⚽️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #16803c;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    touch-action: none;

    overscroll-behavior: none;
}

body {

    display: flex;

    justify-content: center;
    align-items: center;

    touch-action: none;
}


/* =========================================
   الملعب
========================================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 700px;

    overflow: hidden;

    background:

        repeating-linear-gradient(
            90deg,

            rgba(255,255,255,0.035)
            0px,

            rgba(255,255,255,0.035)
            50px,

            rgba(0,0,0,0.035)
            50px,

            rgba(0,0,0,0.035)
            100px
        ),

        #16803c;

    touch-action: none;

    overscroll-behavior: none;
}


/* =========================================
   خطوط الملعب
========================================= */

.center-line {

    position: absolute;

    width: 100%;
    height: 2px;

    left: 0;
    top: 50%;

    background:
        rgba(255,255,255,0.55);

    pointer-events: none;
}


.center-circle {

    position: absolute;

    width: 170px;
    height: 170px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,0.55);

    border-radius: 50%;

    pointer-events: none;
}


/* =========================================
   المرمى
========================================= */

.goal {

    position: absolute;

    left: 50%;

    width: 190px;
    height: 48px;

    transform:
        translateX(-50%);

    z-index: 3;

    pointer-events: none;
}


#topGoal {
    top: 0;
}


#bottomGoal {
    bottom: 0;
}


/* =========================================
   شباك المرمى
========================================= */

.goalNet {

    position: absolute;

    left: 50%;

    width: 190px;
    height: 48px;

    transform:
        translateX(-50%);

    border-left:
        2px solid
        rgba(255,255,255,0.65);

    border-right:
        2px solid
        rgba(255,255,255,0.65);

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.08) 0px,
            rgba(255,255,255,0.08) 2px,
            transparent 2px,
            transparent 8px
        );

    opacity: 0.8;
}


/* =========================================
   القائمان
========================================= */

.goalPost {

    position: absolute;

    width: 12px;
    height: 58px;

    background: white;

    border-radius: 5px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.35);
}


.goalPost.left {

    left: 0;
    top: 0;
}


.goalPost.right {

    right: 0;
    top: 0;
}


/* =========================================
   شريط المرمى
========================================= */

.goalCrossbar {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 12px;

    background: white;

    border-radius: 5px;

    box-shadow:
        0 2px 5px
        rgba(0,0,0,0.35);
}


#bottomGoal .goalPost {

    top: auto;
    bottom: 0;
}


#bottomGoal .goalCrossbar {

    top: auto;
    bottom: 0;
}


/* =========================================
   النتيجة
========================================= */

#score {

    position: absolute;

    top: 82px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 24px;

    font-weight: bold;

    background:
        rgba(0,0,0,0.35);

    padding:
        5px 18px;

    border-radius: 20px;

    z-index: 35;

    text-shadow:
        0 2px 4px black;
}


/* =========================================
   رسالة الهدف
========================================= */

#goalMessage {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.7);

    color: white;

    font-size: 42px;

    font-weight: 900;

    text-shadow:
        0 4px 10px
        rgba(0,0,0,0.8);

    background:
        rgba(0,0,0,0.45);

    padding:
        15px 28px;

    border-radius: 25px;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}


#goalMessage.show {

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}


/* =========================================
   اللاعب
========================================= */

#player {

    position: absolute;

    width: 38px;
    height: 38px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #1769ff;

    border:
        4px solid white;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.35);

    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 25px;

    touch-action: none;
}


/* =========================================
   الزميل
========================================= */

#teammate {

    position: absolute;

    width: 38px;
    height: 38px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #1769ff;

    border:
        4px solid white;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.35);

    z-index: 10;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 25px;

    touch-action: none;
}


/* =========================================
   سهم اللاعب المتحكم
========================================= */

.controlArrow {

    position: absolute;

    left: 50%;

    top: -19px;

    transform:
        translateX(-50%);

    color: #ffd400;

    font-size: 15px;

    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 2px 3px black;

    opacity: 0;

    pointer-events: none;
}


#player.controlled .controlArrow,
#teammate.controlled .controlArrow {

    opacity: 1;
}


/* =========================================
   الكرة
========================================= */

#ball {

    position: absolute;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: white;

    border:
        2px solid #222;

    box-shadow:
        0 3px 7px
        rgba(0,0,0,0.35);

    transform:
        translate(-50%, -50%);

    z-index: 9;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 14px;

    pointer-events: none;
}


/* =========================================
   سهم اتجاه الركلة
========================================= */

#aim {

    position: absolute;

    width: 78px;
    height: 4px;

    background: #ffd400;

    border-radius: 5px;

    transform-origin:
        left center;

    z-index: 8;

    pointer-events: none;

    box-shadow:
        0 0 6px
        rgba(255,215,0,0.8);
}


#aim::after {

    content: "";

    position: absolute;

    right: -2px;
    top: 50%;

    width: 0;
    height: 0;

    border-top:
        8px solid transparent;

    border-bottom:
        8px solid transparent;

    border-left:
        14px solid #ffd400;

    transform:
        translateY(-50%);
}


/* =========================================
   عداد القوة
========================================= */

#powerBox {

    position: absolute;

    top: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 190px;
    height: 18px;

    border:
        2px solid white;

    border-radius: 20px;

    background:
        rgba(0,0,0,0.35);

    overflow: hidden;

    z-index: 30;
}


#power {

    width: 0%;

    height: 100%;

    background: #ffd400;

    border-radius: 20px;
}


/* =========================================
   نص القوة
========================================= */

#powerText {

    position: absolute;

    top: 42px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 14px;

    text-shadow:
        0 2px 4px black;

    z-index: 30;

    white-space: nowrap;
}


/* =========================================
   JOYSTICK الحركة
========================================= */

#movePad {

    position: absolute;

    left: 22px;
    bottom: 28px;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.12);

    border:
        3px solid
        rgba(255,255,255,0.35);

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.25);

    z-index: 40;

    touch-action: none;
}


/* =========================================
   دائرة وسط Joystick
========================================= */

#joystickCenter {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 54px;
    height: 54px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(0,0,0,0.30);

    border:
        3px solid white;

    box-shadow:
        0 4px 8px
        rgba(0,0,0,0.35);

    pointer-events: none;

    transition:
        transform 0.04s linear;
}


/* =========================================
   أسهم الاتجاه
========================================= */

.moveArrow {

    position: absolute;

    color: white;

    font-size: 24px;

    font-weight: bold;

    opacity: 0.85;

    pointer-events: none;

    text-shadow:
        0 2px 4px black;
}


#arrowUp {

    left: 50%;
    top: 10px;

    transform:
        translateX(-50%);
}


#arrowDown {

    left: 50%;
    bottom: 10px;

    transform:
        translateX(-50%);
}


#arrowLeft {

    left: 10px;
    top: 50%;

    transform:
        translateY(-50%);
}


#arrowRight {

    right: 10px;
    top: 50%;

    transform:
        translateY(-50%);
}


/* =========================================
   وحدة تحكم الركلة
========================================= */

#kickControl {

    position: absolute;

    right: 22px;
    bottom: 28px;

    width: 84px;
    height: 84px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.18);

    border:
        5px solid white;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.35);

    z-index: 40;

    touch-action: none;

    display: flex;

    justify-content: center;
    align-items: center;
}


/* =========================================
   الزر الأحمر
========================================= */

#kickButton {

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #e53935;

    color: white;

    font-size: 34px;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        inset 0 0 0 2px
        rgba(255,255,255,0.15);

    pointer-events: none;

    transition:
        transform 0.08s ease;
}


/* =========================================
   مؤشر الإصبع للركلة
========================================= */

#kickDot {

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 7px
        rgba(255,255,255,0.9);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    opacity: 0;
}


/* =========================================
   التعليمات
========================================= */

#info {

    position: absolute;

    top: 72px;
    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 12px;

    background:
        rgba(0,0,0,0.35);

    padding:
        6px 12px;

    border-radius: 20px;

    z-index: 30;

    white-space: nowrap;

    pointer-events: none;
}

</style>

</head>


<body>

<div id="game">

    <div class="center-line"></div>

    <div class="center-circle"></div>


    <div
    class="goal"
    id="topGoal">

        <div class="goalNet"></div>

    </div>


    <div
    class="goal"
    id="bottomGoal">

        <div class="goalNet"></div>

    </div>


    <div id="score">
        0 - 0
    </div>


    <div id="goalMessage">
        GOAL! ⚽️🎉
    </div>


    <div id="player">

        <div class="controlArrow">
            ▼
        </div>

        🧍

    </div>


    <div id="teammate">

        <div class="controlArrow">
            ▼
        </div>

        🧍

    </div>


    <div id="ball">
        ⚽
    </div>


    <div id="aim"></div>


    <div id="powerBox">

        <div id="power"></div>

    </div>


    <div id="powerText">
        قوة الركلة
    </div>


    <div id="movePad">

        <div
            class="moveArrow"
            id="arrowUp">
            ▲
        </div>

        <div
            class="moveArrow"
            id="arrowDown">
            ▼
        </div>

        <div
            class="moveArrow"
            id="arrowLeft">
            ◀
        </div>

        <div
            class="moveArrow"
            id="arrowRight">
            ▶
        </div>

        <div id="joystickCenter"></div>

    </div>


    <div id="kickControl">

        <div id="kickButton">
            👟
        </div>

        <div id="kickDot"></div>

    </div>


    <div id="info">
        حرّك إصبعك للتحكم • الحركة والركل معًا
    </div>

</div>


<script>

/* =================================================
   العناصر
================================================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const teammate =
    document.getElementById("teammate");

const ball =
    document.getElementById("ball");

const aim =
    document.getElementById("aim");

const kickControl =
    document.getElementById("kickControl");

const kickButton =
    document.getElementById("kickButton");

const kickDot =
    document.getElementById("kickDot");

const powerBar =
    document.getElementById("power");

const movePad =
    document.getElementById("movePad");

const joystickCenter =
    document.getElementById(
        "joystickCenter"
    );

const scoreElement =
    document.getElementById("score");

const goalMessage =
    document.getElementById("goalMessage");


/* =================================================
   حجم الملعب
================================================= */

let gameWidth =
    game.clientWidth;

let gameHeight =
    game.clientHeight;


/* =================================================
   اللاعب الأساسي
================================================= */

let playerX =
    gameWidth / 2;

let playerY =
    gameHeight / 2;


/* =================================================
   الزميل
================================================= */

let teammateX =
    playerX + 75;

let teammateY =
    playerY;


/* =================================================
   اللاعب المتحكم
================================================= */

let activePlayer =
    "player";


/* =================================================
   الكرة
================================================= */

let ballX =
    playerX;

let ballY =
    playerY - 42;


/* =================================================
   اتجاه الركلة
================================================= */

let aimAngle =
    -Math.PI / 2;


/* =================================================
   سرعة اللاعب
================================================= */

const playerSpeed = 1.0;


/* =================================================
   سرعة الزميل الهجومية
================================================= */

const teammateAttackSpeed =
    0.85;


const teammateBehindSpeed =
    1.05;


/* =================================================
   حركة الكرة
================================================= */

let ballVX = 0;

let ballVY = 0;

let ballMoving = false;

let hasBall = true;


/* =================================================
   احتكاك الكرة
================================================= */

const friction = 0.985;


/* =================================================
   قوة الركلة
================================================= */

let charging = false;

let power = 0;

const maxPower = 100;

const powerSpeed = 1.4;


/* =================================================
   النتيجة
================================================= */

let topScore = 0;

let bottomScore = 0;


/* =================================================
   حالة الهدف
================================================= */

let goalScored = false;

let goalTimer = null;


/* =================================================
   أبعاد المرمى
================================================= */

const goalWidth = 190;

const postWidth = 12;

const ballRadius = 15;


/* =================================================
   Joystick الحركة
================================================= */

let movePointerId = null;

let moveTouching = false;

let moveX = 0;

let moveY = 0;


/* =================================================
   وحدة الركلة
================================================= */

let kickPointerId = null;

let kickTouching = false;


/* =================================================
   اختيار اللاعب الأقرب
================================================= */

const playerSwitchMargin = 8;


/* =================================================
   التبديل اليدوي
================================================= */

/*
   أقل مسافة بين اللاعبين حتى نسمح
   بالتبديل اليدوي.
*/

const manualSwitchMinDistance = 55;


/*
   قوة اتجاه الـJoystick المطلوبة
   حتى نعتبر الحركة أمر تبديل.
*/

const manualSwitchDot = 0.72;


/*
   منع التبديل المتكرر بسرعة.
*/

const manualSwitchCooldown = 500;


/*
   بعد التبديل اليدوي يبقى اللاعب
   الذي اخترته تحت تحكم المستخدم.
*/

let manualControlLock = false;


/*
   وقت آخر تبديل يدوي.
*/

let lastManualSwitchTime = 0;


/* =================================================
   الكرة أمام اللاعب المتحكم
================================================= */

function placeBallWithPlayer() {

    if (!hasBall)
        return;


    const distance = 34;


    let controlledX;

    let controlledY;


    if (
        activePlayer ===
        "teammate"
    ) {

        controlledX =
            teammateX;

        controlledY =
            teammateY;

    } else {

        controlledX =
            playerX;

        controlledY =
            playerY;

    }


    ballX =
        controlledX +
        Math.cos(aimAngle) *
        distance;


    ballY =
        controlledY +
        Math.sin(aimAngle) *
        distance;

}


/* =================================================
   تحديث النتيجة
================================================= */

function updateScore() {

    scoreElement.textContent =
        `${topScore} - ${bottomScore}`;

}


/* =================================================
   الرسم
================================================= */

function draw() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";


    teammate.style.left =
        teammateX + "px";

    teammate.style.top =
        teammateY + "px";


    player.classList.toggle(
        "controlled",
        activePlayer === "player"
    );


    teammate.classList.toggle(
        "controlled",
        activePlayer === "teammate"
    );


    ball.style.left =
        ballX + "px";

    ball.style.top =
        ballY + "px";


    aim.style.left =
        ballX + "px";

    aim.style.top =
        ballY + "px";


    aim.style.transform =
        `rotate(${aimAngle}rad)`;


    if (ballMoving) {

        aim.style.opacity =
            "0.25";

    } else {

        aim.style.opacity =
            "1";

    }

}


/* =================================================
   المسافة بين نقطتين
================================================= */

function distanceBetween(
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =================================================
   اختيار اللاعب الأقرب للكرة
================================================= */

function updateActivePlayer() {

    if (hasBall)
        return;


    /*
       إذا اختار المستخدم لاعبًا يدويًا،
       لا نرجع للأقرب مباشرة.
    */

    if (manualControlLock)
        return;


    const playerDistance =
        distanceBetween(
            ballX,
            ballY,
            playerX,
            playerY
        );


    const teammateDistance =
        distanceBetween(
            ballX,
            ballY,
            teammateX,
            teammateY
        );


    if (
        activePlayer ===
        "player"
    ) {

        if (
            teammateDistance +
            playerSwitchMargin <
            playerDistance
        ) {

            activePlayer =
                "teammate";

        }

    } else {

        if (
            playerDistance +
            playerSwitchMargin <
            teammateDistance
        ) {

            activePlayer =
                "player";

        }

    }

}


/* =================================================
   التبديل اليدوي بين اللاعبين
================================================= */

function tryManualPlayerSwitch() {

    /*
       لا نبدل إذا كانت الكرة مع اللاعب.
    */

    if (hasBall)
        return false;


    if (goalScored)
        return false;


    /*
       نحتاج حركة واضحة في العصا.
    */

    const joystickLength =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );


    if (
        joystickLength <
        0.65
    )
        return false;


    /*
       حماية من التبديل السريع.
    */

    const now =
        Date.now();


    if (
        now -
        lastManualSwitchTime <
        manualSwitchCooldown
    ) {

        return false;

    }


    let activeX;

    let activeY;

    let otherX;

    let otherY;


    if (
        activePlayer ===
        "player"
    ) {

        activeX =
            playerX;

        activeY =
            playerY;

        otherX =
            teammateX;

        otherY =
            teammateY;

    } else {

        activeX =
            teammateX;

        activeY =
            teammateY;

        otherX =
            playerX;

        otherY =
            playerY;

    }


    /*
       اتجاه اللاعب الآخر بالنسبة
       للاعب المتحكم.
    */

    const dx =
        otherX -
        activeX;

    const dy =
        otherY -
        activeY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance <
        manualSwitchMinDistance
    ) {

        return false;

    }


    /*
       هنا النقطة المهمة:

       نحن نريد التبديل عندما يحرك
       المستخدم العصا عكس اتجاه اللاعب
       الآخر.

       مثال:

       المتحكم تحت
       اللاعب الآخر فوق

       dy = سالب

       المستخدم يضغط DOWN
       moveY = موجب

       لذلك نقارن مع الاتجاه المعكوس.
    */

    const targetX =
        -dx / distance;

    const targetY =
        -dy / distance;


    /*
       اتجاه الـJoystick.
    */

    const joystickX =
        moveX / joystickLength;

    const joystickY =
        moveY / joystickLength;


    /*
       Dot Product.
    */

    const dot =
        joystickX * targetX +
        joystickY * targetY;


    /*
       إذا كانت الحركة في الاتجاه
       المعاكس لمكان اللاعب الآخر،
       نبدل التحكم.
    */

    if (
        dot <
        manualSwitchDot
    ) {

        return false;

    }


    /*
       تبديل اللاعب.
    */

    if (
        activePlayer ===
        "player"
    ) {

        activePlayer =
            "teammate";

    } else {

        activePlayer =
            "player";

    }


    /*
       تثبيت اللاعب الجديد.
    */

    manualControlLock =
        true;


    lastManualSwitchTime =
        now;


    return true;

}


/* =================================================
   ذكاء اللاعبين AI
================================================= */

function updatePlayersAI() {

    if (
        activePlayer !==
        "player"
    ) {

        updatePlayerAI();

    }


    if (
        activePlayer !==
        "teammate"
    ) {

        updateTeammateAI();

    }

}


/* =================================================
   AI اللاعب الأساسي
================================================= */

function updatePlayerAI() {

    if (goalScored)
        return;


    let targetY =
        Math.min(
            playerY,
            gameHeight * 0.18
        );


    let targetX =
        ballX;


    const sideOffset = 85;


    if (
        ballX <
        gameWidth / 2
    ) {

        targetX =
            ballX + sideOffset;

    } else {

        targetX =
            ballX - sideOffset;

    }


    const radius = 19;


    targetX =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                targetX
            )
        );


    targetY =
        Math.max(
            55,
            Math.min(
                gameHeight - 55,
                targetY
            )
        );


    let dx =
        targetX -
        playerX;

    let dy =
        targetY -
        playerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance < 1
    )
        return;


    dx /= distance;

    dy /= distance;


    const speed =
        0.78;


    playerX +=
        dx * speed;

    playerY +=
        dy * speed;


    playerX =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                playerX
            )
        );


    playerY =
        Math.max(
            radius,
            Math.min(
                gameHeight - radius,
                playerY
            )
        );

}


/* =================================================
   AI الزميل
================================================= */

function updateTeammateAI() {

    if (goalScored)
        return;


    const attackTargetY =
        gameHeight * 0.18;


    let targetY =
        Math.min(
            teammateY,
            attackTargetY
        );


    let targetX =
        ballX;


    const sideOffset = 70;


    if (
        ballX <
        gameWidth / 2
    ) {

        targetX =
            ballX + sideOffset;

    } else {

        targetX =
            ballX - sideOffset;

    }


    const radius = 19;


    targetX =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                targetX
            )
        );


    targetY =
        Math.max(
            55,
            Math.min(
                gameHeight - 55,
                targetY
            )
        );


    let dx =
        targetX -
        teammateX;

    let dy =
        targetY -
        teammateY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance < 1
    )
        return;


    dx /= distance;

    dy /= distance;


    let speed =
        teammateAttackSpeed;


    if (
        bottomScore >
        topScore
    ) {

        speed =
            teammateBehindSpeed;

    }


    teammateX +=
        dx * speed;

    teammateY +=
        dy * speed;


    teammateX =
        Math.max(
            radius,
            Math.min(
                gameWidth - radius,
                teammateX
            )
        );


    teammateY =
        Math.max(
            radius,
            Math.min(
                gameHeight - radius,
                teammateY
            )
        );

}


/* =================================================
   حركة اللاعب المتحكم
================================================= */

function movePlayer(dx, dy) {

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length < 0.001)
        return;


    dx /= length;

    dy /= length;


    const radius = 19;


    if (
        activePlayer ===
        "teammate"
    ) {

        teammateX +=
            dx * playerSpeed;

        teammateY +=
            dy * playerSpeed;


        teammateX =
            Math.max(
                radius,
                Math.min(
                    gameWidth - radius,
                    teammateX
                )
            );


        teammateY =
            Math.max(
                radius,
                Math.min(
                    gameHeight - radius,
                    teammateY
                )
            );

    } else {

        playerX +=
            dx * playerSpeed;

        playerY +=
            dy * playerSpeed;


        playerX =
            Math.max(
                radius,
                Math.min(
                    gameWidth - radius,
                    playerX
                )
            );


        playerY =
            Math.max(
                radius,
                Math.min(
                    gameHeight - radius,
                    playerY
                )
            );

    }


    if (hasBall) {

        placeBallWithPlayer();

    }

}


/* =================================================
   حساب تصادم القائم
================================================= */

function collideWithPost(
    postX,
    postY
) {

    const dx =
        ballX - postX;

    const dy =
        ballY - postY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const collisionDistance =
        ballRadius +
        postWidth / 2;


    if (
        distance >=
        collisionDistance
    )
        return;


    let nx;

    let ny;


    if (distance < 0.001) {

        nx = 1;

        ny = 0;

    } else {

        nx =
            dx / distance;

        ny =
            dy / distance;

    }


    ballX =
        postX +
        nx *
        collisionDistance;

    ballY =
        postY +
        ny *
        collisionDistance;


    const velocityAlongNormal =
        ballVX * nx +
        ballVY * ny;


    if (
        velocityAlongNormal < 0
    ) {

        const bounce = 0.55;


        ballVX -=
            (1 + bounce) *
            velocityAlongNormal *
            nx;


        ballVY -=
            (1 + bounce) *
            velocityAlongNormal *
            ny;

    }

}


/* =================================================
   تصادم القائمين
================================================= */

function handleGoalPosts() {

    const topLeftX =
        (gameWidth - goalWidth) / 2;

    const topRightX =
        topLeftX + goalWidth;


    collideWithPost(
        topLeftX,
        10
    );


    collideWithPost(
        topRightX,
        10
    );


    collideWithPost(
        topLeftX,
        gameHeight - 10
    );


    collideWithPost(
        topRightX,
        gameHeight - 10
    );

}


/* =================================================
   فحص الهدف
================================================= */

function checkGoal() {

    const goalLeft =
        (gameWidth - goalWidth) / 2;

    const goalRight =
        goalLeft + goalWidth;


    const insideGoalWidth =
        ballX - ballRadius >
            goalLeft &&

        ballX + ballRadius <
            goalRight;


    if (!insideGoalWidth)
        return false;


    if (
        ballY <
        -ballRadius
    ) {

        return "top";

    }


    if (
        ballY >
        gameHeight + ballRadius
    ) {

        return "bottom";

    }


    return false;

}


/* =================================================
   تنفيذ الهدف
================================================= */

function scoreGoal(
    side
) {

    if (goalScored)
        return;


    goalScored = true;


    ballMoving = false;


    ballVX = 0;

    ballVY = 0;


    charging = false;

    power = 0;


    powerBar.style.width =
        "0%";


    if (side === "top") {

        topScore++;

    } else {

        bottomScore++;

    }


    updateScore();


    goalMessage.classList.add(
        "show"
    );


    ball.style.opacity =
        "0";


    aim.style.opacity =
        "0";


    clearTimeout(goalTimer);


    goalTimer =
        setTimeout(
            function() {

                resetAfterGoal();

            },
            1500
        );

}


/* =================================================
   إعادة اللعب بعد الهدف
================================================= */

function resetAfterGoal() {

    goalScored = false;


    goalMessage.classList.remove(
        "show"
    );


    ball.style.opacity =
        "1";


    playerX =
        gameWidth / 2;

    playerY =
        gameHeight / 2;


    teammateX =
        playerX + 75;

    teammateY =
        playerY;


    activePlayer =
        "player";


    manualControlLock =
        false;


    lastManualSwitchTime =
        0;


    hasBall = true;

    ballMoving = false;


    ballVX = 0;

    ballVY = 0;


    charging = false;

    power = 0;


    powerBar.style.width =
        "0%";


    placeBallWithPlayer();


    draw();

}


/* =================================================
   التقاط الكرة
================================================= */

function tryPickupBall() {

    if (hasBall)
        return;


    const pickupDistance = 32;


    const playerDistance =
        distanceBetween(
            ballX,
            ballY,
            playerX,
            playerY
        );


    const teammateDistance =
        distanceBetween(
            ballX,
            ballY,
            teammateX,
            teammateY
        );


    if (
        playerDistance <=
        pickupDistance
    ) {

        activePlayer =
            "player";


        hasBall = true;

        ballMoving = false;


        ballVX = 0;

        ballVY = 0;


        manualControlLock =
            false;


        placeBallWithPlayer();


        return;

    }


    if (
        teammateDistance <=
        pickupDistance
    ) {

        activePlayer =
            "teammate";


        hasBall = true;

        ballMoving = false;


        ballVX = 0;

        ballVY = 0;


        manualControlLock =
            false;


        placeBallWithPlayer();

    }

}


/* =================================================
   تحديث اللعبة
================================================= */

function update() {

    if (!goalScored) {

        updatePlayersAI();


        /*
           اختيار الأقرب يعمل فقط
           عندما لا يوجد اختيار يدوي مثبت.
        */

        updateActivePlayer();


        movePlayer(
            moveX,
            moveY
        );


        tryPickupBall();


        /* =========================================
           حركة الكرة
        ========================================= */

        if (ballMoving) {

            ballX += ballVX;

            ballY += ballVY;


            ballVX *= friction;

            ballVY *= friction;


            handleGoalPosts();


            const goal =
                checkGoal();


            if (goal) {

                scoreGoal(goal);

            } else {

                const sideRadius = 15;


                if (
                    ballX >
                    gameWidth -
                    sideRadius
                ) {

                    ballX =
                        gameWidth -
                        sideRadius;


                    ballVX =
                        -Math.abs(
                            ballVX
                        );

                }


                if (
                    ballX <
                    sideRadius
                ) {

                    ballX =
                        sideRadius;


                    ballVX =
                        Math.abs(
                            ballVX
                        );

                }


                const goalLeft =
                    (gameWidth -
                     goalWidth) / 2;


                const goalRight =
                    goalLeft +
                    goalWidth;


                const outsideGoal =
                    ballX -
                    ballRadius <=
                    goalLeft ||

                    ballX +
                    ballRadius >=
                    goalRight;


                if (
                    ballY <
                    ballRadius &&
                    outsideGoal
                ) {

                    ballY =
                        ballRadius;


                    ballVY =
                        Math.abs(
                            ballVY
                        );

                }


                if (
                    ballY >
                    gameHeight -
                    ballRadius &&
                    outsideGoal
                ) {

                    ballY =
                        gameHeight -
                        ballRadius;


                    ballVY =
                        -Math.abs(
                            ballVY
                        );

                }


                const speed =
                    Math.sqrt(
                        ballVX *
                        ballVX +

                        ballVY *
                        ballVY
                    );


                if (
                    speed <
                    0.15
                ) {

                    ballVX = 0;

                    ballVY = 0;

                    ballMoving = false;

                }

            }

        }

    }


    draw();


    requestAnimationFrame(update);

}


/* =================================================
   حساب اتجاه Joystick الحركة
================================================= */

function updateMoveJoystick(
    clientX,
    clientY
) {

    const rect =
        movePad.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX - centerX;


    let dy =
        clientY - centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const maxDistance = 48;


    if (
        distance >
        maxDistance
    ) {

        dx =
            (dx / distance) *
            maxDistance;


        dy =
            (dy / distance) *
            maxDistance;

    }


    if (distance > 6) {

        moveX =
            dx / maxDistance;


        moveY =
            dy / maxDistance;

    } else {

        moveX = 0;

        moveY = 0;

    }


    /*
       فحص التبديل اليدوي.
    */

    tryManualPlayerSwitch();


    joystickCenter.style.transform =
        `translate(calc(-50% + ${dx}px),
                   calc(-50% + ${dy}px))`;

}


/* =================================================
   بداية Joystick
================================================= */

movePad.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        moveTouching = true;

        movePointerId =
            e.pointerId;


        try {

            movePad.setPointerCapture(
                e.pointerId
            );

        } catch (error) {}


        updateMoveJoystick(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   حركة الإصبع على Joystick
================================================= */

movePad.addEventListener(
    "pointermove",
    function(e) {

        if (!moveTouching)
            return;


        if (
            e.pointerId !==
            movePointerId
        )
            return;


        e.preventDefault();


        updateMoveJoystick(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   إيقاف Joystick
================================================= */

function stopMoveJoystick(e) {

    if (
        e.pointerId !==
        movePointerId
    )
        return;


    moveTouching = false;

    movePointerId = null;


    moveX = 0;

    moveY = 0;


    joystickCenter.style.transform =
        "translate(-50%, -50%)";

}


movePad.addEventListener(
    "pointerup",
    stopMoveJoystick
);


movePad.addEventListener(
    "pointercancel",
    stopMoveJoystick
);


movePad.addEventListener(
    "lostpointercapture",
    function() {

        moveTouching = false;

        movePointerId = null;

        moveX = 0;

        moveY = 0;


        joystickCenter.style.transform =
            "translate(-50%, -50%)";

    }
);


/* =================================================
   إعدادات التسديد
================================================= */

const kickChargeDistance = 35;


/* =================================================
   حالة التسديد
================================================= */

let kickDirectionDistance = 0;


/* =================================================
   تحديد اتجاه الركلة فقط
================================================= */

function updateKickDirection(
    clientX,
    clientY
) {

    const rect =
        kickControl.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX - centerX;


    let dy =
        clientY - centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    kickDirectionDistance =
        distance;


    if (distance > 3) {

        aimAngle =
            Math.atan2(
                dy,
                dx
            );

    }


    const maxDotDistance = 30;


    let dotX = dx;

    let dotY = dy;


    if (
        distance >
        maxDotDistance
    ) {

        dotX =
            (dx / distance) *
            maxDotDistance;


        dotY =
            (dy / distance) *
            maxDotDistance;

    }


    kickDot.style.left =
        `calc(50% + ${dotX}px)`;


    kickDot.style.top =
        `calc(50% + ${dotY}px)`;


    kickDot.style.opacity =
        "1";


    if (
        hasBall &&
        !ballMoving
    ) {

        placeBallWithPlayer();

    }


    draw();

}


/* =================================================
   فحص هل حان وقت بدء الشحن
================================================= */

function checkKickCharging() {

    if (charging)
        return;


    if (!hasBall)
        return;


    if (
        kickDirectionDistance >=
        kickChargeDistance
    ) {

        startCharging();

    }

}


/* =================================================
   بداية الركلة
================================================= */

kickControl.addEventListener(
    "pointerdown",
    function(e) {

        e.preventDefault();

        e.stopPropagation();


        if (!hasBall)
            return;


        if (ballMoving)
            return;


        kickTouching = true;

        kickPointerId =
            e.pointerId;


        try {

            kickControl.setPointerCapture(
                e.pointerId
            );

        } catch (error) {}


        charging = false;

        power = 0;

        kickDirectionDistance = 0;


        powerBar.style.width =
            "0%";


        kickButton.style.transform =
            "scale(1)";


        updateKickDirection(
            e.clientX,
            e.clientY
        );

    }
);


/* =================================================
   حركة إصبع الركلة
================================================= */

kickControl.addEventListener(
    "pointermove",
    function(e) {

        if (!kickTouching)
            return;


        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        e.preventDefault();


        updateKickDirection(
            e.clientX,
            e.clientY
        );


        checkKickCharging();

    }
);


/* =================================================
   بدء شحن الركلة
================================================= */

function startCharging() {

    if (ballMoving)
        return;


    if (!hasBall)
        return;


    if (charging)
        return;


    charging = true;

    power = 0;


    kickButton.style.transform =
        "scale(0.92)";


    chargePower();

}


/* =================================================
   شحن الركلة
================================================= */

function chargePower() {

    if (!charging)
        return;


    power += powerSpeed;


    if (
        power >=
        maxPower
    ) {

        power =
            maxPower;

    }


    powerBar.style.width =
        power + "%";


    if (
        power <
        maxPower
    ) {

        requestAnimationFrame(
            chargePower
        );

    }

}


/* =================================================
   رفع إصبع الركلة
================================================= */

kickControl.addEventListener(
    "pointerup",
    function(e) {

        if (
            e.pointerId !==
            kickPointerId
        )
            return;


        e.preventDefault();


        updateKickDirection(
            e.clientX,
            e.clientY
        );


        if (
            charging &&
            hasBall
        ) {

            kick();

        } else {

            charging = false;

            power = 0;

            powerBar.style.width =
                "0%";

        }


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

        kickDirectionDistance = 0;

    }
);


/* =================================================
   إلغاء الركلة
================================================= */

kickControl.addEventListener(
    "pointercancel",
    function() {

        charging = false;

        power = 0;


        powerBar.style.width =
            "0%";


        kickButton.style.transform =
            "scale(1)";


        kickDot.style.opacity =
            "0";


        kickTouching = false;

        kickPointerId = null;

        kickDirectionDistance = 0;

    }
);


/* =================================================
   تنفيذ الركلة
================================================= */

function kick() {

    if (!charging)
        return;


    if (!hasBall) {

        charging = false;

        power = 0;


        powerBar.style.width =
            "0%";


        return;

    }


    charging = false;


    hasBall = false;


    /*
       بعد الركلة نرجع إلى الاختيار
       التلقائي للأقرب.
    */

    manualControlLock =
        false;


    lastManualSwitchTime =
        0;


    if (power < 1)
        power = 1;


    const minSpeed = 3;

    const maxSpeed = 12;


    const speed =
        minSpeed +
        (power / 100) *
        (maxSpeed - minSpeed);


    ballVX =
        Math.cos(aimAngle) *
        speed;


    ballVY =
        Math.sin(aimAngle) *
        speed;


    ballMoving = true;


    power = 0;


    powerBar.style.width =
        "0%";


    kickButton.style.transform =
        "scale(1)";

}


/* =================================================
   منع التكبير والإيماءات في iPhone / Safari
================================================= */

let lastTouchEnd = 0;


document.addEventListener(
    "touchend",
    function(e) {

        const now =
            Date.now();


        if (
            now - lastTouchEnd <= 300
        ) {

            e.preventDefault();

        }


        lastTouchEnd = now;

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturestart",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


game.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


game.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


game.addEventListener(
    "dblclick",
    function(e) {

        e.preventDefault();

    },
    {
        passive: false
    }
);


/* =================================================
   تغيير حجم الشاشة
================================================= */

window.addEventListener(
    "resize",
    function() {

        gameWidth =
            game.clientWidth;

        gameHeight =
            game.clientHeight;


        playerX =
            Math.max(
                19,
                Math.min(
                    gameWidth - 19,
                    playerX
                )
            );


        playerY =
            Math.max(
                19,
                Math.min(
                    gameHeight - 19,
                    playerY
                )
            );


        teammateX =
            Math.max(
                19,
                Math.min(
                    gameWidth - 19,
                    teammateX
                )
            );


        teammateY =
            Math.max(
                19,
                Math.min(
                    gameHeight - 19,
                    teammateY
                )
            );


        if (
            hasBall &&
            !ballMoving
        ) {

            placeBallWithPlayer();

        }

    }
);


/* =================================================
   البداية
================================================= */

updateScore();

placeBallWithPlayer();

draw();

update();

</script>
