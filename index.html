/* =========================================================

function createPlayer(

/* =========================================================
   HELPERS
========================================================= */

function clamp(value,min,max){

return Math.max(
min,
Math.min(max,value)
);

}


function distanceBetween(a,b){

return Math.hypot(
a.x-b.x,
a.y-b.y
);

}


function getAllPlayers(){

return[
...teamPlayers,
...opponents
];

}


/* =========================================================
   ROLE BOUNDS
========================================================= */

function getRoleBounds(p){

let minX=PLAYER_RADIUS;
let maxX=worldWidth-PLAYER_RADIUS;

let minY=PLAYER_RADIUS;
let maxY=worldHeight-PLAYER_RADIUS;


if(
p.team==="blue" &&
p===teamPlayers[activePlayerIndex]
){

return{
minX,
maxX,
minY,
maxY
};

}


if(p.team==="blue"){

if(p.role==="guard"){

minY=worldHeight*0.85;
maxY=worldHeight-PLAYER_RADIUS;

}

else if(p.role==="defender"){

minY=worldHeight*0.65;
maxY=worldHeight*0.90;

}

else if(p.role==="wing"){

minY=worldHeight*0.40;
maxY=worldHeight*0.70;

}

else if(p.role==="forward"){

minY=worldHeight*0.30;
maxY=worldHeight*0.65;

}

}


if(p.team==="red"){

if(p.role==="guard"){

minY=PLAYER_RADIUS;
maxY=worldHeight*0.15;

}

else if(p.role==="defender"){

minY=worldHeight*0.10;
maxY=worldHeight*0.35;

}

else if(p.role==="wing"){

minY=worldHeight*0.30;
maxY=worldHeight*0.60;

}

else if(p.role==="forward"){

minY=worldHeight*0.35;
maxY=worldHeight*0.65;

}

}


return{
minX,
maxX,
minY,
maxY
};

}


/* =========================================================
   GOAL POST COLLISION
========================================================= */

function resolveGoalPostCollision(p,x,y){

const centerX=worldWidth/2;

const halfGoal=GOAL_WIDTH/2;

const posts=[

{
x:centerX-halfGoal,
y:0
},

{
x:centerX+halfGoal,
y:0
},

{
x:centerX-halfGoal,
y:worldHeight
},

{
x:centerX+halfGoal,
y:worldHeight
}

];


for(const post of posts){

let dx=x-post.x;
let dy=y-post.y;

let d=Math.hypot(dx,dy);


if(d<PLAYER_GOAL_POST_DISTANCE){

if(d<0.001){

dx=1;
dy=0;
d=1;

}

dx/=d;
dy/=d;

const push=
PLAYER_GOAL_POST_DISTANCE-d;

x+=dx*push;
y+=dy*push;

}

}


return{x,y};

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function resolvePlayerCollisions(
p,
x,
y
){

const players=getAllPlayers();


for(
let iteration=0;
iteration<PLAYER_COLLISION_ITERATIONS;
iteration++
){

let changed=false;


for(const other of players){

if(other===p)
continue;


let dx=x-other.x;
let dy=y-other.y;

let d=Math.hypot(dx,dy);


if(d<PLAYER_COLLISION_DISTANCE){

if(d<0.001){

dx=p.moveX;
dy=p.moveY;


if(
Math.hypot(dx,dy)<0.001
){

dx=p.x-other.x;
dy=p.y-other.y;

}


if(
Math.hypot(dx,dy)<0.001
){

dx=1;
dy=0;

}


d=Math.hypot(dx,dy);

}


dx/=d;
dy/=d;


const push=
PLAYER_COLLISION_DISTANCE-d;


x+=dx*push;
y+=dy*push;

changed=true;

}

}


if(!changed)
break;

}


const postResult=
resolveGoalPostCollision(
p,
x,
y
);

x=postResult.x;
y=postResult.y;


x=clamp(
x,
PLAYER_RADIUS,
worldWidth-PLAYER_RADIUS
);

y=clamp(
y,
PLAYER_RADIUS,
worldHeight-PLAYER_RADIUS
);


return{x,y};

}


/* =========================================================
   MOVE PLAYER
========================================================= */

function movePlayer(
p,
dx,
dy,
dt
){

const length=Math.hypot(dx,dy);


if(length>1){

dx/=length;
dy/=length;

}


if(
Math.abs(dx)>0.01 ||
Math.abs(dy)>0.01
){

p.direction=Math.atan2(dy,dx);

}


p.moveX=dx;
p.moveY=dy;


let targetX=
p.x+
dx*p.speed*dt;

let targetY=
p.y+
dy*p.speed*dt;


const resolved=
resolvePlayerCollisions(
p,
targetX,
targetY
);


p.x=resolved.x;
p.y=resolved.y;

return true;

}


/* =========================================================
   CONTROLLED PLAYER
========================================================= */

function updateControlledPlayer(dt){

const p=
teamPlayers[activePlayerIndex];


if(!p)
return;


p.controlled=true;


const dx=joystickX;
const dy=joystickY;


p.moveX=dx;
p.moveY=dy;


if(
Math.abs(dx)>0.01 ||
Math.abs(dy)>0.01
){

movePlayer(
p,
dx,
dy,
dt
);

}

}


/* =========================================================
   BLUE AI
========================================================= */

function updateBlueAI(dt){

for(
let i=0;
i<teamPlayers.length;
i++
){

if(i===activePlayerIndex)
continue;


const p=teamPlayers[i];


if(ballOwner===p)
continue;


let targetX=p.anchorX;
let targetY=p.anchorY;


const distToBall=
Math.hypot(
ballX-p.x,
ballY-p.y
);


const redHasBall=
ballOwner &&
ballOwner.team==="red";


if(redHasBall){

if(p.role==="defender"){

if(distToBall<400){

targetX=ballX;
targetY=ballY;

}

}

else if(p.role==="midfielder"){

targetX=clamp(
ballX,

Math.random()*0.35;

}

function chooseRedShotType(
p,
distanceToGoal
){

const r=Math.random();


if(
distanceToGoal>
RED_LONG_SHOT_DISTANCE
){

if(r<0.34)
return"long-left";

if(r<0.68)
return"long-right";

return"long-direct";

}


/* =========================================================
   FIND BEST RED PASS
========================================================= */

function findBestRedPass(p){

let bestPlayer=null;
let bestScore=-Infinity;


for(const receiver of opponents){

if(receiver===p)
continue;


const distance=
Math.hypot(
receiver.x-p.x,
receiver.y-p.y
);


if(
distance<RED_PASS_MIN_DISTANCE ||
distance>RED_PASS_MAX_DISTANCE
){

continue;

}


/*
   اللاعب الذي أمام حامل الكرة
   باتجاه مرمى الأحمر يحصل على أفضلية.

   الأحمر يهاجم باتجاه الأسفل،
   لذلك y الأكبر يعني تقدمًا.
*/

const forwardProgress=
clamp(
(receiver.y-p.y)/
RED_PASS_MAX_DISTANCE,
-1,
1
);


const forwardScore=
forwardProgress*190;


/*
   التقدم الفعلي نحو المرمى.
*/

const carrierGoalDistance=
Math.hypot(
worldWidth/2-p.x,
worldHeight-p.y
);

const receiverGoalDistance=
Math.hypot(
worldWidth/2-receiver.x,
worldHeight-receiver.y
);


const goalProgress=
clamp(
carrierGoalDistance-receiverGoalDistance,
-RED_PASS_MAX_DISTANCE,
RED_PASS_MAX_DISTANCE
);


const goalScore=
(goalProgress/RED_PASS_MAX_DISTANCE)*150;


/*
   المسافة عن أقرب لاعب أزرق.
*/

let nearestBlueDistance=Infinity;


for(const blue of teamPlayers){

const d=
Math.hypot(
blue.x-receiver.x,
blue.y-receiver.y
);


if(d<nearestBlueDistance){

nearestBlueDistance=d;

}

}


/*
   إذا كان المستقبل ملتصقًا تقريبًا
   بلاعب أزرق، لا نختاره.

   لكن لا نمنع التمرير إذا كان الضغط
   شديدًا على حامل الكرة ولا يوجد
   مستقبل مثالي.
*/

if(
nearestBlueDistance<RED_PASS_SAFE_DISTANCE
){

continue;

}


const safetyScore=
clamp(
nearestBlueDistance/300,
0,
1
)*170;


/*
   المسافة المثالية للتمريرة.
*/

const idealDistance=390;

const distanceScore=
100-
Math.abs(distance-idealDistance)*0.28;


/*
   توزيع اللاعبين.

   الجناح والمهاجم مفيدان للتقدم،
   المدافع خيار آمن،
   الحارس أقل أولوية.
*/

let roleScore=0;


if(receiver.role==="forward")
roleScore=65;

else if(receiver.role==="wing")
roleScore=55;

else if(receiver.role==="defender")
roleScore=20;

else if(receiver.role==="guard")
roleScore=-40;


/*
   تشجيع التمرير الجانبي عندما يكون
   أفضل من التمرير العمودي المباشر.
*/

const horizontalSeparation=
Math.abs(
receiver.x-p.x
);

const horizontalScore=
clamp(
horizontalSeparation/250,
0,
1
)*35;


let score=
forwardScore+
goalScore+
safetyScore+
distanceScore+
roleScore+
horizontalScore;


/*
   إذا كان المستقبل أمام حامل الكرة
   بشكل واضح، يحصل على أفضلية إضافية.
*/

if(receiver.y>p.y+80){

score+=75;

}


/*
   إذا كان المستقبل خلف حامل الكرة
   فلا نمنعه تمامًا، لكن نقلل الأولوية.
*/

if(receiver.y<p.y-100){

score-=100;

}


if(score>bestScore){

bestScore=score;
bestPlayer=receiver;

}

}


return{
player:bestPlayer,
score:bestScore
};

}


/* =========================================================
   RED PASS
========================================================= */

function redPass(p,force=false){

if(ballOwner!==p)
return false;


if(
p.passCooldown>0 &&
!force
){

return false;

}


const result=
findBestRedPass(p);


const receiver=
result.player;


if(!receiver)
return false;


let nearestBlueDistance=Infinity;


for(const blue of teamPlayers){

const d=
Math.hypot(
blue.x-p.x,
blue.y-p.y
);


if(d<nearestBlueDistance){

nearestBlueDistance=d;

}

}


const underPressure=
nearestBlueDistance<=
RED_PASS_PRESSURE_DISTANCE;


let passChance=
RED_PASS_NORMAL_CHANCE;


if(underPressure){

passChance=
RED_PASS_PRESSURE_CHANCE;

}
else if(
p.y<worldHeight*0.50
){

passChance=
RED_PASS_FAR_CHANCE;

}


/*
   عند الضغط الشديد:
   التمرير شبه مؤكد.

   force يستخدم فقط في الحالات التي
   نريد فيها تمريرة تكتيكية واضحة.
*/

if(
!force &&
Math.random()>passChance
){

return false;

}


/*
   نقطة الاستلام تكون أمام المستقبل
   قليلًا في اتجاه تقدمه.

   هذا يجعل الكرة تتحرك إلى اللاعب
   بدل أن تمر خلفه.
*/

let leadX=receiver.x;
let leadY=receiver.y;


const receiverMoveLength=
Math.hypot(
receiver.moveX,
receiver.moveY
);


if(receiverMoveLength>0.01){

leadX+=
(
receiver.moveX/
receiverMoveLength
)*35;

leadY+=
(
receiver.moveY/
receiverMoveLength
)*35;

}
else{

/*
   إذا كان المستقبل لا يتحرك،
   نضع الكرة أمامه باتجاه مرمى الأحمر.
*/

leadY+=35;

}


leadX=clamp(
leadX,
BALL_RADIUS,
worldWidth-BALL_RADIUS
);

leadY=clamp(
leadY,
BALL_RADIUS,
worldHeight-BALL_RADIUS
);


let dx=leadX-p.x;
let dy=leadY-p.y;

const d=Math.hypot(dx,dy);


if(d<1)
return false;


dx/=d;
dy/=d;


const distanceRatio=
clamp(
d/RED_PASS_MAX_DISTANCE,
0,
1
);


const speed=
RED_PASS_SPEED_MIN+
(
RED_PASS_SPEED_MAX-
RED_PASS_SPEED_MIN
)*
distanceRatio;


ballOwner=null;

ballX=p.x+dx*28;
ballY=p.y+dy*28;

ballVX=dx*speed;
ballVY=dy*speed;


p.currentAction="pass";

receiver.currentAction="receive";

resetRedPassCooldown(p);
resetRedDecisionTimer(p);


/*
   المستقبل لا يملك الكرة بعد.
   سيأخذها عندما تصل الكرة إلى
   مسافة الالتقاط.
*/

return true;

}


/* =========================================================
   RED SHOOT
========================================================= */

function redShoot(p){

if(ballOwner!==p)
return false;

if(p.shotCooldown>0)
return false;


const goalX=worldWidth/2;
const goalY=worldHeight;


const dxGoal=goalX-p.x;
const dyGoal=goalY-p.y;


const distanceToGoal=
Math.hypot(
dxGoal,
dyGoal
);


if(distanceToGoal<RED_SHOT_MIN_DISTANCE)
return false;

if(distanceToGoal>RED_SHOT_MAX_DISTANCE)
return false;

if(p.y>worldHeight*0.96)
return false;


const shotType=
chooseRedShotType(
p,
distanceToGoal
);


let targetX=goalX;
let targetY=worldHeight+45;


if(shotType==="direct"){

targetX=
goalX+
(Math.random()-0.5)*24;

targetY=worldHeight+45;

}

else if(shotType==="diagonal-left"){

targetX=goalX-RED_SHOT_TARGET_OFFSET;
targetY=worldHeight+45;

}

else if(shotType==="diagonal-right"){

targetX=goalX+RED_SHOT_TARGET_OFFSET;
targetY=worldHeight+45;

}

else if(shotType==="long-left"){

targetX=goalX-48;
targetY=worldHeight+60;

}

else if(shotType==="long-right"){

targetX=goalX+48;
targetY=worldHeight+60;

}

else if(shotType==="long-direct"){

targetX=
goalX+
(Math.random()-0.5)*35;

targetY=worldHeight+60;

}

else if(shotType==="power"){

targetX=
goalX+
(
Math.random()<0.5
?-42
:42
);

targetY=worldHeight+35;

}


let dx=targetX-p.x;
let dy=targetY-p.y;

const d=Math.hypot(dx,dy);


if(d<1)
return false;


dx/=d;
dy/=d;


const distanceRatio=
clamp(
distanceToGoal/
RED_SHOT_MAX_DISTANCE,
0,
1
);


let speed=
RED_SHOT_SPEED_MIN+
(
RED_SHOT_SPEED_MAX-
RED_SHOT_SPEED_MIN
)*
(
0.45+
distanceRatio*0.55
);


if(shotType==="power")
speed*=1.08;


ballOwner=null;

ballX=p.x+dx*30;
ballY=p.y+dy*30;

ballVX=dx*speed;
ballVY=dy*speed;


p.shotType=shotType;
p.currentAction="shot";


resetRedShotCooldown(p);
resetRedDecisionTimer(p);


return true;

}


/* =========================================================
   RED TACKLE
========================================================= */

function redTryTackle(p){

if(
!ballOwner ||
ballOwner.team!=="blue"
){

return false;

}


const owner=ballOwner;


const d=
Math.hypot(
owner.x-p.x,
owner.y-p.y
);


if(d>RED_TACKLE_DISTANCE)
return false;


const proximity=
1-d/RED_TACKLE_DISTANCE;


const chance=
RED_TACKLE_CHANCE*
(
0.55+
proximity*0.75
);


if(Math.random()<chance){

ballOwner=p;

ballVX=0;
ballVY=0;

lastOwnerChangeTime=
performance.now();

p.currentAction="won-ball";

resetRedDecisionTimer(p);
resetRedPassCooldown(p);

return true;

}


return false;

}

);

nearestDistance=d;
nearest=p;

}

};

let nearestBlue=null;

);

nearestBlueDistance=d;
nearestBlue=blue;

}

}

   عند الضغط الشديد، الأحمر يمرر

*/

nearestBlueDistance<=
RED_PASS_PRESSURE_DISTANCE
){

if(redPass(p,true)){

continue;

*/

resetRedDecisionTimer(p);


const goalX=worldWidth/2;

goalY-p.y
);

RED_PASS_NORMAL_CHANCE;

*/

if(p.y<worldHeight*0.48){

passChance=
RED_PASS_FAR_CHANCE;

}


/*
   إذا كان قريبًا من المرمى،
   نعطي التسديد أولوية أكبر.
*/

passChance=0.30;

}

   محاولة التمرير.

   إذا نجحت التمريرة تنتهي حركة
   حامل الكرة في هذه الدورة.
*/

p.passCooldown<=0 &&
Math.random()<passChance
){

if(redPass(p)){

continue;

}

}


/* =========================================
   التسديد
========================================= */

let shotChance=0.10;


if(distToGoal<300)
shotChance=0.36;

else if(distToGoal<450)
shotChance=0.27;

else if(distToGoal<650)
shotChance=0.18;

else
shotChance=0.10;

shotChance=0.52;

){

let moveTargetY=targetY;

const dy=moveTargetY-p.y;

p,
dx/d,
dy/d,
dt
);

}

else{

const goalY=worldHeight-240;

/* =========================================================
   BALL AI
========================================================= */

function updateBallAI(dt){

if(!ballOwner)
return;


const p=ballOwner;


if(
p===teamPlayers[activePlayerIndex]
)
return;


if(p.team==="red")
return;


const goalX=worldWidth/2;
const goalY=0;


const distToGoal=
Math.hypot(
goalX-p.x,
goalY-p.y
);


if(distToGoal<280){

if(Math.random()<0.04){

let dx=goalX-p.x;
let dy=goalY-p.y;

const d=Math.hypot(dx,dy);


if(d<1)
return;


dx/=d;
dy/=d;


ballOwner=null;

ballX=p.x+dx*30;
ballY=p.y+dy*30;

ballVX=dx*700;
ballVY=dy*700;

return;

}

}


let nearEnemy=null;


for(const e of opponents){

const d=
Math.hypot(
e.x-p.x,
e.y-p.y
);


if(d<65){

nearEnemy=e;
break;

}

}


if(nearEnemy){

if(Math.random()<0.06){

ballOwner=null;

ballX=p.x;
ballY=p.y-30;

ballVX=0;
ballVY=-450;

return;

}

}


let dx=goalX-p.x;
let dy=goalY-p.y;

const d=Math.hypot(dx,dy);


if(d<1)
return;


dx/=d;
dy/=d;


movePlayer(
p,
dx,
dy,
dt
);

}


/* =========================================================
   ACTIVE PLAYER
========================================================= */

function setActivePlayer(index,manual=false){

if(
index<0 ||
index>=teamPlayers.length
)
return false;


const newPlayer=teamPlayers[index];

if(!newPlayer)
return false;


cancelCharging();


for(
let i=0;
i<teamPlayers.length;
i++
){

teamPlayers[i].controlled=false;
teamPlayers[i].moveX=0;
teamPlayers[i].moveY=0;

}


activePlayerIndex=index;

newPlayer.controlled=true;


if(manual){

manualSelectedPlayerIndex=index;

lastManualSwitchTime=
performance.now();

manualControlLockUntil=
performance.now()+
MANUAL_CONTROL_LOCK;

lastAutoSwitchTime=
performance.now();

}


aimAngle=-Math.PI/2;

aimX=worldWidth/2;
aimY=0;


return true;

}

}


/* =========================================================
   FIND BEST DEFENDER
========================================================= */

function findBestBlueDefender(){

if(
!ballOwner ||
ballOwner.team!=="red"
){

return{
index:-1,
distance:Infinity
};

}


const red=ballOwner;

let bestIndex=-1;
let bestDistance=Infinity;


for(
let i=0;
i<teamPlayers.length;
i++
){

const p=teamPlayers[i];


const d=
Math.hypot(
p.x-red.x,
p.y-red.y
);


if(d<bestDistance){

bestDistance=d;
bestIndex=i;

}

}


return{
index:bestIndex,
distance:bestDistance
};

}


/* =========================================================
   AUTO SWITCH
========================================================= */

function autoSwitchPlayer(){

if(
!matchRunning ||
matchEnded
)
return;


const now=performance.now();


if(
now-lastAutoSwitchTime<
AUTO_SWITCH_COOLDOWN
)
return;


const activePlayer=
teamPlayers[activePlayerIndex];


if(!activePlayer)
return;


if(
ballOwner &&
ballOwner.team==="red"
){

const best=
findBestBlueDefender();


if(best.index<0)
return;


const activeDistance=
Math.hypot(
activePlayer.x-ballOwner.x,
activePlayer.y-ballOwner.y
);


const bestDistance=best.distance;


if(best.index===activePlayerIndex)
return;


if(
bestDistance>
BLUE_DEFEND_CONTROL_DISTANCE
)
return;


const emergency=
bestDistance<=
BLUE_DEFEND_EMERGENCY_DISTANCE;


if(
now<manualControlLockUntil &&
!emergency
)
return;


const clearlyBetter=
bestDistance+
BLUE_DEFEND_SWITCH_ADVANTAGE<
activeDistance;


const activeFar=
activeDistance>
BLUE_DEFEND_CONTROL_DISTANCE;


if(
!clearlyBetter &&
!activeFar &&
!emergency
)
return;


if(
setActivePlayer(
best.index,
false
)
){

lastAutoSwitchTime=now;

}


return;

}


if(
ballOwner &&
ballOwner.team==="blue"
){

const ownerIndex=
teamPlayers.indexOf(
ballOwner
);


if(ownerIndex<0)
return;


if(
ownerIndex===
activePlayerIndex
)
return;


const ownerDistance=
Math.hypot(
ballOwner.x-ballX,
ballOwner.y-ballY
);


const emergencyOwner=
ownerDistance<=
AUTO_EMERGENCY_DISTANCE;


if(
now<manualControlLockUntil &&
!emergencyOwner
)
return;


if(
now-lastOwnerChangeTime<
AUTO_OWNER_SWITCH_DELAY
)
return;


if(
setActivePlayer(
ownerIndex,
false
)
){

lastAutoSwitchTime=now;

}


return;

}


if(!ballOwner){

const activeDistance=
Math.hypot(
activePlayer.x-ballX,
activePlayer.y-ballY
);


const best=
findBestPlayerForBall();


if(best.index<0)
return;


const bestDistance=best.distance;


if(bestDistance>=activeDistance)
return;


const emergencyClose=
bestDistance<=AUTO_EMERGENCY_DISTANCE;


const clearlyCloser=
bestDistance+
AUTO_SWITCH_ADVANTAGE<
activeDistance;


if(now<manualControlLockUntil){

const emergencyAllowed=
emergencyClose &&
(
bestDistance+
AUTO_EMERGENCY_ADVANTAGE<
activeDistance
);


if(!emergencyAllowed)
return;

}


const activeTooFar=
activeDistance>
AUTO_CONTROL_DISTANCE;


const bestInsideRange=
bestDistance<=
AUTO_CONTROL_DISTANCE;


if(
!clearlyCloser &&
!activeTooFar
)
return;


if(!bestInsideRange)
return;


if(
setActivePlayer(
best.index,
false
)
){

lastAutoSwitchTime=now;

}

}

}


/* =========================================================
   AUTOMATIC BLUE TACKLE
   v4.1.0
========================================================= */

function automaticBlueTackle(){

if(
!matchRunning ||
matchEnded
)
return false;


if(
!ballOwner ||
ballOwner.team!=="red"
){

return false;

}


const red=ballOwner;


/*
   نفحص جميع لاعبي الأزرق.

   لا يوجد:
   - زر
   - احتمال
   - اتجاه نظر
   - زمن انتظار
   - اندفاع
   - شرط لاعب محدد

   مجرد تلامس = افتكاك مباشر.
*/

for(const blue of teamPlayers){

const distance=
Math.hypot(
blue.x-red.x,
blue.y-red.y
);


if(
distance<=PLAYER_COLLISION_DISTANCE
){

const now=performance.now();


ballOwner=blue;

ballVX=0;
ballVY=0;

ballX=blue.x;
ballY=blue.y-25;


lastOwnerChangeTime=now;

blue.hasBall=true;
blue.currentAction="won-ball";


/*
   إذا كان اللاعب الذي افتك الكرة
   ليس اللاعب المتحكم حاليًا،
   ينتقل التحكم إليه مباشرة.
*/

const index=
teamPlayers.indexOf(blue);


if(
index>=0 &&
index!==activePlayerIndex
){

setActivePlayer(
index,
false
);

lastAutoSwitchTime=now;

}


return true;

}

}


return false;

}

/* =========================================================
   SEPARATE ALL PLAYERS
========================================================= */

function separateAllPlayers(){

const players=getAllPlayers();


for(
let i=0;
i<players.length;
i++
){

for(
let j=i+1;
j<players.length;
j++
){

const a=players[i];
const b=players[j];


const isAFixed=
a===teamPlayers[activePlayerIndex];

const isBFixed=
b===teamPlayers[activePlayerIndex];


let dx=b.x-a.x;
let dy=b.y-a.y;

let d=Math.hypot(dx,dy);


if(d===0){

dx=1;
dy=0;
d=1;

}


if(
d<
PLAYER_COLLISION_DISTANCE
){

const push=
(
PLAYER_COLLISION_DISTANCE-d
)/2;


dx/=d;
dy/=d;


if(!isAFixed){

a.x-=dx*push;
a.y-=dy*push;

}


if(!isBFixed){

b.x+=dx*push;
b.y+=dy*push;

}

}

}

}

}

worldWidth-viewWidth
);

);


const desiredX=
clamp(
targetX,
0,
maxX
);

targetY,

maxY
);

desiredX-cameraX

)*

}

function resetJoystick(){

joystickActive=false;
joystickPointerId=null;

joystickX=0;
joystickY=0;

joystickCenter.style.transform=
"translate(-50%,-50%)";

}


function updateJoystick(
clientX,
clientY
){

const rect=
movePad.getBoundingClientRect();


const centerX=
rect.left+
rect.width/2;

const centerY=
rect.top+
rect.height/2;


let dx=
clientX-centerX;

let dy=
clientY-centerY;


const d=Math.hypot(dx,dy);


if(
d>JOYSTICK_MAX_DISTANCE
){

dx=dx/d*
JOYSTICK_MAX_DISTANCE;

dy=dy/d*
JOYSTICK_MAX_DISTANCE;

}


joystickX=
dx/JOYSTICK_MAX_DISTANCE;

joystickY=
dy/JOYSTICK_MAX_DISTANCE;


joystickCenter.style.transform=
`translate(
calc(-50% + ${dx}px),
calc(-50% + ${dy}px)
)`;

}

/* =========================================================
   AIM
========================================================= */

function updateAim(
clientX,
clientY
){

if(!chargingActive)
return;


let dx=
clientX-kickStartX;

let dy=
clientY-kickStartY;


const d=Math.hypot(dx,dy);


if(d<6)
return;


kickDragDistance=d;


aimAngle=Math.atan2(dy,dx);

aimX=Math.cos(aimAngle);
aimY=Math.sin(aimAngle);

}


/* =========================================================
   DISTANCE FACTOR
========================================================= */

function getDistanceFactor(){

const goalX=worldWidth/2;
const goalY=0;


const distToGoal=
Math.hypot(
ballX-goalX,
ballY-goalY
);


const maxDist=
Math.hypot(
worldWidth,
worldHeight
);


const t=
Math.min(
1,
distToGoal/maxDist
);


return 1-t*0.7;

}


/* =========================================================
   KICK
========================================================= */

function kickBall(){

const p=
teamPlayers[activePlayerIndex];


if(!p){

return;

}


if(ballOwner!==p){

cancelCharging();
return;

}


const dx=
Math.cos(aimAngle);

const dy=
Math.sin(aimAngle);


const distanceFactor=
getDistanceFactor();


const chargeNormalized=
Math.max(
0.15,
chargePower/100
);


const finalPower=
chargeNormalized*
distanceFactor;


const speed=
350+
finalPower*950;


ballOwner=null;

p.hasBall=false;

ballX=p.x+dx*30;
ballY=p.y+dy*30;

ballVX=dx*speed;
ballVY=dy*speed;


cancelCharging();

}

/* =========================================================
   BALL PHYSICS
========================================================= */

function updateBall(dt){

if(ballOwner){

for(const p of teamPlayers){

p.hasBall=false;

}

for(const p of opponents){

p.hasBall=false;

}

ballOwner.hasBall=true;

ballX=ballOwner.x;
ballY=ballOwner.y-25;

ballVX=0;
ballVY=0;

return;

}


ballX+=ballVX*dt;
ballY+=ballVY*dt;


const friction=
Math.pow(
FRICTION,
dt*60
);


ballVX*=friction;
ballVY*=friction;


if(Math.abs(ballVX)<0.15)
ballVX=0;

if(Math.abs(ballVY)<0.15)
ballVY=0;


if(ballX<BALL_RADIUS){

ballX=BALL_RADIUS;

ballVX=
Math.abs(ballVX)*0.8;

}


if(
ballX>
worldWidth-BALL_RADIUS
){

ballX=
worldWidth-BALL_RADIUS;

ballVX=
-Math.abs(ballVX)*0.8;

}


/* TOP GOAL */

if(
ballY<
-GOAL_EXIT_DISTANCE
){

const insideGoal=
Math.abs(
ballX-worldWidth/2
)<=
GOAL_WIDTH/2;


if(insideGoal){

scoreBlue();
return;

}

else{

ballY=BALL_RADIUS;

ballVY=
Math.abs(ballVY)*0.8;

}

}


if(
ballY<=BALL_RADIUS &&
ballY>=-GOAL_EXIT_DISTANCE
){

const insideGoal=
Math.abs(
ballX-worldWidth/2
)<=
GOAL_WIDTH/2;


if(
!insideGoal &&
ballVY<0
){

ballY=BALL_RADIUS;

ballVY=
Math.abs(ballVY)*0.8;

}

}


/* BOTTOM GOAL */

if(
ballY>
worldHeight+GOAL_EXIT_DISTANCE
){

const insideGoal=
Math.abs(
ballX-worldWidth/2
)<=
GOAL_WIDTH/2;


if(insideGoal){

scoreRed();
return;

}

else{

ballY=
worldHeight-BALL_RADIUS;

ballVY=
-Math.abs(ballVY)*0.8;

}

}


if(
ballY>=worldHeight-BALL_RADIUS &&
ballY<=worldHeight+GOAL_EXIT_DISTANCE
){

const insideGoal=
Math.abs(
ballX-worldWidth/2
)<=
GOAL_WIDTH/2;


if(
!insideGoal &&
ballVY>0
){

ballY=
worldHeight-BALL_RADIUS;

ballVY=
-Math.abs(ballVY)*0.8;

}

}

}

/* =========================================================
   MANUAL SWITCH
========================================================= */

function switchPlayer(){

if(
!matchRunning ||
matchEnded
)
return;


const now=performance.now();


if(
now-lastManualSwitchTime<
MANUAL_SWITCH_COOLDOWN
)
return;


let candidates=[];


for(
let i=0;
i<teamPlayers.length;
i++
){

if(i===activePlayerIndex)
continue;


const p=teamPlayers[i];


const d=
Math.hypot(
p.x-ballX,
p.y-ballY
);


candidates.push({
index:i,
distance:d
});

}


if(candidates.length===0)
return;


candidates.sort(
(a,b)=>
a.distance-b.distance
);


const selected=candidates[0];


if(
setActivePlayer(
selected.index,
true
)
){

manualSelectedPlayerIndex=
selected.index;

lastManualSwitchTime=now;

manualControlLockUntil=
now+
MANUAL_CONTROL_LOCK;

lastAutoSwitchTime=now;

draw();

}

}

const minutes=
Math.floor(seconds/60);

const secs=
seconds%60;


return(
String(minutes).padStart(2,"0")
+
":"
+
String(secs).padStart(2,"0")
);

}


function updateMatchTimer(dt){

if(
!matchRunning ||
matchEnded
)
return;


matchTimeRemaining-=dt;


if(matchTimeRemaining<=0){

matchTimeRemaining=0;

endMatch();

}


matchTimeElement.textContent=
formatTime(
matchTimeRemaining
);


if(
matchTimeRemaining<=10
){

matchTimeElement.classList.add(
"warning"
);

}

else{

matchTimeElement.classList.remove(
"warning"
);

}

}


/* =========================================================
   END MATCH
========================================================= */

function endMatch(){

matchRunning=false;
matchEnded=true;

cancelCharging();
resetJoystick();

finalScore.textContent=
`🔵 ${blueScore} - ${redScore} 🔴`;

matchEnd.style.display="flex";

}


/* =========================================================
   NEW MATCH
========================================================= */

newMatch.addEventListener(
"click",
e=>{

e.preventDefault();


blueScore=0;
redScore=0;

blueScoreElement.textContent="0";
redScoreElement.textContent="0";

matchTimeRemaining=
MATCH_DURATION;

matchRunning=true;
matchEnded=false;

goalCelebrationActive=false;


if(goalResetTimer){

clearTimeout(goalResetTimer);
goalResetTimer=null;

}


goalCelebration.style.display="none";
matchEnd.style.display="none";


activePlayerIndex=0;
manualSelectedPlayerIndex=0;

lastManualSwitchTime=0;
lastAutoSwitchTime=0;

manualControlLockUntil=0;

lastOwnerChangeTime=0;


createTeams();


ballOwner=teamPlayers[0];

ballX=ballOwner.x;
ballY=ballOwner.y-25;

ballVX=0;
ballVY=0;


cameraX=
clamp(
ballX-viewWidth/2,
0,
Math.max(
0,
worldWidth-viewWidth
)
);


cameraY=
clamp(
ballY-viewHeight/2,
0,
Math.max(
0,
worldHeight-viewHeight
)
);


resetJoystick();
cancelCharging();

setActivePlayer(0);

draw();

}
);


/* =========================================================
   RESIZE
========================================================= */

function resizeGame(){

viewWidth=game.clientWidth;
viewHeight=game.clientHeight;

worldWidth=WORLD_WIDTH;
worldHeight=WORLD_HEIGHT;


field.style.width=
`${worldWidth}px`;

field.style.height=
`${worldHeight}px`;

}


/* =========================================================
   UPDATE GAME
========================================================= */

function updateGame(dt){

if(
!matchRunning ||
matchEnded
)
return;


updateMatchTimer(dt);

updateControlledPlayer(dt);

updateBlueAI(dt);

updateRedAI(dt);

updateBallAI(dt);


/*
   الافتكاك الأحمر القديم.
*/

tackle();


/*
   الافتكاك الأزرق المباشر.

   يتم بعد حركة اللاعبين وقبل
   تحديث الكرة، حتى إذا وصل لاعب
   أزرق إلى حامل الكرة الأحمر في
   هذه الدورة يتم الافتكاك فورًا.
*/

automaticBlueTackle();


updateCharge(dt);

updateBall(dt);

tryBallPickup();

autoSwitchPlayer();

separateAllPlayers();

updateCamera();

draw();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(now){

let dt=
(now-lastTimestamp)/1000;


lastTimestamp=now;

dt=Math.min(dt,0.033);

updateGame(dt);

requestAnimationFrame(
gameLoop
);

}


/* =========================================================
   INITIALIZE
========================================================= */

function initializeGame(){

resizeGame();

createTeams();

ballOwner=teamPlayers[0];

ballX=ballOwner.x;
ballY=ballOwner.y-25;

ballVX=0;
ballVY=0;

activePlayerIndex=0;
manualSelectedPlayerIndex=0;

lastOwnerChangeTime=
performance.now();

setActivePlayer(0);


cameraX=
clamp(
ballX-viewWidth/2,
0,
Math.max(
0,
worldWidth-viewWidth
)
);


cameraY=
clamp(
ballY-viewHeight/2,
0,
Math.max(
0,
worldHeight-viewHeight
)
);


draw();

lastTimestamp=
performance.now();

requestAnimationFrame(
gameLoop
);

}


/* =========================================================
   RESIZE EVENT
========================================================= */

window.addEventListener(
"resize",
()=>{

resizeGame();


ballX=
clamp(
ballX,
BALL_RADIUS,
worldWidth-BALL_RADIUS
);


ballY=
clamp(
ballY,
BALL_RADIUS,
worldHeight-BALL_RADIUS
);


cameraX=
clamp(
cameraX,
0,
Math.max(
0,
worldWidth-viewWidth
)
);


cameraY=
clamp(
cameraY,
0,
Math.max(
0,
worldHeight-viewHeight
)
);


draw();

}
);


/* =========================================================
   START
========================================================= */

initializeGame();

</script>
